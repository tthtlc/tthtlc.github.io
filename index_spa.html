---
layout: none
title: "Random Picks"
---
<!DOCTYPE html>
<html lang="en">
{% include monograph-head.html %}
<body>
{% include monograph-masthead.html %}

<section class="ma-section">
  <div class="ma-section-head">
    <h2>Random picks</h2>
  </div>
  <p class="ma-section-note">Scroll for more — each figure is chosen at random from the collection.</p>
</section>

<div id="iframeList"></div>

{% include monograph-footer.html %}

<script>
  document.addEventListener("contextmenu", function(event) { event.preventDefault(); });
  const masterList = [{% for f in site.data.visualizations %}'{{ f }}',{% endfor %}];

  function getRandomHtml() {
    return masterList[Math.floor(Math.random() * masterList.length)];
  }

  function loadIframe() {
    const url = getRandomHtml();
    const fileName = url.split('/').pop();
    const wrap = document.createElement('div');
    wrap.className = 'ma-wide';
    wrap.innerHTML =
      '<p class="ma-wide-caption">Figure · <a href="' + url + '" target="_blank" rel="noopener">' + fileName + '</a></p>' +
      '<iframe src="' + url + '" title="' + fileName + '"></iframe>';
    document.getElementById('iframeList').appendChild(wrap);
  }

  for (let i = 0; i < 3; i++) { loadIframe(); }

  window.addEventListener('scroll', () => {
    const nearBottom = window.innerHeight + window.scrollY >= document.body.offsetHeight - 200;
    if (nearBottom) { loadIframe(); }
  });
</script>
</body>
</html>
