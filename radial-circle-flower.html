<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Radial circle flower</title><style>*{box-sizing:border-box}body{margin:0;background:#000;color:#edf2fa;font:14px system-ui}canvas{display:block;width:100vw;height:100vh;touch-action:none}#panel{position:absolute;top:16px;left:16px;width:285px;max-height:calc(100vh - 32px);overflow:auto;padding:18px;background:#11151eea;border:1px solid #ffffff25;border-radius:15px}h1{font-size:19px;margin:0 0 8px}p{font-size:12px;line-height:1.5;color:#abb7c8}label{display:flex;justify-content:space-between;align-items:center;margin-top:13px}input[type=range]{width:100%;accent-color:#ccd6e7}output{color:#c7e4ff;font-variant-numeric:tabular-nums}button{background:#ffffff13;color:inherit;border:1px solid #ffffff30;border-radius:8px;padding:9px;margin:12px 4px 0 0;cursor:pointer}#toggle{position:absolute;right:16px;top:8px;background:#141822d9}.note{font:12px monospace;color:#aabed6;line-height:1.8;margin-top:14px}@media(max-width:600px){#panel{width:225px;top:8px;left:8px;padding:12px}.note{display:none}h1{font-size:16px}}</style></head><body><canvas id="c" aria-label="Six radial families of nested white circles on black"></canvas><section id="panel"><h1>Radial circle flower</h1><p>Nested circles arranged in radial groups. Each circle passes through the same central point, producing the overlapping petals.</p><label>Radial groups <output id="groupsOut"></output></label><input id="groups" type="range" min="1" max="16" value="6" step="1"><label>Circles per group <output id="countOut"></output></label><input id="count" type="range" min="1" max="60" value="19" step="1"><label>Smallest / largest radius <output id="minOut"></output></label><input id="min" type="range" min="0.03" max="0.95" step="0.01" value="0.25"><label>Radius spacing exponent <output id="spacingOut"></output></label><input id="spacing" type="range" min="0.3" max="3" step="0.01" value="1.25"><label>Pattern rotation <output id="rotationOut"></output></label><input id="rotation" type="range" min="0" max="360" value="0"><label>Line width <output id="widthOut"></output></label><input id="width" type="range" min="0.2" max="3" step="0.1" value="1"><label>Line opacity <output id="opacityOut"></output></label><input id="opacity" type="range" min="0.05" max="1" step="0.01" value="0.46"><label>Subtle glow<input id="glow" type="checkbox" checked></label><label>Animate rotation<input id="animate" type="checkbox"></label><button id="reset">Reset</button><button id="save">Save PNG</button><div class="note">θₖ = π/2 + 2πk / groups<br>center = ρ (cos θₖ, sin θₖ)<br>circle radius = ρ<br>Drag: rotate · Scroll/pinch: zoom<br>H: hide controls · Space: animate</div></section><button id="toggle">Hide controls</button><script>
'use strict';const $=id=>document.getElementById(id),canvas=$('c'),ctx=canvas.getContext('2d',{alpha:false}),TAU=2*Math.PI;const defaults={groups:6,count:19,min:.25,spacing:1.25,rotation:0,width:1,opacity:.46};let W,H,zoom=1,dragRotation=0,spin=0,dirty=true,last=null,pinch=0;const pointers=new Map();
function update(){for(let id in defaults)$(id+'Out').value=$(id).value+(id==='rotation'?'°':'');dirty=true}for(let id in defaults)$(id).oninput=update;for(let id of ['glow','animate'])$(id).onchange=()=>dirty=true;
function resize(){W=innerWidth;H=innerHeight;let d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*d);canvas.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0);dirty=true}addEventListener('resize',resize);resize();update();
function draw(){ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);const groups=+$('groups').value,count=+$('count').value,min=+$('min').value,exponent=+$('spacing').value,rotation=+$('rotation').value*Math.PI/180+dragRotation+spin,maxRadius=Math.min(W,H)*.235*zoom,line=+$('width').value,opacity=+$('opacity').value;
const circles=[];for(let k=0;k<groups;k++){let theta=Math.PI/2+TAU*k/groups+rotation;for(let j=0;j<count;j++){let t=count===1?1:j/(count-1),rho=maxRadius*(min+(1-min)*Math.pow(t,exponent));circles.push([W/2+rho*Math.cos(theta),H/2-rho*Math.sin(theta),rho])}}
function pass(width,alpha){ctx.lineWidth=width;ctx.strokeStyle=`rgba(240,244,255,${alpha})`;for(let [x,y,r] of circles){ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.stroke()}}
if($('glow').checked){pass(line*4,opacity*.045);pass(line*2,opacity*.10)}pass(line,opacity)}
function frame(t){let dt=last===null?0:Math.min((t-last)/1000,.05);last=t;if($('animate').checked&&!pointers.size){spin+=dt*.12;dirty=true}if(dirty){draw();dirty=false}requestAnimationFrame(frame)}
function reset(){for(let id in defaults)$(id).value=defaults[id];$('glow').checked=true;$('animate').checked=false;zoom=1;dragRotation=0;spin=0;update()}$('reset').onclick=reset;canvas.ondblclick=()=>{zoom=1;dragRotation=0;dirty=true};function toggle(){let hidden=!$('panel').hidden;$('panel').hidden=hidden;$('toggle').textContent=hidden?'Show controls':'Hide controls'}$('toggle').onclick=toggle;
$('save').onclick=()=>{draw();let a=document.createElement('a');a.download='radial-circle-flower.png';a.href=canvas.toDataURL('image/png');a.click()};
canvas.onpointerdown=e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});pinch=0};canvas.onpointermove=e=>{if(!pointers.has(e.pointerId))return;let old=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){let a=Math.atan2(old.y-H/2,old.x-W/2),b=Math.atan2(e.clientY-H/2,e.clientX-W/2),d=b-a;dragRotation-=Math.atan2(Math.sin(d),Math.cos(d))}else{let [a,b]=[...pointers.values()],distance=Math.hypot(a.x-b.x,a.y-b.y);if(pinch)zoom=Math.max(.2,Math.min(4,zoom*distance/pinch));pinch=distance}dirty=true};function release(e){pointers.delete(e.pointerId);pinch=0}canvas.onpointerup=release;canvas.onpointercancel=release;canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.2,Math.min(4,zoom*Math.exp(-e.deltaY*.001)));dirty=true},{passive:false});addEventListener('keydown',e=>{if(e.target.matches('input,button'))return;if(e.key.toLowerCase()==='h')toggle();if(e.code==='Space'){e.preventDefault();$('animate').checked=!$('animate').checked;dirty=true}});requestAnimationFrame(frame);
</script></body></html>
