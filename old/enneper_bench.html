<!DOCTYPE html><html><body><pre id="out">pending</pre><canvas id="c" width="1200" height="800"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let s=12345;const rnd=()=>{s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff};
const segs=[];for(let i=0;i<12000;i++)segs.push([rnd()*1200,rnd()*800,rnd()*1200,rnd()*800,0.2+rnd()*0.8]);
function frame(){
 ctx.clearRect(0,0,1200,800);ctx.lineWidth=.6;
 for(const q of segs){ctx.strokeStyle=`rgba(131,217,193,${q[4].toFixed(3)})`;ctx.beginPath();ctx.moveTo(q[0],q[1]);ctx.lineTo(q[2],q[3]);ctx.stroke();}
}
const t0=performance.now();for(let i=0;i<10;i++)frame();const t1=performance.now();
document.getElementById('out').textContent='avg_ms_per_frame='+((t1-t0)/10).toFixed(2)+' segs='+segs.length;
</script></body></html>
