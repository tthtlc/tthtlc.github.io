<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="/assets/math-art.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Möbius Strip Wireframe — twists · density · size</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(ellipse at 50% 38%, #1c2836, #0d1117 78%);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: grab;
            touch-action: none;
        }
        canvas:active { cursor: grabbing; }

        /* Compact micro-font control panel */
        .controls {
            position: absolute;
            top: 14px;
            left: 14px;
            z-index: 2;
            min-width: 230px;
            background: rgba(13, 17, 23, .82);
            border: 1px solid #2a3443;
            border-radius: 10px;
            padding: 12px 14px;
            backdrop-filter: blur(6px);
        }
        .controls h1 {
            margin: 0 0 12px;
            font-family: "Courier New", monospace;
            font-size: 11px;
            font-weight: normal;
            letter-spacing: .18em;
            text-transform: uppercase;
            color: #91a5bf;
        }
        .controls label {
            display: block;
            font-family: "Courier New", monospace;
            font-size: 10px;
            color: #c7d2e3;
            margin-bottom: 10px;
        }
        .controls .row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 4px;
        }
        .controls output {
            font-family: "Courier New", monospace;
            color: #88dbc6;
        }
        .controls input[type=range] {
            width: 100%;
            accent-color: #88dbc6;
        }
</style>
<!-- Google tag (gtag.js) --> <script async src="https://www.googletagmanager.com/gtag/js?id=G-GEX61LPT08"></script> <script>   window.dataLayer = window.dataLayer || [];   function gtag(){dataLayer.push(arguments);}   gtag('js', new Date());   gtag('config', 'G-GEX61LPT08'); </script> </head>
<body>
    <canvas id="canvas"></canvas>

    <div class="controls">
        <h1>Twisted band</h1>
        <label>
            <span class="row"><span>Twists k (half-twists)</span><output id="twistsOut"></output></span>
            <input id="twists" type="range" min="0" max="12" step="1" value="1">
        </label>
        <label>
            <span class="row"><span>Cross-lines (density)</span><output id="densityOut"></output></span>
            <input id="density" type="range" min="4" max="36" step="1" value="10">
        </label>
        <label>
            <span class="row"><span>Size</span><output id="sizeOut"></output></span>
            <input id="size" type="range" min="40" max="400" step="5" value="150">
        </label>
    </div>

    <script>
document.addEventListener("contextmenu", function(event) { event.preventDefault(); });
        const $ = id => document.getElementById(id);
        const canvas = $('canvas');
        const ctx = canvas.getContext('2d');
        const TAU = Math.PI * 2;

        let width = 1, height = 1, dpr = 1;

        function resize() {
            dpr = Math.min(window.devicePixelRatio || 1, 2);
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = Math.round(width * dpr);
            canvas.height = Math.round(height * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            scheduleDraw();
        }
        window.addEventListener('resize', resize);

        // Gentle 3/4 default view so the twist is visible immediately
        let rotationX = -0.55;
        let rotationY = 0.45;

        let isDragging = false;
        let prev = { x: 0, y: 0 };

        canvas.addEventListener('pointerdown', (event) => {
            isDragging = true;
            canvas.setPointerCapture(event.pointerId);
            prev = { x: event.clientX, y: event.clientY };
        });
        canvas.addEventListener('pointerup', () => { isDragging = false; });
        canvas.addEventListener('pointercancel', () => { isDragging = false; });
        canvas.addEventListener('pointermove', (event) => {
            if (!isDragging) return;
            const dx = event.clientX - prev.x;
            const dy = event.clientY - prev.y;
            rotationY += dx * 0.01;
            rotationX += dy * 0.01;
            prev = { x: event.clientX, y: event.clientY };
            scheduleDraw();
        });

        // Throttle redraws to one per animation frame
        let pending = false;
        function scheduleDraw() {
            if (pending) return;
            pending = true;
            requestAnimationFrame(() => { pending = false; draw(); });
        }

        function rotate(point, angleX, angleY) {
            let [x, y, z] = point;

            // Rotation around Y-axis
            let cosY = Math.cos(angleY);
            let sinY = Math.sin(angleY);
            let newX = cosY * x + sinY * z;
            let newZ = -sinY * x + cosY * z;
            x = newX;
            z = newZ;

            // Rotation around X-axis
            let cosX = Math.cos(angleX);
            let sinX = Math.sin(angleX);
            let newY = cosX * y - sinX * z;
            z = sinX * y + cosX * z;
            y = newY;

            return [x, y, z];
        }

        // Generalized twisted band: k half-twists (k = 1 is the classic Möbius strip)
        function mobiusCoordinates(u, v, k) {
            const x = Math.cos(u) * (1 + v * Math.cos(k * u / 2));
            const y = Math.sin(u) * (1 + v * Math.cos(k * u / 2));
            const z = v * Math.sin(k * u / 2);
            return [x, y, z];
        }

        function getColor(u, v) {
            // Full saturation, high lightness — bright on the dark background
            const hue = ((u / TAU * 360 + v * 240) % 360 + 360) % 360;
            const light = 50 + 30 * (v + 0.5); // 50–80%
            return `hsl(${hue.toFixed(0)},100%,${light.toFixed(0)}%)`;
        }

        function drawBand(p) {
            const uStep = TAU / (p.crossLines * 5);
            const vStep = 1 / p.crossLines;

            for (let u = 0; u < TAU; u += uStep) {
                for (let v = -0.5; v <= 0.5; v += vStep) {
                    const [x, y, z] = rotate(mobiusCoordinates(u, v, p.k), rotationX, rotationY);
                    const [nextX, nextY, nextZ] = rotate(mobiusCoordinates(u + uStep, v, p.k), rotationX, rotationY);
                    const [nextX2, nextY2, nextZ2] = rotate(mobiusCoordinates(u, v + vStep, p.k), rotationX, rotationY);

                    const color = getColor(u, v);

                    drawLine(project(x, y, z, p.scale), project(nextX, nextY, nextZ, p.scale), color);
                    drawLine(project(x, y, z, p.scale), project(nextX2, nextY2, nextZ2, p.scale), color);
                }
            }
        }

        function project(x, y, z, scale) {
            const perspective = 500 / (500 + z);
            return [
                width / 2 + x * scale * perspective,
                height / 2 - y * scale * perspective
            ];
        }

        function drawLine(start, end, color) {
            ctx.beginPath();
            ctx.moveTo(start[0], start[1]);
            ctx.lineTo(end[0], end[1]);
            ctx.strokeStyle = color;
            ctx.stroke();
        }

        // Micro-font formula strip, drawn on the canvas, centered at the bottom
        function strip(p) {
            const h = 46;
            ctx.fillStyle = 'rgba(13, 17, 23, .85)';
            ctx.fillRect(0, height - h, width, h);
            ctx.font = '9px "Courier New", monospace';
            ctx.textAlign = 'center';
            ctx.fillStyle = '#a4e3d4';
            ctx.fillText('r(u,v) = ( cos u·(1 + v·cos(k·u/2)),  sin u·(1 + v·cos(k·u/2)),  v·sin(k·u/2) )', width / 2, height - h + 15);
            ctx.fillStyle = '#91a5bf';
            ctx.fillText(
                `u ∈ [0, 2π) · v ∈ [−½, ½] · k = ${p.k} half-twist${p.k === 1 ? '' : 's'} · ${p.crossLines} cross-lines · ${p.crossLines * 5} ring-lines · size ${p.size} · drag to rotate`,
                width / 2, height - h + 30
            );
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            const p = {
                k: +$('twists').value,
                crossLines: +$('density').value,
                size: +$('size').value,
                scale: +$('size').value * Math.min(width, height) / 500
            };
            drawBand(p);
            strip(p);
        }

        for (const id of ['twists', 'density', 'size']) {
            $(id).addEventListener('input', () => {
                $(id + 'Out').value = $(id).value;
                scheduleDraw();
            });
        }
        for (const id of ['twists', 'density', 'size']) $(id + 'Out').value = $(id).value;

        resize();
    </script>
</body>
</html>
