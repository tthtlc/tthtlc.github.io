  <p class="ma-section-note">Figures in progress — explore pages being worked on.</p>
  <div id="master-list-container" class="ma-figure-grid"></div>
</section>

<div class="ma-notes">{% include gitalk.html %}</div>

{% include monograph-footer.html %}

<script>
  document.addEventListener("contextmenu", function(event) { event.preventDefault(); });
  const htmlFiles = [
'chopstick_explore.html',
'double_hypotrochoid_explore.html',
'double_hypotrochoid_moving_offset_explore.html',
'double_hypotrochoid_rotating_offset_explore.html',
'double_motion_explore.html',
'double_ngon_explore.html',
'ellipse_sinusoidal_moving_color_background_explore.html',
'epicycloid_add_epicycloid_explore.html',
'epicycloid_explore_savepng.html',
'epicycloid_variant_explore_savepng.html',
'hypotrochoid_explore.html',
'hypotrochoid_explore_savepng.html',
'lissajous2_explore.html',
'lissajous_explore.html',
'parametric_curve2_explore.html',
'parametric_curve3_explore.html',
'petal_add_epicycloid_explore.html',
'sine_sinusoidal_moving_color_background_explore.html',
'spiral_tube_explore.html',
'spirograph_explore.html',
'square_chasing_explore.html',
'triangle_sinusoidal_explore.html',
'triangle_sinusoidal_moving_color_background_explore.html',
'triangle_sinusoidal_moving_color_explore.html',
'vortex_explore.html',
  ];

  function pretty(f) {
    return f.replace(/\.html$/, '').replace(/[_-]/g, ' ').replace(/\b\w/g, function (c) { return c.toUpperCase(); });
  }
  function renderHtmlFiles(fileList, containerId) {
    const container = document.getElementById(containerId);
    fileList.forEach((file, idx) => {
      const fig = document.createElement('div');
      fig.className = 'ma-figure';
      const a = document.createElement('a');
      a.className = 'ma-figure-link';
      a.href = file;
      a.target = '_blank';
      a.rel = 'noopener';
      a.innerHTML =
        '<div class="ma-plate"><iframe data-src="' + file + '" loading="lazy" title="' + file + ' preview"></iframe><span class="ma-plate-open">Open</span></div>' +
        '<div class="ma-figure-body"><div class="ma-figure-title">' + pretty(file) + '</div>' +
        '<div class="ma-figure-file">Fig. ' + (idx + 1) + ' · ' + file + '</div></div>';
      fig.appendChild(a);
      container.appendChild(fig);
    });
    const frames = container.querySelectorAll('iframe[data-src]');
    if ('IntersectionObserver' in window) {
      const io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) {
            const f = e.target; f.src = f.dataset.src; f.removeAttribute('data-src'); io.unobserve(f);
          }
        });
      }, { rootMargin: '400px 0px' });
      frames.forEach(function (f) { io.observe(f); });
    } else {
      frames.forEach(function (f) { f.src = f.dataset.src; });
    }
  }

  function getRandomFiles(arr, num, ex) {
    return arr.filter(f => !f.includes(ex)).sort(() => 0.5 - Math.random()).slice(0, num);
  }

  renderHtmlFiles(getRandomFiles(htmlFiles, 8, 'AAAAAAA'), 'master-list-container');
</script>
</body>
</html>
