<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="/assets/math-art.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Click Game</title>
    <style>
        body {
            position: relative;
            background-color: #f8f9fa;
            overflow: hidden;
            margin: 0;
            height: 100vh;
        }
        .heart {
            position: absolute;
            width: 50px;
            height: 50px;
            cursor: pointer;
        }
        .controls {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.2);
        }
        .stats {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.2);
            display: flex;
            gap: 10px;
            font-size: 18px;
        }
        .remaining {
            color: red;
        }
        .overlay {
            position: fixed;
            inset: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.5);
            z-index: 10;
        }
        .overlay-card {
            background: white;
            padding: 30px 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.3);
        }
        .overlay-card button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="stats">
        <span>Clicked: <span id="clickedCount">0</span></span>
        <span class="remaining">Remaining: <span id="remainingCount">0</span></span>
    </div>
    <div class="controls">
        <label>Speed: </label>
        <input type="range" id="speedControl" min="500" max="3000" value="1500">
    </div>
    <div id="gameOverOverlay" class="overlay">
        <div class="overlay-card">
            <h1>Game Over!</h1>
            <p>Too many hearts on screen.</p>
            <button onclick="resetGame()">Play Again</button>
        </div>
    </div>

    <script>
        const colors = ['red', 'blue', 'green', 'purple', 'orange'];
        let heartInterval = 1500;
        let hearts = [];
        let clickedCount = 0;
        let gameOver = false;

        function updateStats() {
            document.getElementById("clickedCount").textContent = clickedCount;
            document.getElementById("remainingCount").textContent = hearts.length;
        }

        function endGame() {
            gameOver = true;
            clearInterval(heartSpawner);
            document.getElementById("gameOverOverlay").style.display = "flex";
        }

        function resetGame() {
            hearts.forEach(h => h.remove());
            hearts = [];
            clickedCount = 0;
            gameOver = false;
            updateStats();
            document.getElementById("gameOverOverlay").style.display = "none";
            heartSpawner = setInterval(createHeart, heartInterval);
        }

        function createHeart() {
            if (gameOver) return;
            if (hearts.length >= 10) {
                endGame();
                return;
            }

            let numHearts = Math.min(Math.floor(Math.random() * 4) + 1, 10 - hearts.length);
            for (let i = 0; i < numHearts; i++) {
                let heart = document.createElement('div');
                heart.classList.add('heart');
                heart.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                heart.style.top = Math.random() * (window.innerHeight - 50) + 'px';
                heart.style.left = Math.random() * (window.innerWidth - 50) + 'px';
                heart.style.clipPath = "polygon(50% 15%, 61% 3%, 75% 0, 88% 6%, 100% 19%, 100% 37%, 91% 54%, 75% 74%, 50% 100%, 25% 74%, 9% 54%, 0 37%, 0 19%, 12% 6%, 25% 0, 39% 3%)";
                document.body.appendChild(heart);
                hearts.push(heart);
                updateStats();
                heart.onclick = () => {
                    heart.remove();
                    hearts = hearts.filter(h => h !== heart);
                    clickedCount++;
                    updateStats();
                };
            }
        }

        function updateSpeed() {
            if (gameOver) return;
            heartInterval = document.getElementById("speedControl").value;
            clearInterval(heartSpawner);
            heartSpawner = setInterval(createHeart, heartInterval);
        }

        document.getElementById("speedControl").addEventListener("input", updateSpeed);
        let heartSpawner = setInterval(createHeart, heartInterval);
    </script>
</body>
</html>
