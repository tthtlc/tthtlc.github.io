

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Animated Flower Pattern</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Segoe UI', sans-serif;
    color: #eee;
    overflow: hidden;
  }
  h1 {
    margin: 10px 0;
    font-size: 1.4rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #f0a0ff;
  }
  canvas {
    border-radius: 12px;
    box-shadow: 0 0 40px rgba(240, 160, 255, 0.2);
  }
  .controls {
    margin: 15px 0;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }
  button {
    padding: 8px 18px;
    border: 2px solid #f0a0ff;
    background: transparent;
    color: #f0a0ff;
    border-radius: 20px;
    cursor: pointer;
    font-size: 0.85rem;
    transition: all 0.3s;
  }
  button:hover, button.active {
    background: #f0a0ff;
    color: #1a1a2e;
  }
  label {
    font-size: 0.8rem;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  input[type="range"] {
    accent-color: #f0a0ff;
  }
</style>
</head>
<body>

<h1>🌸 Animated Flower Pattern</h1>
<canvas id="canvas" width="700" height="700"></canvas>
<div class="controls">
  <button class="active" onclick="setMode(0)">Classic</button>
  <button onclick="setMode(1)">Rainbow Pulse</button>
  <button onclick="setMode(2)">Neon Glow</button>
  <button onclick="setMode(3)">Fire Bloom</button>
  <button onclick="setMode(4)">Ocean Wave</button>
  <button onclick="setMode(5)">Galaxy Spin</button>
  <label>Petals: <input type="range" id="petalCount" min="6" max="30" value="16" oninput="updateParams()"></label>
  <label>Speed: <input type="range" id="speed" min="1" max="10" value="3" oninput="updateParams()"></label>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const cx = W / 2, cy = H / 2;

let mode = 0;
let time = 0;
let numPetals = 16;
let animSpeed = 3;
let petals = [];

// ─── Color Palettes ───
const palettes = [
  // Classic (matching original)
  ['#4a8c3f', '#5ba84e', '#3d7a6e', '#6bbf5a', '#2e6b5e', '#7dd46a'],
  // Rainbow
  ['#ff4444', '#ff8800', '#ffdd00', '#44ff44', '#00aaff', '#aa44ff', '#ff44aa'],
  // Neon
  ['#00ff88', '#00ffcc', '#00ccff', '#4488ff', '#8844ff', '#cc44ff', '#ff44cc'],
  // Fire
  ['#ff2200', '#ff6600', '#ffaa00', '#ffdd00', '#ff8800', '#cc3300', '#991100'],
  // Ocean
  ['#003366', '#005588', '#0077aa', '#0099cc', '#00bbdd', '#00ddeeff', '#88eeff'],
  // Galaxy
  ['#1a0033', '#330066', '#660099', '#9933cc', '#cc66ff', '#ee99ff', '#ffffff']
];

// ─── Petal Class ───
class Petal {
  constructor(index, total) {
    this.index = index;
    this.total = total;
    this.baseAngle = (index / total) * Math.PI * 2;
    this.length = 120 + Math.random() * 30;
    this.width = 35 + Math.random() * 10;
    this.phase = Math.random() * Math.PI * 2;
  }

  getColor(t, mode) {
    const pal = palettes[mode];
    const ci = this.index % pal.length;
    const ci2 = (this.index + 1) % pal.length;
    const blend = (Math.sin(t * 2 + this.phase) + 1) / 2;
    return blendColors(pal[ci], pal[ci2], blend);
  }

  draw(ctx, t, mode) {
    const angle = this.baseAngle + Math.sin(t * 0.5 + this.phase) * 0.08;
    const breathe = 1 + Math.sin(t * 1.5 + this.phase) * 0.06;
    const len = this.length * breathe;
    const wid = this.width * breathe;
    const innerR = 60 + Math.sin(t * 0.8) * 8;

    const tipX = cx + Math.cos(angle) * (innerR + len);
    const tipY = cy + Math.sin(angle) * (innerR + len);
    const baseX = cx + Math.cos(angle) * innerR;
    const baseY = cy + Math.sin(angle) * innerR;

    const perpX = -Math.sin(angle);
    const perpY = Math.cos(angle);

    const color = this.getColor(t, mode);
    const outlineColor = mode === 2 ? '#ffffff' : '#cc2222';

    // Draw petal shape
    ctx.save();

    if (mode === 2) {
      // Neon glow
      ctx.shadowColor = color;
      ctx.shadowBlur = 20 + Math.sin(t * 3 + this.phase) * 10;
    }

    ctx.beginPath();
    ctx.moveTo(baseX, baseY);

    // Bezier curve for petal shape
    const cp1x = baseX + Math.cos(angle) * len * 0.3 + perpX * wid * 0.8;
    const cp1y = baseY + Math.sin(angle) * len * 0.3 + perpY * wid * 0.8;
    const cp2x = tipX - Math.cos(angle) * len * 0.1 + perpX * wid * 0.3;
    const cp2y = tipY - Math.sin(angle) * len * 0.1 + perpY * wid * 0.3;

    ctx.quadraticCurveTo(cp1x, cp1y, tipX, tipY);

    const cp3x = tipX - Math.cos(angle) * len * 0.1 - perpX * wid * 0.3;
    const cp3y = tipY - Math.sin(angle) * len * 0.1 - perpY * wid * 0.3;
    const cp4x = baseX + Math.cos(angle) * len * 0.3 - perpX * wid * 0.8;
    const cp4y = baseY + Math.sin(angle) * len * 0.3 - perpY * wid * 0.8;

    ctx.quadraticCurveTo(cp3x, cp3y, baseX, baseY);
    ctx.closePath();

    // Fill with gradient
    const grad = ctx.createLinearGradient(baseX, baseY, tipX, tipY);
    const alpha = mode === 4 ? 0.6 + Math.sin(t + this.phase) * 0.3 : 0.75;
    grad.addColorStop(0, colorWithAlpha(color, alpha * 0.5));
    grad.addColorStop(0.5, colorWithAlpha(color, alpha));
    grad.addColorStop(1, colorWithAlpha(color, alpha * 0.7));

    ctx.fillStyle = grad;
    ctx.fill();

    // Outline
    ctx.strokeStyle = outlineColor;
    ctx.lineWidth = mode === 2 ? 1.5 : 2;
    ctx.stroke();

    // Internal veins (radial lines)
    const numVeins = 5;
    ctx.strokeStyle = mode === 2 ? 'rgba(255,255,255,0.4)' : 'rgba(0,0,0,0.25)';
    ctx.lineWidth = 1;
    for (let v = 1; v <= numVeins; v++) {
      const frac = v / (numVeins + 1);
      const vx = baseX + (tipX - baseX) * frac;
      const vy = baseY + (tipY - baseY) * frac;
      const vwid = wid * Math.sin(frac * Math.PI) * 0.6;

      ctx.beginPath();
      ctx.moveTo(
        vx + perpX * vwid,
        vy + perpY * vwid
      );
      ctx.lineTo(
        vx - perpX * vwid,
        vy - perpY * vwid
      );
      ctx.stroke();
    }

    // Center vein
    ctx.strokeStyle = mode === 2 ? 'rgba(255,255,255,0.6)' : 'rgba(0,0,0,0.35)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(baseX, baseY);
    ctx.lineTo(tipX, tipY);
    ctx.stroke();

    ctx.restore();
  }
}

// ── Utility Functions ───
function hexToRgb(hex) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return { r, g, b };
}

function blendColors(c1, c2, t) {
  const a = hexToRgb(c1), b = hexToRgb(c2);
  const r = Math.round(a.r + (b.r - a.r) * t);
  const g = Math.round(a.g + (b.g - a.g) * t);
  const bl = Math.round(a.b + (b.b - a.b) * t);
  return `rgb(${r},${g},${bl})`;
}

function colorWithAlpha(color, alpha) {
  if (color.startsWith('rgb')) {
    return color.replace('rgb', 'rgba').replace(')', `,${alpha})`);
  }
  const { r, g, b } = hexToRgb(color);
  return `rgba(${r},${g},${b},${alpha})`;
}

// ─── Initialize Petals ───
function initPetals() {
  petals = [];
  for (let i = 0; i < numPetals; i++) {
    petals.push(new Petal(i, numPetals));
  }
}

// ─── Draw Center Hole ───
function drawCenter(t, mode) {
  const r = 55 + Math.sin(t * 0.8) * 5;
  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);

  if (mode === 2) {
    grad.addColorStop(0, 'rgba(0,0,0,0.9)');
    grad.addColorStop(0.7, 'rgba(20,0,40,0.8)');
    grad.addColorStop(1, 'rgba(100,0,200,0.3)');
  } else if (mode === 3) {
    grad.addColorStop(0, 'rgba(0,0,0,0.95)');
    grad.addColorStop(1, 'rgba(255,100,0,0.2)');
  } else {
    grad.addColorStop(0, 'rgba(255,255,255,0.95)');
    grad.addColorStop(1, 'rgba(255,255,255,0.1)');
  }

  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.strokeStyle = mode === 2 ? '#cc44ff' : '#cc2222';
  ctx.lineWidth = 2;
  ctx.stroke();
}

// ─── Background Effects ───
function drawBackground(t, mode) {
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, W, H);

  if (mode === 2) {
    // Dark purple bg for neon
    const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, W * 0.7);
    bg.addColorStop(0, '#1a0033');
    bg.addColorStop(1, '#0a0015');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);
  } else if (mode === 3) {
    const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, W * 0.7);
    bg.addColorStop(0, '#2a1000');
    bg.addColorStop(1, '#0a0500');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);
  } else if (mode === 4) {
    const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, W * 0.7);
    bg.addColorStop(0, '#001a33');
    bg.addColorStop(1, '#000a15');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);
  }

  // Subtle rotating ring
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(t * 0.1);
  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  ctx.lineWidth = 1;
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.arc(0, 0, 200 + i * 40, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.restore();
}

// ─── Particle Effects for special modes ───
const particles = [];
function spawnParticle(t, mode) {
  if (mode !== 2 && mode !== 3 && mode !== 5) return;
  if (Math.random() > 0.3) return;

  const angle = Math.random() * Math.PI * 2;
  const dist = 80 + Math.random() * 150;
  particles.push({
    x: cx + Math.cos(angle) * dist,
    y: cy + Math.sin(angle) * dist,
    vx: (Math.random() - 0.5) * 2,
    vy: (Math.random() - 0.5) * 2,
    life: 1,
    decay: 0.01 + Math.random() * 0.02,
    size: 1 + Math.random() * 3,
    color: palettes[mode][Math.floor(Math.random() * palettes[mode].length)]
  });
}

function drawParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life -= p.decay;
    if (p.life <= 0) { particles.splice(i, 1); continue; }

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fillStyle = colorWithAlpha(p.color, p.life * 0.8);
    ctx.fill();
  }
}

// ─── Main Render Loop ──
function render() {
  time += 0.016 * animSpeed;

  drawBackground(time, mode);

  // Draw petals (back to front for depth)
  for (let i = 0; i < petals.length; i++) {
    petals[i].draw(ctx, time, mode);
  }

  drawCenter(time, mode);
  spawnParticle(time, mode);
  drawParticles();

  // Mode-specific overlays
  if (mode === 5) {
    // Galaxy spin - rotating overlay
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(time * 0.3);
    ctx.globalAlpha = 0.08;
    for (let i = 0; i < 6; i++) {
      ctx.rotate(Math.PI / 3);
      const grad = ctx.createLinearGradient(0, 0, 300, 0);
      grad.addColorStop(0, 'transparent');
      grad.addColorStop(0.5, '#cc66ff');
      grad.addColorStop(1, 'transparent');
      ctx.fillStyle = grad;
      ctx.fillRect(0, -2, 300, 4);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  requestAnimationFrame(render);
}

// ─── Controls ───
function setMode(m) {
  mode = m;
  document.querySelectorAll('button').forEach((b, i) => {
    b.classList.toggle('active', i === m);
  });
  particles.length = 0;
}

function updateParams() {
  numPetals = parseInt(document.getElementById('petalCount').value);
  animSpeed = parseInt(document.getElementById('speed').value) / 3;
  initPetals();
}

// ─── Start ───
initPetals();
render();
</script>
</body>
</html>
