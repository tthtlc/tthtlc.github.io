<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boy's Surface – Parametric Surface</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #090a0f;
            font-family: 'STIX Two Text', 'Source Serif', Georgia, 'Times New Roman', serif;
            overflow: hidden;
            color: #e0e6ed;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        canvas { display: block; }

        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(15, 18, 25, 0.85);
            border: 1px solid rgba(0, 210, 255, 0.4);
            border-radius: 12px;
            padding: 20px 24px;
            max-width: 400px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        #info-panel h1 {
            font-size: 18px;
            color: #00d2ff;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }
        #info-panel .formula {
            font-family: 'STIX Two Text', 'Source Serif', Georgia, 'Times New Roman', serif;
            font-size: 14px;
            line-height: 1.8;
            color: #a8d8e8;
            margin-bottom: 14px;
            padding: 10px 14px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
        }
        #info-panel .formula span.var { color: #7ff0ff; font-style: italic; }
        #info-panel .formula .num { color: #e0f0ff; }
        #info-panel .formula .den { color: #ff9df0; }
        #info-panel .params {
            font-size: 13px;
            color: #8a99ad;
            line-height: 1.6;
        }
        #info-panel .params strong { color: #00d2ff; }

        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            background: rgba(15, 18, 25, 0.85);
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 12px;
            padding: 14px 20px;
            backdrop-filter: blur(10px);
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }
        #controls label {
            font-size: 13px;
            color: #c2d0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #controls input[type="range"] {
            width: 100px;
            accent-color: #00d2ff;
        }
        #controls button {
            background: rgba(0, 210, 255, 0.15);
            border: 1px solid rgba(0, 210, 255, 0.5);
            color: #00d2ff;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }
        #controls button:hover {
            background: rgba(0, 210, 255, 0.35);
        }
        #controls button.active {
            background: rgba(0, 210, 255, 0.5);
            color: #fff;
        }

        .value-display {
            color: #00d2ff;
            font-weight: bold;
            min-width: 30px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="info-panel">
        <h1>🫧 Boy's Surface</h1>
        <div class="formula">
            <span class="var">x</span>(<span class="var">u</span>,<span class="var">v</span>) =
            <span class="num">(√2·cos2u·cos²v + cos u·sin 2v)</span> / <span class="den">D</span><br>
            <span class="var">y</span>(<span class="var">u</span>,<span class="var">v</span>) =
            <span class="num">(√2·sin2u·cos²v − sin u·sin 2v)</span> / <span class="den">D</span><br>
            <span class="var">z</span>(<span class="var">u</span>,<span class="var">v</span>) =
            <span class="num">3·cos²v</span> / <span class="den">D</span><br>
            where <span class="den">D</span> = 2 − √2·sin 3u·sin 2v
        </div>
        <div class="params">
            <strong>Bryant–Kusner parametrization</strong><br>
            <span class="var">u</span> ∈ [0, π] &nbsp;|&nbsp;
            <span class="var">v</span> ∈ [0, π]<br>
            An immersion of the real projective plane in ℝ³.
        </div>
    </div>

    <div id="controls">
        <label>U Segments:
            <input type="range" id="segmentsU" min="20" max="200" step="10" value="120">
            <span class="value-display" id="segmentsUVal">120</span>
        </label>
        <label>V Segments:
            <input type="range" id="segmentsV" min="20" max="200" step="10" value="120">
            <span class="value-display" id="segmentsVVal">120</span>
        </label>
        <button id="toggleWireframe">Wireframe</button>
        <button id="toggleAutoRotate" class="active">Auto Rotate</button>
        <button id="resetView">Reset View</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // ─── Scene Setup ───
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        // Gradient background
        const bgCanvas = document.createElement('canvas');
        bgCanvas.width = 512; bgCanvas.height = 512;
        const bgCtx = bgCanvas.getContext('2d');
        const gradient = bgCtx.createRadialGradient(256, 256, 0, 256, 256, 362);
        gradient.addColorStop(0, '#1a2a3a');
        gradient.addColorStop(0.5, '#0d1420');
        gradient.addColorStop(1, '#05060a');
        bgCtx.fillStyle = gradient;
        bgCtx.fillRect(0, 0, 512, 512);
        const bgTexture = new THREE.CanvasTexture(bgCanvas);
        scene.background = bgTexture;

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(4, 3, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.2;

        // ─── Lighting ───
        const ambientLight = new THREE.AmbientLight(0x303048, 0.7);
        scene.add(ambientLight);

        const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.0);
        dirLight1.position.set(5, 8, 5);
        dirLight1.castShadow = true;
        scene.add(dirLight1);

        const dirLight2 = new THREE.DirectionalLight(0x4488cc, 0.5);
        dirLight2.position.set(-5, -3, -5);
        scene.add(dirLight2);

        const pointLight = new THREE.PointLight(0x00d2ff, 0.4, 20);
        pointLight.position.set(0, 3, 0);
        scene.add(pointLight);

        // ─── Bryant–Kusner Parametrization ───
        // Uniform scale + centering to sit the surface at the origin.
        const SCALE = 0.5;
        const OFFSET_Z = 1.28;

        function boyPoint(u, v) {
            const cosU = Math.cos(u), sinU = Math.sin(u);
            const cosV = Math.cos(v), sinV = Math.sin(v);
            const cos2U = Math.cos(2 * u), sin2U = Math.sin(2 * u);
            const sin3U = Math.sin(3 * u), sin2V = Math.sin(2 * v);

            const sqrt2 = Math.SQRT2;
            const denom = 2 - sqrt2 * sin3U * sin2V;

            const x = (sqrt2 * cos2U * cosV * cosV + cosU * sin2V) / denom;
            const y = (sqrt2 * sin2U * cosV * cosV - sinU * sin2V) / denom;
            const z = (3 * cosV * cosV) / denom;

            return {
                x: x * SCALE,
                y: y * SCALE,
                z: z * SCALE - OFFSET_Z
            };
        }

        // HSL → RGB for iridescent vertex coloring.
        function hslToRgb(h, s, l) {
            const c = (1 - Math.abs(2 * l - 1)) * s;
            const x = c * (1 - Math.abs(((h * 6) % 2) - 1));
            const m = l - c / 2;
            let r = 0, g = 0, b = 0;
            if (h < 1 / 6)      { r = c; g = x; b = 0; }
            else if (h < 2 / 6) { r = x; g = c; b = 0; }
            else if (h < 3 / 6) { r = 0; g = c; b = x; }
            else if (h < 4 / 6) { r = 0; g = x; b = c; }
            else if (h < 5 / 6) { r = x; g = 0; b = c; }
            else                { r = c; g = 0; b = x; }
            return { r: r + m, g: g + m, b: b + m };
        }

        // ─── Surface Generation ───
        let surfaceMesh = null;
        let wireframeMesh = null;
        let showWireframe = false;

        function createSurface(segmentsU, segmentsV) {
            const geometry = new THREE.BufferGeometry();
            const vertices = [];
            const normals = [];
            const colors = [];
            const indices = [];

            const uMax = Math.PI;
            const vMax = Math.PI;

            // Generate vertices
            for (let i = 0; i <= segmentsU; i++) {
                const u = (i / segmentsU) * uMax;
                for (let j = 0; j <= segmentsV; j++) {
                    const v = (j / segmentsV) * vMax;

                    const p = boyPoint(u, v);
                    vertices.push(p.x, p.y, p.z);

                    // Approximate normal via partial derivatives (finite differences)
                    const du = 0.001;
                    const dv = 0.001;

                    const pdu = boyPoint(u + du, v);
                    const pdv = boyPoint(u, v + dv);

                    const tx = pdu.x - p.x, ty = pdu.y - p.y, tz = pdu.z - p.z;
                    const sx = pdv.x - p.x, sy = pdv.y - p.y, sz = pdv.z - p.z;

                    const nx = ty * sz - tz * sy;
                    const ny = tz * sx - tx * sz;
                    const nz = tx * sy - ty * sx;
                    const len = Math.sqrt(nx * nx + ny * ny + nz * nz) || 1;

                    normals.push(nx / len, ny / len, nz / len);

                    // Iridescent color mapped across the (u, v) domain
                    const hue = ((u / uMax) * 0.7 + (v / vMax) * 0.3) % 1.0;
                    const { r, g, b } = hslToRgb(hue, 0.85, 0.55);
                    colors.push(r, g, b);
                }
            }

            // Generate indices
            for (let i = 0; i < segmentsU; i++) {
                for (let j = 0; j < segmentsV; j++) {
                    const a = i * (segmentsV + 1) + j;
                    const b = a + segmentsV + 1;
                    const c = a + 1;
                    const d = b + 1;

                    indices.push(a, b, c);
                    indices.push(c, b, d);
                }
            }

            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            geometry.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            geometry.setIndex(indices);
            geometry.computeVertexNormals();

            return geometry;
        }

        function buildSurface() {
            const segmentsU = parseInt(document.getElementById('segmentsU').value);
            const segmentsV = parseInt(document.getElementById('segmentsV').value);

            // Remove old meshes
            if (surfaceMesh) { scene.remove(surfaceMesh); surfaceMesh.geometry.dispose(); surfaceMesh.material.dispose(); }
            if (wireframeMesh) { scene.remove(wireframeMesh); wireframeMesh.geometry.dispose(); wireframeMesh.material.dispose(); }

            const geometry = createSurface(segmentsU, segmentsV);

            // Solid material
            const material = new THREE.MeshPhongMaterial({
                vertexColors: true,
                side: THREE.DoubleSide,
                shininess: 60,
                specular: new THREE.Color(0x446688),
                flatShading: false,
                transparent: false,
                opacity: 1.0
            });

            surfaceMesh = new THREE.Mesh(geometry, material);
            surfaceMesh.castShadow = true;
            surfaceMesh.receiveShadow = true;
            scene.add(surfaceMesh);

            // Wireframe
            const wireGeo = new THREE.WireframeGeometry(geometry);
            const wireMat = new THREE.LineBasicMaterial({
                color: 0x003344,
                transparent: true,
                opacity: 0.35
            });
            wireframeMesh = new THREE.LineSegments(wireGeo, wireMat);
            wireframeMesh.visible = showWireframe;
            scene.add(wireframeMesh);
        }

        buildSurface();

        // ─── Controls ───
        const sliders = ['segmentsU', 'segmentsV'];
        const displays = ['segmentsUVal', 'segmentsVVal'];

        sliders.forEach((id, i) => {
            const el = document.getElementById(id);
            const disp = document.getElementById(displays[i]);
            el.addEventListener('input', () => {
                disp.textContent = el.value;
                buildSurface();
            });
        });

        document.getElementById('toggleWireframe').addEventListener('click', function() {
            showWireframe = !showWireframe;
            if (wireframeMesh) wireframeMesh.visible = showWireframe;
            this.classList.toggle('active', showWireframe);
        });

        document.getElementById('toggleAutoRotate').addEventListener('click', function() {
            controls.autoRotate = !controls.autoRotate;
            this.classList.toggle('active', controls.autoRotate);
        });

        document.getElementById('resetView').addEventListener('click', () => {
            camera.position.set(4, 3, 5);
            controls.target.set(0, 0, 0);
            controls.update();
        });

        // ─── Animation Loop ───
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // ─── Resize ───
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
