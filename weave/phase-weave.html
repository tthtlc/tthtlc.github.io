<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phase-shifted parametric weave</title><style>*{box-sizing:border-box}body{margin:0;background:#d8c3c3;color:#620335;font:13px system-ui;overflow:hidden}canvas{display:block;width:100vw;height:100vh}header{position:fixed;top:18px;left:22px;pointer-events:none}h1{font-size:15px;margin:0 0 6px;font-weight:600}small{opacity:.7}aside{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:14px;padding:13px 17px;border:1px solid #62033544;background:#e3d2d2ed;border-radius:12px;max-width:96vw;width:max-content}label{display:grid;gap:5px;font-size:11px}input{width:95px;accent-color:#76023d}button,select{color:#620335;background:#eadada;border:1px solid #62033566;border-radius:6px;padding:8px;cursor:pointer}#readout{font-variant-numeric:tabular-nums;min-width:80px}</style><canvas aria-label="Animated burgundy parametric weave on a pale pink background"></canvas><header><h1>PHASE WEAVE</h1><small>Space: pause · H: hide interface</small></header><aside><button id="play">Pause</button><label>Phase speed<input id="speed" type="range" min="0" max="2" step=".01" value=".32"></label><label>Phase mode<select id="mode"><option value="carrier">Carrier phase</option><option value="parameter" selected>Whole parameter t + φ</option></select></label><label>Rotated copies<select id="copies"><option>1</option><option selected>2</option><option>4</option></select></label><span id="readout"></span><button id="reset">Reset</button><button id="save">Save PNG</button></aside><script>
const c=document.querySelector('canvas'),ctx=c.getContext('2d'),$=id=>document.getElementById(id);let w,h,phase=0,last=null,running=!matchMedia('(prefers-reduced-motion: reduce)').matches,hidden=false;
function resize(){w=innerWidth;h=innerHeight;let d=Math.min(devicePixelRatio||1,2);c.width=w*d;c.height=h*d;ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();
function draw(){ctx.fillStyle='#d8c3c3';ctx.fillRect(0,0,w,h);const scale=Math.min(w*.043,h*.040),N=28000,copies=+$('copies').value;ctx.save();ctx.translate(w/2,h/2-10);ctx.scale(scale,-scale);ctx.lineWidth=.85/scale;ctx.strokeStyle='#690333';for(let j=0;j<copies;j++){ctx.save();ctx.rotate(j*Math.PI/copies);ctx.beginPath();for(let i=0;i<=N;i++){let t=-6+12*i/N;let a,b;if($('mode').value==='parameter'){let q=t+phase;a=9.9*q;b=10*q}else{a=9.9*t+phase;b=10*t}let x=10*Math.sin(a)*Math.round(Math.sqrt(Math.cos(Math.cos(b))));let y=9*Math.cos(a)**2*Math.sin(Math.sin(b));i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke();ctx.restore()}ctx.restore();$('readout').textContent='φ = '+phase.toFixed(3)}
function sync(){$('play').textContent=running?'Pause':'Play'}function toggle(){running=!running;sync()}sync();$('play').onclick=toggle;$('reset').onclick=()=>{phase=0;draw()};$('save').onclick=()=>{draw();let a=document.createElement('a');a.download='phase-weave.png';a.href=c.toDataURL('image/png');a.click()};addEventListener('keydown',e=>{if(e.code==='Space'&&!['INPUT','BUTTON','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();toggle()}if(e.key.toLowerCase()==='h'){hidden=!hidden;document.querySelectorAll('header,aside').forEach(el=>el.style.visibility=hidden?'hidden':'visible')}});function frame(now){let dt=last===null?0:Math.min((now-last)/1000,.05);last=now;if(running)phase+=dt*+$('speed').value;draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
