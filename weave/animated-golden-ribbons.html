<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Golden Ribbon Animation</title><style>*{box-sizing:border-box}body{margin:0;background:black;color:#e7cc93;font:12px system-ui;overflow:hidden}canvas{display:block;width:100vw;height:100vh}aside{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:16px;background:#100e09dd;border:1px solid #66502b;border-radius:12px;padding:14px;max-width:95vw}label{display:grid;gap:5px}input{width:95px;accent-color:#deb15e}button{background:#302411;border:1px solid #745b30;color:#eedbb5;padding:9px;border-radius:6px;cursor:pointer}header{position:fixed;top:20px;left:24px;letter-spacing:.15em;color:#bc9d62}small{display:block;letter-spacing:0;color:#756549;margin-top:7px}</style><canvas aria-label="Flowing gold and ivory line ribbons"></canvas><header>GOLDEN RIBBONS<small>Space: pause · H: hide controls</small></header><aside><button id="play">Pause</button><label>Speed<input id="speed" type="range" min="0" max="1.5" step=".01" value=".28"></label><label>Zoom<input id="zoom" type="range" min=".7" max="2.5" step=".01" value="1.55"></label><label>Threads<input id="threads" type="range" min="20" max="80" value="48"></label><button id="save">Save PNG</button></aside><script>
const c=document.querySelector('canvas'),ctx=c.getContext('2d'),$=id=>document.getElementById(id);let w,h,t=0,last=0,run=!matchMedia('(prefers-reduced-motion: reduce)').matches;
function resize(){w=innerWidth;h=innerHeight;let d=Math.min(devicePixelRatio||1,2);c.width=w*d;c.height=h*d;ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();
function draw(){ctx.fillStyle='#000';ctx.fillRect(0,0,w,h);let scale=Math.min(w*.49,h*.46)*+$('zoom').value,N=+$('threads').value;for(let j=0;j<N;j++){let u=2*Math.PI*j/N,l=(1+Math.cos(u-.8+t*.12))/2;ctx.strokeStyle=`rgba(${197+55*l},${139+85*l},${49+124*l},.9)`;ctx.lineWidth=.85;ctx.beginPath();for(let k=0;k<=1000;k++){let a=k/1000*Math.PI*2,q=7*a+u+t*.42,r=.70+.27*Math.cos(q),theta=a+.205*Math.sin(q)+t*.025,z=.20*Math.sin(q),tilt=.20+.10*Math.sin(t*.18);let x=w*.55+scale*r*Math.cos(theta),y=h*.57+scale*(r*Math.sin(theta)*Math.cos(tilt)+z*Math.sin(tilt));k?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath();ctx.stroke()}}
function toggle(){run=!run;$('play').textContent=run?'Pause':'Play'}$('play').textContent=run?'Pause':'Play';$('play').onclick=toggle;
$('save').onclick=()=>{draw();let a=document.createElement('a');a.download='golden-ribbons.png';a.href=c.toDataURL();a.click()};let hidden=false;addEventListener('keydown',e=>{if(e.code==='Space'&&!['INPUT','BUTTON'].includes(document.activeElement.tagName)){e.preventDefault();toggle()}if(e.key.toLowerCase()==='h'){hidden=!hidden;document.querySelectorAll('aside,header').forEach(x=>x.style.visibility=hidden?'hidden':'visible')}});
function frame(now){let dt=Math.min((now-last)/1000,.05);last=now;if(run)t+=dt*+$('speed').value;draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
