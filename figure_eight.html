<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="/assets/math-art.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Figure of 8 rotating around an Equilateral Triangle</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #333;
        }
        canvas {
            background-color: #333;
            border: 1px solid black;
        }

        /* Centered link at the bottom */
        .footer-link {
            position: absolute;
            bottom: 20px;
            text-align: center;
            width: 100%;
        }

        .footer-link a {
            font-size: 16px;
            color: #007bff;
            text-decoration: none;
        }

        .footer-link a:hover {
            text-decoration: underline;
        }
</style>
<!-- Google tag (gtag.js) --> <script async src="https://www.googletagmanager.com/gtag/js?id=G-GEX61LPT08"></script> <script>   window.dataLayer = window.dataLayer || [];   function gtag(){dataLayer.push(arguments);}   gtag('js', new Date());   gtag('config', 'G-GEX61LPT08'); </script> </head>
<body>
    <canvas id="figure8Canvas" width="600" height="600"></canvas>


    <script>
document.addEventListener("contextmenu", function(event) { event.preventDefault(); });
        const canvas = document.getElementById('figure8Canvas');
        const ctx = canvas.getContext('2d');
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;

        const N = 72;                 // number of figure-eights in the trail
        const parts = 160;            // samples per figure-eight
        const scale = 55;             // size of each figure-eight
        const circumR = 180;          // circumradius of the equilateral triangle

        // Equilateral triangle corners (apex pointing up), starting at the top.
        const vertices = [];
        for (let k = 0; k < 3; k++) {
            const a = -Math.PI / 2 + k * (2 * Math.PI / 3);
            vertices.push({
                x: centerX + circumR * Math.cos(a),
                y: centerY + circumR * Math.sin(a)
            });
        }

        // One unit figure-eight (lemniscate of Bernoulli): r^2 = cos(2*theta).
        // The curve only exists where cos(2*theta) >= 0, so its two lobes are
        // sampled over [-pi/4, pi/4] and [3pi/4, 5pi/4].
        const unit = [];
        const half = parts / 2;
        for (let i = 0; i < parts; i++) {
            let theta;
            if (i < half) {
                theta = -Math.PI / 4 + (i / (half - 1)) * (Math.PI / 2);
            } else {
                theta = 3 * Math.PI / 4 + ((i - half) / (half - 1)) * (Math.PI / 2);
            }
            const r = Math.sqrt(Math.max(0, Math.cos(2 * theta)));
            unit.push({ x: r * Math.cos(theta), y: r * Math.sin(theta) });
        }

        // Position along the triangle perimeter: t in [0, 3) travels edges 0-1-2-0.
        function pointOnPerimeter(t) {
            const seg = Math.floor(t) % 3;
            const f = t - Math.floor(t);
            const v0 = vertices[seg];
            const v1 = vertices[(seg + 1) % 3];
            return {
                x: v0.x + (v1.x - v0.x) * f,
                y: v0.y + (v1.y - v0.y) * f
            };
        }

        // Faint guide triangle showing the path the centre follows.
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.18)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(vertices[0].x, vertices[0].y);
        ctx.lineTo(vertices[1].x, vertices[1].y);
        ctx.lineTo(vertices[2].x, vertices[2].y);
        ctx.closePath();
        ctx.stroke();

        const totalRotation = 2 * Math.PI;   // one full turn by the time it returns
        const hueStart = 0;
        const hueRange = 360;                // full rainbow, closing smoothly at the seam

        // Draw the trail: each figure-eight is rotated a little further and shifted
        // a little further along the triangle, with a slightly shifted hue, until the
        // centre returns to the starting corner.
        for (let s = 0; s < N; s++) {
            const progress = s / N;
            const t = progress * 3;              // 0..3 around the triangle
            const p = pointOnPerimeter(t);
            const rot = progress * totalRotation;
            const hue = (hueStart + progress * hueRange) % 360;

            const cosR = Math.cos(rot), sinR = Math.sin(rot);
            ctx.strokeStyle = 'hsl(' + hue + ', 90%, 60%)';
            ctx.lineWidth = 1.6;
            ctx.beginPath();
            for (let i = 0; i <= parts; i++) {
                const u = unit[i % parts];
                const px = u.x * scale, py = u.y * scale;
                const x = p.x + px * cosR - py * sinR;
                const y = p.y + px * sinR + py * cosR;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
        }
    </script>
</body>
</html>
