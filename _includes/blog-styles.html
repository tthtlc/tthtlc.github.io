<style>
  /* ---- Blog: article + index typography (shared monograph tokens) ---- */
  .ma-article, .ma-blog { max-width: 1180px; margin: 0 auto; padding: 1.6rem 1.25rem 4.5rem; }
  .ma-article-head, .ma-blog-head { max-width: 74ch; margin-bottom: 2rem; }
  .ma-article-kicker { color: var(--gilt-deep); font-size: .85rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; margin: 0 0 .5rem; }
  .ma-article-title { font-size: 2.4rem; margin: 0 0 .6rem; line-height: 1.15; }
  .ma-article-excerpt { color: var(--ink-soft); font-size: 1.12rem; font-style: italic; margin: 0; }

  .ma-article-body { margin: 0 auto; }
  .ma-article-body > p, .ma-article-body > h2, .ma-article-body > h3,
  .ma-article-body > h4, .ma-article-body > ul, .ma-article-body > ol,
  .ma-article-body > blockquote, .ma-article-body > pre { max-width: 74ch; }
  .ma-article-body > h2 { margin-top: 2.4rem; padding-bottom: .35rem; border-bottom: 1px solid var(--hairline); font-size: 1.5rem; }
  .ma-article-body > h3 { margin-top: 1.8rem; font-size: 1.15rem; }
  .ma-article-body p { margin: 0 0 1rem; }
  .ma-article-body ul, .ma-article-body ol { padding-left: 1.4rem; margin-bottom: 1rem; }
  .ma-article-body li { margin-bottom: .4rem; }
  .ma-article-body table { border-collapse: collapse; margin: 1.2rem 0; max-width: 100%; display: block; overflow-x: auto; }
  .ma-article-body th, .ma-article-body td { border: 1px solid var(--hairline); padding: .35rem .9rem; text-align: center; font-size: .95rem; }
  .ma-article-body th { background: var(--paper-deep); font-weight: 600; }
  .ma-article-body pre { background: var(--paper-deep); border: 1px solid var(--hairline); border-radius: 8px; padding: .9rem 1.1rem; overflow-x: auto; font-family: var(--mono); font-size: .78rem; line-height: 1.6; color: var(--ink); }
  .ma-article-body code { font-family: var(--mono); font-size: .85em; background: var(--paper-deep); padding: .1em .35em; border-radius: 4px; }
  .ma-article-body pre code { background: none; padding: 0; }
  .ma-article-body blockquote { border-left: 3px solid var(--gilt); margin: 1rem 0; padding: .2rem 1.2rem; color: var(--ink-soft); }
  .ma-article-body > .ma-app { max-width: none; }

  .ma-article-foot { max-width: 74ch; margin: 3rem 0 0; }
  .ma-article-foot a { color: var(--gilt-deep); }
  .ma-blog-foot { max-width: 74ch; margin-top: 2rem; color: var(--marginalia); font-size: .9rem; }
  .ma-blog-foot a { color: var(--gilt-deep); }

  /* ---- blog index list ---- */
  .ma-post-list { max-width: 74ch; margin-top: 2.4rem; }
  .ma-post-item { padding: 1.1rem 0; border-bottom: 1px solid var(--hairline); }
  .ma-post-item:first-child { padding-top: 0; }
  .ma-post-date { color: var(--marginalia); font-size: .85rem; margin: 0 0 .2rem; }
  .ma-post-title { font-size: 1.35rem; margin: 0 0 .3rem; }
  .ma-post-title a { color: var(--ink); text-decoration: none; }
  .ma-post-title a:hover { color: var(--gilt-deep); }
  .ma-post-excerpt { color: var(--ink-soft); margin: 0; }
  .ma-post-tags { color: var(--marginalia); font-size: .85rem; margin: .35rem 0 0; }
</style>
