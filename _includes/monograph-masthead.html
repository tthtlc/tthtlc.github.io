<header class="ma-masthead">
  <div class="ma-masthead-inner">
    <div class="ma-masthead-top">
      <div>
        <h1 class="ma-title"><a href="/">Mathematical <span class="ma-title-accent">Art</span></a></h1>
        <p class="ma-subtitle">Interactive geometric visualizations</p>
      </div>
      <button id="theme-toggle" class="ma-theme-toggle" type="button" aria-label="Toggle dark and light mode" aria-pressed="false">
        <svg class="ma-theme-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg class="ma-theme-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <span class="ma-theme-label-dark">Dark</span>
        <span class="ma-theme-label-light">Light</span>
      </button>
    </div>
    <nav class="ma-nav" aria-label="Primary">
      {% for item in site.data.navigation.main %}
      {%- assign is_active = false -%}
      {%- if item.url == page.url -%}{%- assign is_active = true -%}{%- endif -%}
      <a href="{{ item.url }}"{% if is_active %} class="ma-nav-current"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
<script>
  (function () {
    var btn = document.getElementById('theme-toggle');
    if (!btn) return;
    function isDark() { return document.documentElement.getAttribute('data-theme') === 'dark'; }
    btn.setAttribute('aria-pressed', String(isDark()));
    btn.addEventListener('click', function () {
      var dark = !isDark();
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      try { localStorage.setItem('ma-theme', dark ? 'dark' : 'light'); } catch (e) {}
      btn.setAttribute('aria-pressed', String(dark));
    });
  })();
</script>
