<link rel="stylesheet" href="https://unpkg.com/gitalk/dist/gitalk.css">
<script src="https://unpkg.com/gitalk@latest/dist/gitalk.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/blueimp-md5/2.10.0/js/md5.min.js"></script>
<div id="gitalk-container"></div>
<script type="text/javascript">
// ── SECURITY ────────────────────────────────────────────────────────────────
// Gitalk exchanges the OAuth code for a token in the browser, so this
// `clientSecret` is visible in page source — a documented Gitalk limitation,
// not something we can hide without a proxy. Two rules keep that harmless:
//   1. Scope the OAuth App to `public_repo` ONLY (it just opens issues on
//      this public repo) — never `repo`, `user`, or `gist`.
//   2. Rotate the secret at GitHub → Settings → Developer settings → OAuth
//      Apps → <this app> → "Generate a new client secret", and paste the new
//      value here. The `clientID` is public and does not rotate.
// ────────────────────────────────────────────────────────────────────────────
var gitalk = new Gitalk({
clientID: 'Ov23lixOB0KjXtg08eAj',
clientSecret: 'a3a33cad9733049a39849d54e99e69f70f69d1c1',
repo: 'tthtlc.github.io',
owner: 'tthtlc',
admin: ['tthtlc'],
distractionFreeMode: true,
id: md5(location.pathname),
});
gitalk.render('gitalk-container');
</script>
