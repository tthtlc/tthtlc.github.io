<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Silver Orbit — reflective spheres</title>
<style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#08090b;color:#e4e7eb;font:13px system-ui,sans-serif}canvas{display:block}header{position:fixed;left:25px;top:23px;pointer-events:none}h1{font-size:13px;letter-spacing:.25em;font-weight:500;margin:0 0 8px}header p{color:#92989f;margin:0;font-size:11px;letter-spacing:.06em}.panel{position:fixed;bottom:22px;left:22px;padding:15px 18px;background:#101216b8;backdrop-filter:blur(16px);border:1px solid #ffffff20;border-radius:12px;width:260px}.row{display:flex;align-items:center;justify-content:space-between;margin:9px 0;gap:14px}label{font-size:11px;color:#b5bbc3}input[type=range]{width:135px;accent-color:#d6dbe1}button,select{background:#25292f;color:#e2e5e9;border:1px solid #ffffff25;border-radius:6px;padding:6px 9px;font:11px system-ui;cursor:pointer}.hint{position:fixed;right:23px;bottom:23px;color:#818790;font-size:11px}#error{position:fixed;inset:40% 15%;display:none;color:white;text-align:center}@media(max-width:600px){header{left:17px;top:17px}.panel{left:12px;bottom:12px;width:235px;padding:10px 13px}.hint{display:none}}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script></head><body>
<header><h1>SILVER ORBIT</h1><p>Counter-rotating chrome / spherical lattices</p></header>
<div class="panel"><div class="row"><label>Rotation speed</label><input id="speed" type="range" min="0" max="2" step="0.01" value="0.65"></div><div class="row"><label>Surface finish</label><select id="finish"><option value="lattice">Open silver lattice</option><option value="solid">Polished silver ball</option></select></div><div class="row"><label>Exposure</label><input id="exposure" type="range" min="0.35" max="2" step="0.01" value="1.05"></div><div class="row"><button id="pause">Pause</button><button id="reset">Reset view</button><button id="fullscreen">Full screen</button></div></div><div class="hint">Drag to orbit · Scroll to zoom</div><div id="error">Unable to start WebGL. Use a current browser with hardware acceleration and an internet connection to load Three.js.</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
try {
const scene=new THREE.Scene();scene.background=new THREE.Color(0x08090b);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;document.body.prepend(renderer.domElement);
const camera=new THREE.PerspectiveCamera(49,innerWidth/innerHeight,.05,100);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.minDistance=4;controls.maxDistance=17;
function reset(){camera.position.set(.15,1.0,8.0);controls.target.set(0,.2,0);controls.update()}reset();
// High contrast studio panorama: reflected light strips create real chrome highlights.
const c=document.createElement('canvas');c.width=2048;c.height=1024;const ctx=c.getContext('2d');ctx.fillStyle='#101217';ctx.fillRect(0,0,c.width,c.height);
const wash=ctx.createLinearGradient(0,0,0,1024);wash.addColorStop(0,'#565b64');wash.addColorStop(.36,'#171a20');wash.addColorStop(.55,'#040507');wash.addColorStop(1,'#333740');ctx.fillStyle=wash;ctx.fillRect(0,0,2048,1024);
for(const [x,w,b] of [[40,75,230],[270,160,255],[670,28,220],[1000,240,245],[1530,65,255],[1810,110,210]]){const g=ctx.createLinearGradient(x-35,0,x+w+35,0);g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(.2,`rgb(${b},${b},${b})`);g.addColorStop(.8,`rgb(${b},${b},${b})`);g.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=g;ctx.fillRect(x-35,120,w+70,760)}
ctx.fillStyle='#e9edf2';ctx.fillRect(0,65,2048,24);ctx.fillStyle='#787e87';ctx.fillRect(0,920,2048,50);
const env=new THREE.CanvasTexture(c);env.mapping=THREE.EquirectangularReflectionMapping;env.colorSpace=THREE.SRGBColorSpace;const pmrem=new THREE.PMREMGenerator(renderer);scene.environment=pmrem.fromEquirectangular(env).texture;pmrem.dispose();env.dispose();
const chrome=new THREE.MeshStandardMaterial({color:0xe6e9ef,metalness:1,roughness:.18,envMapIntensity:1.55});
const outerChrome=new THREE.MeshStandardMaterial({color:0xa8b0ba,metalness:1,roughness:.24,envMapIntensity:1.25});
scene.add(new THREE.HemisphereLight(0xdce8ff,0x303039,1.1));
for(const [x,y,z,p] of [[3,5,4,65],[-4,1,2,40],[0,-4,1,35]]){const light=new THREE.PointLight(0xf2f5ff,p);light.position.set(x,y,z);scene.add(light)}
// Meridian and parallel tubes, rather than flat lines, reflect the studio environment.
function ring(radius,theta,material,tube,segments=192){const y=radius*Math.cos(theta),r=radius*Math.sin(theta);const mesh=new THREE.Mesh(new THREE.TorusGeometry(r,tube,5,segments),material);mesh.rotation.x=Math.PI/2;mesh.position.y=y;return mesh}
function cage(radius,meridians,parallels,tube,material){const group=new THREE.Group();const meridianGeometry=new THREE.TorusGeometry(radius,tube,5,224);for(let i=0;i<meridians;i++){const m=new THREE.Mesh(meridianGeometry,material);m.rotation.y=Math.PI*i/meridians;group.add(m)}for(let i=1;i<parallels;i++)group.add(ring(radius,Math.PI*i/parallels,material,tube));return group}
const outer=cage(3.65,48,52,.0085,outerChrome);outer.position.y=-.63;outer.rotation.set(.23,.15,.10);scene.add(outer);
const innerPivot=new THREE.Group();innerPivot.position.set(0,1.08,0);scene.add(innerPivot);
const inner=cage(1.27,56,56,.009,chrome);inner.rotation.z=.18;innerPivot.add(inner);
const solid=new THREE.Mesh(new THREE.SphereGeometry(1.235,96,64),new THREE.MeshStandardMaterial({color:0xd7dce4,metalness:1,roughness:.135,envMapIntensity:1.65}));solid.visible=false;inner.add(solid);
// A subtle asymmetric equatorial band makes the rotation of the solid mode legible.
const band=new THREE.Mesh(new THREE.TorusGeometry(1.245,.014,8,192),chrome);band.rotation.set(1.05,.3,.2);band.visible=false;inner.add(band);
const coreLight=new THREE.Mesh(new THREE.SphereGeometry(.045,16,16),new THREE.MeshBasicMaterial({color:0xffffff}));coreLight.position.set(0,-2.5,.2);scene.add(coreLight);
const glowCanvas=document.createElement('canvas');glowCanvas.width=glowCanvas.height=128;const gc=glowCanvas.getContext('2d');const grad=gc.createRadialGradient(64,64,0,64,64,64);grad.addColorStop(0,'rgba(255,255,255,1)');grad.addColorStop(.12,'rgba(245,248,255,.9)');grad.addColorStop(.35,'rgba(215,225,255,.2)');grad.addColorStop(1,'rgba(200,220,255,0)');gc.fillStyle=grad;gc.fillRect(0,0,128,128);const sprite=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(glowCanvas),transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));sprite.position.copy(coreLight.position);sprite.scale.set(.9,.9,.9);scene.add(sprite);
let paused=false;const speed=document.querySelector('#speed');document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Resume':'Pause'};document.querySelector('#reset').onclick=reset;document.querySelector('#fullscreen').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};document.querySelector('#exposure').oninput=e=>renderer.toneMappingExposure=+e.target.value;document.querySelector('#finish').onchange=e=>{solid.visible=band.visible=e.target.value==='solid'};
const clock=new THREE.Clock();renderer.setAnimationLoop(()=>{const dt=Math.min(clock.getDelta(),.05);if(!paused){const s=+speed.value;inner.rotation.y+=dt*s*.7;inner.rotation.x+=dt*s*.12;outer.rotation.y-=dt*s*.23;outer.rotation.z-=dt*s*.065}controls.update();renderer.render(scene,camera)});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
} catch(e){document.querySelector('#error').style.display='block';console.error(e)}
</script></body></html>
