<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="/assets/math-art.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardioid Shape</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            background-color: #f0f0f0;
        }

        canvas {
            background-color: white;
            border: 1px solid #ccc;
            margin-bottom: 20px;
        }

        .controls {
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 10px;
            align-items: center;
            width: 80%;
        }

        .footer-link {
            position: absolute;
            bottom: 20px;
            text-align: center;
            width: 100%;
        }

        .footer-link a {
            font-size: 16px;
            color: #007bff;
            text-decoration: none;
        }

        .footer-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <canvas id="cardioidCanvas" width="800" height="800"></canvas>

    <div class="controls">
        <label for="a1">a1:</label>
        <input type="range" id="a1" min="1" max="30" value="1">
        <span id="a1Value">1</span>

        <label for="b1">b1:</label>
        <input type="range" id="b1" min="1" max="30" value="1">
        <span id="b1Value">1</span>

        <label for="c1">c1:</label>
        <input type="range" id="c1" min="1" max="30" value="1">
        <span id="c1Value">1</span>

        <label for="d1">d1:</label>
        <input type="range" id="d1" min="1" max="30" value="1">
        <span id="d1Value">1</span>

        <label for="e1">e1:</label>
        <input type="range" id="e1" min="1" max="30" value="1">
        <span id="e1Value">1</span>

        <label for="f1">f1:</label>
        <input type="range" id="f1" min="1" max="200" value="1">
        <span id="f1Value">1</span>
    </div>

    <script>
        document.addEventListener("contextmenu", function(event) { event.preventDefault(); });

        const canvas = document.getElementById('cardioidCanvas');
        const ctx = canvas.getContext('2d');
        const centerX = canvas.width / 2;   // design origin (0,0) maps here
        const centerY = canvas.height / 2;
        const radius = 200;
        const steps = 200;
        const delta = 2 * Math.PI / steps;

        // Offscreen sprite: base design + 3 rotated copies rendered once,
        // then rotated slowly on screen each frame (cheap: one drawImage)
        const spriteSize = 1600;
        const sprite = document.createElement('canvas');
        sprite.width = sprite.height = spriteSize;
        const sctx = sprite.getContext('2d');
        const sCenter = spriteSize / 2;

        // Colors: base design first, then its three rotated copies
        const layerColors = ['red', 'blue', 'green', 'darkorange'];

        // Initialize variables
        let a1 = 1, b1 = 1, c1 = 1, d1 = 1, e1 = 1, f1 = 1;

        // Rotate a point (x, y) around (cx, cy) by an angle
        function rotatePoint(x, y, cx, cy, angle) {
            const cosA = Math.cos(angle);
            const sinA = Math.sin(angle);
            const dx = x - cx;
            const dy = y - cy;
            return { x: cx + dx * cosA - dy * sinA, y: cy + dx * sinA + dy * cosA };
        }

        // Draw the base curve, rotated by `rot` about the origin, in `color`
        function drawLayer(color, rot) {
            sctx.strokeStyle = color;
            sctx.lineWidth = 2;
            sctx.beginPath();

            for (let phasea = 0; phasea <= 2 * Math.PI; phasea += a1 * delta) {
                for (let theta = 0; theta <= 2 * Math.PI * b1 * d1; theta += delta) {
                    const phaseb = f1 * delta;
                    const x = radius * (1 - Math.sin(b1 / c1 * theta + phasea)) * Math.cos(d1 / e1 * theta + phaseb) * Math.cos(theta);
                    const y = radius * (1 - Math.cos(b1 / c1 * theta + phasea)) * Math.sin(d1 / e1 * theta + phaseb) * Math.sin(theta);

                    const p = rotatePoint(sCenter + x, sCenter + y, sCenter, sCenter, rot);

                    if (theta === 0) {
                        sctx.moveTo(p.x, p.y);
                    } else {
                        sctx.lineTo(p.x, p.y);
                    }
                }
            }

            sctx.closePath();
            sctx.stroke();
        }

        // Render base design + three copies rotated 90° apart about (0,0)
        function renderSprite() {
            sctx.clearRect(0, 0, spriteSize, spriteSize);
            for (let k = 0; k < 4; k++) {
                drawLayer(layerColors[k], k * Math.PI / 2);
            }
        }

        // Micro-font formula below the curves, inside the canvas
        function drawFormulaText() {
            // Legibility strip behind the text
            ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
            ctx.fillRect(0, canvas.height - 44, canvas.width, 44);

            ctx.font = '9px "Courier New", monospace';
            ctx.fillStyle = '#333';
            ctx.textAlign = 'center';
            ctx.fillText('x(θ) = r·(1 − sin((b/c)θ + φ))·cos((d/e)θ + fΔ)·cos(θ)', centerX, canvas.height - 34);
            ctx.fillText('y(θ) = r·(1 − cos((b/c)θ + φ))·sin((d/e)θ + fΔ)·sin(θ)', centerX, canvas.height - 24);
            ctx.fillText(`r=${radius}  a=${a1} b=${b1} c=${c1} d=${d1} e=${e1} f=${f1}  ·  base + 3 copies rotated 90° about (0,0)`, centerX, canvas.height - 12);
        }

        // Slow rotation of the whole design
        let globalAngle = 0;
        function animate() {
            globalAngle += 0.002;  // radians per frame

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(globalAngle);
            ctx.drawImage(sprite, -sCenter, -sCenter);
            ctx.restore();

            // Marker for the rotation center (the 0,0 point)
            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.arc(centerX, centerY, 3, 0, 2 * Math.PI);
            ctx.fill();

            drawFormulaText();
            requestAnimationFrame(animate);
        }

        // Update variables and rebuild the sprite
        function updateCardioid() {
            a1 = parseInt(document.getElementById('a1').value);
            b1 = parseInt(document.getElementById('b1').value);
            c1 = parseInt(document.getElementById('c1').value);
            d1 = parseInt(document.getElementById('d1').value);
            e1 = parseInt(document.getElementById('e1').value);
            f1 = parseInt(document.getElementById('f1').value);

            document.getElementById('a1Value').textContent = a1;
            document.getElementById('b1Value').textContent = b1;
            document.getElementById('c1Value').textContent = c1;
            document.getElementById('d1Value').textContent = d1;
            document.getElementById('e1Value').textContent = e1;
            document.getElementById('f1Value').textContent = f1;

            renderSprite();
        }

        // Attach event listeners to sliders
        document.getElementById('a1').addEventListener('input', updateCardioid);
        document.getElementById('b1').addEventListener('input', updateCardioid);
        document.getElementById('c1').addEventListener('input', updateCardioid);
        document.getElementById('d1').addEventListener('input', updateCardioid);
        document.getElementById('e1').addEventListener('input', updateCardioid);
        document.getElementById('f1').addEventListener('input', updateCardioid);

        renderSprite();
        requestAnimationFrame(animate);
    </script>
</body>
</html>
