<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Closed ribbon — adjustable torus hole</title><style>*{box-sizing:border-box}body{margin:0;background:#05070b;color:#eaf2ff;font:14px system-ui}canvas{display:block;width:100vw;height:100vh;touch-action:none}.panel{position:absolute;top:18px;left:18px;width:300px;padding:18px;background:#101725ed;border:1px solid #ffffff25;border-radius:15px}h1{font-size:18px;margin:0 0 10px}p{font-size:13px;line-height:1.5;color:#b0bed1}label{display:flex;justify-content:space-between;align-items:center;margin-top:15px}input[type=range]{width:100%;accent-color:#7edfff}button{background:#ffffff13;color:inherit;border:1px solid #ffffff30;border-radius:8px;padding:9px;margin:14px 4px 0 0}.eq{font:12px monospace;color:#aed5eb;line-height:1.8;margin-top:15px}.status{font-size:12px;color:#a0e6cf;line-height:1.5;margin-top:10px}@media(max-width:600px){.panel{width:235px;top:8px;left:8px;padding:12px}.eq{display:none}h1{font-size:16px}}</style><canvas id="c"></canvas><section class="panel" id="panel"><h1>Closed ribbon · variable hole</h1><p>One closed band: top → bottom → top, in one longitudinal revolution. The tube radius stays fixed at 1.</p><label for="hole">Inner hole radius <output id="hv"></output></label><input id="hole" type="range" min="0" max="2" step="0.01" value="0.65"><button id="zero">Set hole to zero</button><label for="width">Ribbon width <output id="wv"></output></label><input id="width" type="range" min="3" max="70" value="25"><label>Show torus guide<input id="guide" type="checkbox" checked></label><label>Show path markers<input id="markers" type="checkbox" checked></label><button id="play">Pause</button><button id="reset">Reset view</button><div class="status" id="status"></div><div class="eq">r = 1; R = r + inner hole radius<br>u(t) = 2πt<br>v(t) = π/2 − 2πt<br>0 ≤ t ≤ 1; P(0) = P(1)<br>Drag: orbit · Scroll/pinch: zoom<br>H: hide controls · Space: pause</div></section><script>
'use strict';const $=id=>document.getElementById(id),c=$('c'),ctx=c.getContext('2d'),TAU=2*Math.PI,r=1;let R=1.65,W,H,mesh=[],lines=[],yaw=.4,pitch=.95,zoom=1,running=true,dirty=true,last=0,pinch=0;const pointers=new Map();
function resize(){W=innerWidth;H=innerHeight;let d=Math.min(devicePixelRatio||1,2);c.width=W*d;c.height=H*d;ctx.setTransform(d,0,0,d,0,0);dirty=true}addEventListener('resize',resize);resize();
function pt(u,v){let a=R+r*Math.cos(v);return[a*Math.cos(u),a*Math.sin(u),r*Math.sin(v)]}
function build(){let hole=+$('hole').value;R=r+hole;let width=+$('width').value*Math.PI/180,steps=900,K=10,rows=[];mesh=[];lines=[];$('hv').value=hole.toFixed(2);$('wv').value=$('width').value+'°';$('status').textContent=hole===0?'Hole closed: the inner surface touches at the central point.':'Inner hole radius = '+hole.toFixed(2)+' · Outer radius = '+(R+r).toFixed(2);
for(let i=0;i<steps;i++){let t=i/steps,row=[];for(let j=0;j<=K;j++)row.push(pt(TAU*t,Math.PI/2-TAU*t+(j/K-.5)*width));rows.push(row)}rows.push(rows[0]);
for(let i=0;i<steps;i++)for(let j=0;j<K;j++){let t=(i+.5)/steps;mesh.push({p:[rows[i][j],rows[i+1][j],rows[i+1][j+1],rows[i][j+1]],u:TAU*t,v:Math.PI/2-TAU*t+((j+.5)/K-.5)*width,t})}
for(let j=0;j<16;j++)for(let i=0;i<100;i++)lines.push([pt(TAU*i/100,TAU*j/16),pt(TAU*(i+1)/100,TAU*j/16)]);for(let j=0;j<24;j++)for(let i=0;i<60;i++)lines.push([pt(TAU*j/24,TAU*i/60),pt(TAU*j/24,TAU*(i+1)/60)]);dirty=true}
function rot(p){let a=p[0]*Math.cos(yaw)-p[1]*Math.sin(yaw),b=p[0]*Math.sin(yaw)+p[1]*Math.cos(yaw);return[a,b*Math.cos(pitch)-p[2]*Math.sin(pitch),b*Math.sin(pitch)+p[2]*Math.cos(pitch)]}
function project(p){let q=rot(p),s=Math.min(W,H)*.42/(R+r)*zoom*14/(14-q[2]);return[W*.54+q[0]*s,H*.53-q[1]*s,q[2]]}
function marker(t,label,color){let q=project(pt(TAU*t,Math.PI/2-TAU*t));ctx.fillStyle=color;ctx.beginPath();ctx.arc(q[0],q[1],5,0,TAU);ctx.fill();ctx.font='bold 12px system-ui';ctx.strokeStyle='#05070b';ctx.lineWidth=4;ctx.strokeText(label,q[0]+12,q[1]-10);ctx.fillText(label,q[0]+12,q[1]-10)}
function draw(){ctx.fillStyle='#05070b';ctx.fillRect(0,0,W,H);if($('guide').checked){ctx.strokeStyle='#879fc638';ctx.lineWidth=.6;ctx.beginPath();for(let [a,b] of lines){a=project(a);b=project(b);ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1])}ctx.stroke()}
let faces=mesh.map(f=>{let p=f.p.map(project);return{f,p,z:p.reduce((a,b)=>a+b[2],0)/4}}).sort((a,b)=>a.z-b.z);for(let {f,p} of faces){let normal=rot([Math.cos(f.u)*Math.cos(f.v),Math.sin(f.u)*Math.cos(f.v),Math.sin(f.v)]),light=.65+.35*Math.abs(normal[0]*-.3+normal[1]*.4+normal[2]*.866);ctx.fillStyle=`hsl(${190+145*Math.sin(TAU*f.t)} 85% ${66*light}%)`;ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);for(let k=1;k<4;k++)ctx.lineTo(p[k][0],p[k][1]);ctx.closePath();ctx.fill();ctx.strokeStyle=ctx.fillStyle;ctx.lineWidth=.4;ctx.stroke()}if($('markers').checked){marker(0,'START = FINISH · TOP','#8cf0ff');marker(.5,'HALFWAY · BOTTOM','#ffb575')}}
function frame(t){let dt=Math.min((t-last)/1000,.05);last=t;if(running&&!pointers.size){yaw+=dt*.12;dirty=true}if(dirty){draw();dirty=false}requestAnimationFrame(frame)}$('hole').oninput=build;$('width').oninput=build;$('zero').onclick=()=>{$('hole').value=0;build()};for(let id of ['guide','markers'])$(id).onchange=()=>dirty=true;function toggle(){running=!running;$('play').textContent=running?'Pause':'Resume'}function reset(){yaw=.4;pitch=.95;zoom=1;dirty=true}$('play').onclick=toggle;$('reset').onclick=reset;c.ondblclick=reset;c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});pinch=0};c.onpointermove=e=>{if(!pointers.has(e.pointerId))return;let old=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){yaw+=(e.clientX-old.x)*.007;pitch+=(e.clientY-old.y)*.007}else{let [a,b]=[...pointers.values()],d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch)zoom=Math.max(.3,Math.min(3,zoom*d/pinch));pinch=d}dirty=true};function release(e){pointers.delete(e.pointerId);pinch=0}c.onpointerup=release;c.onpointercancel=release;c.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.3,Math.min(3,zoom*Math.exp(-e.deltaY*.001)));dirty=true},{passive:false});addEventListener('keydown',e=>{if(e.target.matches('input,button'))return;if(e.code==='Space'){e.preventDefault();toggle()}if(e.key.toLowerCase()==='h')$('panel').hidden=!$('panel').hidden});build();requestAnimationFrame(frame);
</script></html>
