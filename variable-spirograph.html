<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Variable-frequency Spirograph</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f7fb;color:#27243b;font:14px system-ui,sans-serif;min-height:100vh;display:grid;place-items:center}main{width:min(1150px,100%);padding:24px;display:grid;grid-template-columns:1fr 280px;gap:24px;align-items:center}.art{background:white;border-radius:20px;overflow:hidden;box-shadow:0 12px 50px #27243b09;aspect-ratio:1}canvas{width:100%;height:100%;display:block}h1{font-size:24px;letter-spacing:-.7px;margin:0 0 10px}p{line-height:1.6;color:#777387}label{display:block;margin-top:20px;font-size:12px;font-weight:600}label span{float:right;color:#777387;font-variant-numeric:tabular-nums}input[type=range]{width:100%;accent-color:#6054d9;margin-top:10px}input[type=number]{width:90px;padding:9px;border:1px solid #dddbea;border-radius:8px;font:inherit;background:white;color:inherit}.frequency{display:flex;align-items:center;gap:12px;margin-top:10px}.frequency input[type=range]{flex:1;min-width:0;margin:0}input[type=color]{width:100%;height:32px;border:0;background:transparent;padding:0;margin-top:10px}button{border:1px solid #dddbea;border-radius:9px;padding:10px 12px;background:white;color:inherit;cursor:pointer}button:hover{background:#efedf9}.buttons{display:flex;gap:8px;margin-top:24px}.note{font-size:12px}code{font-size:12px;color:#5145cf}@media(max-width:720px){main{grid-template-columns:1fr;padding:14px;gap:18px}aside{padding:0 12px 16px}h1{font-size:21px}label{margin-top:15px}}
</style></head><body><main><div class="art"><canvas id="canvas" aria-label="Interactive looping spirograph artwork"></canvas></div><aside><h1>Variable-frequency spirograph</h1><p>Change the multiplier <i>k</i> in <code>cos(k·t)</code> and <code>sin(k·t)</code>.</p><label for="frequency">Frequency multiplier k</label><div class="frequency"><input id="frequency" type="range" min="1" max="30" step="0.1" value="2" aria-label="Frequency multiplier slider"><input id="frequencyNumber" type="number" min="1" max="30" step="0.1" value="2.0" aria-label="Frequency multiplier number"></div><p class="note">1.0–30.0, in steps of 0.1. Type a value or use the slider.</p><label>Loops <span id="loopsValue"></span><input id="loops" type="range" min="40" max="220" value="110"></label><label>Loop size <span id="depthValue"></span><input id="depth" type="range" min="10" max="48" value="29"></label><label>Line opacity <span id="opacityValue"></span><input id="opacity" type="range" min="8" max="65" value="23"></label><label>Ink color<input id="color" type="color" value="#5145cf"></label><div class="buttons"><button id="play">Animate</button><button id="save">Save PNG</button><button id="reset">Reset</button></div><p class="note">The drawing keeps the original 0–2π interval. Decimal multipliers can leave an open curve.</p></aside></main><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');
const controls=Object.fromEntries(['loops','depth','opacity','color','frequency','frequencyNumber'].map(id=>[id,document.getElementById(id)]));
let playing=false,phase=0,last=0,k=2;
function setFrequency(value){if(!Number.isFinite(value))return;k=Math.round(Math.max(1,Math.min(30,value))*10)/10;controls.frequency.value=k;controls.frequencyNumber.value=k.toFixed(1);draw();}
controls.frequency.addEventListener('input',()=>setFrequency(+controls.frequency.value));
controls.frequencyNumber.addEventListener('input',()=>{const n=controls.frequencyNumber.valueAsNumber;if(Number.isFinite(n)&&n>=1&&n<=30){k=Math.round(n*10)/10;controls.frequency.value=k;draw();}});
controls.frequencyNumber.addEventListener('change',()=>setFrequency(Number.isFinite(controls.frequencyNumber.valueAsNumber)?controls.frequencyNumber.valueAsNumber:k));
function draw(){const box=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,3),size=Math.round(box.width*dpr);if(canvas.width!==size||canvas.height!==size){canvas.width=size;canvas.height=size;}ctx.setTransform(dpr,0,0,dpr,0,0);const w=size/dpr;ctx.fillStyle='#fff';ctx.fillRect(0,0,w,w);const loops=+controls.loops.value,depth=+controls.depth.value/100;document.getElementById('loopsValue').textContent=loops;document.getElementById('depthValue').textContent=depth.toFixed(2);document.getElementById('opacityValue').textContent=controls.opacity.value+'%';const points=loops*110,scale=w*.405/(1+depth);ctx.strokeStyle=controls.color.value;ctx.globalAlpha=+controls.opacity.value/100;ctx.lineWidth=.65;ctx.lineJoin='round';ctx.beginPath();for(let j=0;j<=points;j++){const t=j/points*Math.PI*2,a=loops*t+phase;const x=.70*Math.cos(t)+.35*Math.cos(k*t)+depth*Math.cos(a);const y=.70*Math.sin(t)-.35*Math.sin(k*t)+depth*Math.sin(a);const px=w*.46+scale*x,py=w/2+scale*y;if(j===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);}ctx.stroke();ctx.globalAlpha=1;}
['loops','depth','opacity','color'].forEach(id=>controls[id].addEventListener('input',draw));new ResizeObserver(draw).observe(canvas.parentElement);
function tick(time){if(!playing)return;phase+=(time-last)*.00035;last=time;draw();requestAnimationFrame(tick);}
document.getElementById('play').onclick=e=>{playing=!playing;e.target.textContent=playing?'Pause':'Animate';if(playing){last=performance.now();requestAnimationFrame(tick);}};
document.getElementById('save').onclick=()=>{const a=document.createElement('a');a.download='variable-spirograph.png';a.href=canvas.toDataURL('image/png');a.click();};
document.getElementById('reset').onclick=()=>{controls.loops.value=110;controls.depth.value=29;controls.opacity.value=23;controls.color.value='#5145cf';phase=0;setFrequency(2);};draw();
</script></body></html>
