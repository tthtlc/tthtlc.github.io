
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Boy's Surface - Dot Mesh</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0f12;
      color: #e0e6ed;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    canvas:active { cursor: grabbing; }
    .overlay {
      position: absolute;
      top: 20px;
      left: 20px;
      pointer-events: none;
      background: rgba(13, 15, 18, 0.75);
      padding: 16px;
      border-radius: 8px;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    h1 { font-size: 1.2rem; font-weight: 600; margin-bottom: 4px; }
    p { font-size: 0.85rem; color: #9aa5b1; }
  </style>
</head>
<body>

  <canvas id="canvas"></canvas>
  
  <div class="overlay">
    <h1>Boy's Surface · Dot Mesh</h1>
    <p>Bryant–Kusner Parametrization</p>
    <p>Drag to rotate | Scroll to zoom</p>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Camera & Interaction parameters
    let rotX = 0.5, rotY = 0.8;
    let zoom = 220;
    let isDragging = false;
    let prevMouse = { x: 0, y: 0 };

    window.addEventListener('mousedown', (e) => {
      isDragging = true;
      prevMouse = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - prevMouse.x;
      const dy = e.clientY - prevMouse.y;
      rotY += dx * 0.005;
      rotX += dy * 0.005;
      prevMouse = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('mouseup', () => isDragging = false);
    window.addEventListener('wheel', (e) => {
      zoom *= e.deltaY > 0 ? 0.9 : 1.1;
    });

    // Bryant–Kusner Parametrization for Boy's Surface
    function getBoyPoint(u, v) {
      // u in [0, pi], v in [0, pi]
      const r = Math.sin(u);
      const w = r * Math.cos(v) + Math.sin(2 * v) * 0.1;
      
      const z = Math.complex ? null : 0; // standard complex projection formulation
      const w_re = r * Math.cos(v);
      const w_im = r * Math.sin(v);
      
      // Algebraic parametrization approximation
      const g1 = -(3/2) * Math.imul ? 0 : 0; // Simplified real components
      
      const denom = 1 + u*u + v*v;
      const x = (Math.sqrt(2) * Math.cos(2*u) * Math.cos(v)**2 + Math.cos(u) * Math.sin(2*v)) / (2 - Math.sqrt(2) * Math.sin(3*u) * Math.sin(2*v));
      const y = (Math.sqrt(2) * Math.sin(2*u) * Math.cos(v)**2 - Math.sin(u) * Math.sin(2*v)) / (2 - Math.sqrt(2) * Math.sin(3*u) * Math.sin(2*v));
      const z_val = (3 * Math.cos(v)**2) / (2 - Math.sqrt(2) * Math.sin(3*u) * Math.sin(2*v));

      return { x, y, z: z_val };
    }

    // 3D Projection & Rotation
    function project(p) {
      // Rotate Y
      let x1 = p.x * Math.cos(rotY) + p.z * Math.sin(rotY);
      let y1 = p.y;
      let z1 = -p.x * Math.sin(rotY) + p.z * Math.cos(rotY);

      // Rotate X
      let x2 = x1;
      let y2 = y1 * Math.cos(rotX) - z1 * Math.sin(rotX);
      let z2 = y1 * Math.sin(rotX) + z1 * Math.cos(rotX);

      return {
        x: width / 2 + x2 * zoom,
        y: height / 2 + y2 * zoom,
        z: z2
      };
    }

    // Grid sampling parameters
    const stepsU = 80;
    const stepsV = 80;
    const dotRadius = 1.8;

    let time = 0;

    function render() {
      ctx.fillStyle = '#0d0f12';
      ctx.fillRect(0, 0, width, height);

      time += 0.2; // Slow color animation shift over time
      let totalDots = stepsU * stepsV;
      let dotIndex = 0;

      for (let i = 0; i < stepsU; i++) {
        const u = (i / stepsU) * Math.PI;
        for (let j = 0; j < stepsV; j++) {
          const v = (j / stepsV) * Math.PI;

          const point3D = getBoyPoint(u, v);
          const proj = project(point3D);

          // Calculate continuous rainbow hue shift from previous to next dot
          const hue = ((dotIndex / totalDots) * 360 + time) % 360;
          const lightness = Math.max(30, Math.min(75, 50 + proj.z * 15)); // Simple depth shading

          ctx.fillStyle = `hsl(${hue}, 85%, ${lightness}%)`;

          // Draw individual dot
          ctx.beginPath();
          ctx.arc(proj.x, proj.y, dotRadius, 0, Math.PI * 2);
          ctx.fill();

          dotIndex++;
        }
      }

      requestAnimationFrame(render);
    }

    render();
  </script>
</body>
</html>
