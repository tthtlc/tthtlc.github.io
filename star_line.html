<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Animated String Art</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f4f4f4;
      color: #222;
      font-family: system-ui, sans-serif;
    }

    main {
      width: min(94vw, 660px);
      padding: 20px 0;
    }

    .artwork {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      background: white;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .signature {
      position: absolute;
      right: 3%;
      bottom: 2%;
      font-size: 10px;
      letter-spacing: 0.08em;
      pointer-events: none;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 14px 20px;
      padding: 20px 8px;
      font-size: 13px;
    }

    label {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input[type="range"] {
      width: 95px;
      accent-color: #222;
    }

    button {
      padding: 8px 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: white;
      color: #222;
      cursor: pointer;
    }

    button:hover {
      background: #eaeaea;
    }
  </style>
</head>

<body>
  <main>
    <div class="artwork">
      <canvas
        id="canvas"
        role="img"
        aria-label="Animated black geometric string-art rosette"
      ></canvas>

      <div class="signature">STRING ART</div>
    </div>

    <div class="controls">
      <button id="toggle" type="button">Pause</button>

      <label>
        Speed
        <input
          id="speed"
          type="range"
          min="0"
          max="2"
          step="0.05"
          value="0.65"
        >
      </label>

      <label>
        Points
        <input
          id="points"
          type="range"
          min="12"
          max="40"
          step="1"
          value="20"
        >
        <output id="pointCount">20</output>
      </label>

      <label>
        Motion
        <input
          id="motion"
          type="range"
          min="0"
          max="1"
          step="0.01"
          value="0.55"
        >
      </label>
    </div>
  </main>

  <script>
    const canvas = document.querySelector("#canvas");
    const ctx = canvas.getContext("2d");

    const toggleButton = document.querySelector("#toggle");
    const speedInput = document.querySelector("#speed");
    const pointsInput = document.querySelector("#points");
    const motionInput = document.querySelector("#motion");
    const pointCount = document.querySelector("#pointCount");

    const TAU = Math.PI * 2;

    let width = 0;
    let height = 0;
    let time = 0;
    let lastTimestamp = null;

    let running = !window.matchMedia(
      "(prefers-reduced-motion: reduce)"
    ).matches;

    function resize() {
      const bounds = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;

      width = bounds.width;
      height = bounds.height;

      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      draw();
    }

    function createPoints(count, radius, phase, motion) {
      const vertices = [];

      for (let i = 0; i < count; i++) {
        const baseAngle = (i / count) * TAU;

        // A travelling radial wave changes the shape gently.
        // At time = 0, the vertices form a regular polygon.
        const radialWave =
          Math.sin(phase * 0.9) *
          Math.cos(baseAngle * 3 - phase * 0.45);

        const r = radius * (1 + 0.11 * motion * radialWave);

        // Small angular oscillations produce shifting intersections.
        const angularWave =
          0.055 *
          motion *
          Math.sin(phase * 0.7) *
          Math.sin(baseAngle * 2 + phase * 0.4);

        const angle =
          baseAngle -
          Math.PI / 2 +
          phase * 0.075 +
          angularWave;

        vertices.push({
          x: width / 2 + Math.cos(angle) * r,
          y: height / 2 + Math.sin(angle) * r
        });
      }

      return vertices;
    }

    function draw() {
      ctx.clearRect(0, 0, width, height);

      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, width, height);

      const count = Number(pointsInput.value);
      const motion = Number(motionInput.value);
      const radius = Math.min(width, height) * 0.395;

      const vertices = createPoints(count, radius, time, motion);

      ctx.strokeStyle = "rgba(0, 0, 0, 0.87)";
      ctx.lineWidth = Math.max(0.55, width / 650);
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      // Connect every pair of perimeter points.
      // Intersections create the apparent inner rings and petals.
      ctx.beginPath();

      for (let i = 0; i < count; i++) {
        for (let j = i + 1; j < count; j++) {
          ctx.moveTo(vertices[i].x, vertices[i].y);
          ctx.lineTo(vertices[j].x, vertices[j].y);
        }
      }

      ctx.stroke();
    }

    function animate(timestamp) {
      if (lastTimestamp !== null && running) {
        // Clamp elapsed time to avoid jumping after switching tabs.
        const delta = Math.min(
          (timestamp - lastTimestamp) / 1000,
          0.05
        );

        time += delta * Number(speedInput.value);
        draw();
      }

      lastTimestamp = timestamp;
      requestAnimationFrame(animate);
    }

    function updateButton() {
      toggleButton.textContent = running ? "Pause" : "Play";
      toggleButton.setAttribute("aria-pressed", String(running));
    }

    toggleButton.addEventListener("click", () => {
      running = !running;
      updateButton();
    });

    pointsInput.addEventListener("input", () => {
      pointCount.value = pointsInput.value;
      draw();
    });

    motionInput.addEventListener("input", draw);

    new ResizeObserver(resize).observe(canvas);

    updateButton();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
