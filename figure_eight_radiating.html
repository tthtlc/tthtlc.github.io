<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="/assets/math-art.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Figure of 8 radiating with Rotating Offset Chords</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        canvas {
            background-color: white;
            border: 1px solid black;
        }

        /* Centered link at the bottom */
        .footer-link {
            position: absolute;
            bottom: 20px;
            text-align: center;
            width: 100%;
        }

        .footer-link a {
            font-size: 16px;
            color: #007bff;
            text-decoration: none;
        }

        .footer-link a:hover {
            text-decoration: underline;
        }
</style>
<!-- Google tag (gtag.js) --> <script async src="https://www.googletagmanager.com/gtag/js?id=G-GEX61LPT08"></script> <script>   window.dataLayer = window.dataLayer || [];   function gtag(){dataLayer.push(arguments);}   gtag('js', new Date());   gtag('config', 'G-GEX61LPT08'); </script> </head>
<body>
    <canvas id="figure8Canvas" width="800" height="800"></canvas>


    <script>
document.addEventListener("contextmenu", function(event) { event.preventDefault(); });
        const canvas = document.getElementById('figure8Canvas');
        const ctx = canvas.getContext('2d');

        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const points = [];
        const total_num_point = 120;
        const half = total_num_point / 2;
        const rotationCenter = { x: centerX, y: centerY };  // Rotation around the canvas centre
        let rotationAngle = 0;  // Rotation angle in radians

        // Pulsing scale of the figure of 8
        let scale = 100;
        let scaleDirection = 1; // 1 for increasing, -1 for decreasing
        const minScale = 100;
        const maxScale = 400;
        const scaleSpeed = 1; // Adjust speed of size change

        let offset = 4;  // Start offset value for the connecting chords
        let increasing = true;  // To track if offset is increasing or decreasing

        // Function to apply rotation about a given point
        function rotatePoint(x, y, cx, cy, angle) {
            const cosA = Math.cos(angle);
            const sinA = Math.sin(angle);
            const dx = x - cx;
            const dy = y - cy;

            const rotatedX = cx + dx * cosA - dy * sinA;
            const rotatedY = cy + dx * sinA + dy * cosA;

            return { x: rotatedX, y: rotatedY };
        }

        // Function to draw the figure of 8 curve (lemniscate of Bernoulli).
        // r^2 = cos(2*theta) only exists where cos(2*theta) >= 0, so the two
        // lobes are sampled over [-pi/4, pi/4] and [3pi/4, 5pi/4].
        function drawFigure8() {
            ctx.clearRect(0, 0, canvas.width, canvas.height); // Clear the canvas
            points.length = 0; // Clear points array before redrawing

            for (let i = 0; i < total_num_point; i++) {
                let theta;
                if (i < half) {
                    theta = -Math.PI / 4 + (i / (half - 1)) * (Math.PI / 2);
                } else {
                    theta = 3 * Math.PI / 4 + ((i - half) / (half - 1)) * (Math.PI / 2);
                }
                const r = scale * Math.sqrt(Math.max(0, Math.cos(2 * theta)));
                const x = r * Math.cos(theta) + centerX;
                const y = r * Math.sin(theta) + centerY;

                // Rotate the point around the canvas centre
                let rotatedPoint = rotatePoint(x, y, rotationCenter.x, rotationCenter.y, rotationAngle);
                points.push(rotatedPoint);
            }

            // Draw the figure of 8 outline
            ctx.strokeStyle = 'blue';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            for (let i = 1; i < points.length; i++) {
                ctx.lineTo(points[i].x, points[i].y);
            }
            ctx.closePath();
            ctx.stroke();
        }

        // Function to connect points based on the current offset: each point is
        // joined to the point offset ahead of it along the curve, filling the
        // figure of 8 with chords. The offset cycles up and down so the web of
        // lines inside the figure keeps re-wiring itself.
        function connectPoints() {
            ctx.lineWidth = 1;         // Set line width
            let numPoints = points.length;

            for (let i = 0; i < numPoints; i++) {
                let nextIndex = (i + offset) % numPoints;  // Wrap around with modulus

                // Dynamically set the color using HSL, varying by nextIndex
                ctx.strokeStyle = `hsl(${(nextIndex / numPoints) * 360}, 100%, 50%)`;

                ctx.beginPath();
                ctx.moveTo(points[i].x, points[i].y);  // Move to the current point
                ctx.lineTo(points[nextIndex].x, points[nextIndex].y);  // Connect to the point at (i + offset) % numPoints
                ctx.stroke();
            }
        }

        // Function to animate the rotation, scale, offset change and redraw the canvas
        function animate() {
            rotationAngle += 0.01;  // Increase the rotation angle

            // Adjust the scale factor based on direction
            scale += scaleSpeed * scaleDirection;

            // Reverse the direction of scaling when limits are reached
            if (scale >= maxScale || scale <= minScale) {
                scaleDirection *= -1;
            }

            drawFigure8();  // Redraw the figure of 8 with the new rotation and scale
            connectPoints();  // Connect points based on current offset

            // Update the offset value
            if (increasing) {
                offset++;
                if (offset >= points.length) {
                    increasing = false;  // Start decreasing when offset reaches points.length
                }
            } else {
                offset--;
                if (offset <= 4) {
                    increasing = true;  // Start increasing when offset goes below 4
                }
            }

            requestAnimationFrame(animate);  // Continue the animation
        }

        // Initialize and start the animation
        drawFigure8();  // Initial figure of 8 drawing
        animate();  // Start the animation loop
    </script>
</body>
</html>
