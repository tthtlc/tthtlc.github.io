<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Multiple closed torus bands</title><style>*{box-sizing:border-box}body{margin:0;background:#05070b;color:#eaf2ff;font:14px system-ui}canvas{display:block;width:100vw;height:100vh;touch-action:none}.panel{position:absolute;top:16px;left:16px;width:300px;max-height:calc(100vh - 32px);overflow:auto;padding:18px;background:#101725ed;border:1px solid #ffffff25;border-radius:15px}h1{font-size:19px;margin:0 0 8px}p{font-size:13px;line-height:1.5;color:#aebed1}label{display:flex;align-items:center;justify-content:space-between;margin-top:14px;gap:10px}input[type=range]{width:100%;accent-color:#7edfff}output{white-space:nowrap;color:#a8e9ff;font-variant-numeric:tabular-nums}button{background:#ffffff13;color:inherit;border:1px solid #ffffff30;border-radius:8px;padding:8px;margin:12px 4px 0 0;cursor:pointer}.eq{font:12px monospace;color:#aed5eb;line-height:1.8;margin-top:14px}.status{font-size:12px;color:#9fe3cb;line-height:1.5;margin-top:12px}@media(max-width:600px){.panel{width:230px;top:8px;left:8px;max-height:calc(100vh - 16px);padding:12px}.eq{display:none}h1{font-size:16px}label{margin-top:10px}}</style></head><body><canvas id="c" aria-label="Interactive visualization of closed ribbons around an adjustable torus"></canvas><section class="panel" id="panel"><h1>Repeated closed torus bands</h1><p>Each band repeats the same closed path, rotated around the torus axis. Drag to orbit; scroll or pinch to zoom.</p><label for="count">Number of bands <output id="countValue"></output></label><input id="count" type="range" min="1" max="24" step="1" value="6"><label for="spacing">Angle between bands <output id="spacingValue"></output></label><input id="spacing" type="range" min="0" max="360" step="any" value="60"><button id="even">Space evenly</button><label for="phase">Rotate all bands <output id="phaseValue"></output></label><input id="phase" type="range" min="0" max="360" value="0"><label for="hole">Inner hole radius <output id="holeValue"></output></label><input id="hole" type="range" min="0" max="2" step="0.01" value="0.65"><button id="zero">Set hole to zero</button><label for="width">Ribbon width <output id="widthValue"></output></label><input id="width" type="range" min="3" max="70" value="25"><label>Show torus guide<input id="guide" type="checkbox"></label><label>Show closure points<input id="markers" type="checkbox"></label><button id="play">Pause</button><button id="reset">Reset view</button><div class="status" id="status"></div><div class="eq">uₖ(t) = 2πt + φ + kΔ<br>v(t) = π/2 − 2πt<br>k = 0, …, band count − 1<br>Each band: Pₖ(0) = Pₖ(1)<br>Tube radius = 1; R = 1 + hole<br>H: hide controls · Space: pause</div></section><script>
'use strict';const $=id=>document.getElementById(id),c=$('c'),ctx=c.getContext('2d'),TAU=2*Math.PI,rad=Math.PI/180,r=1;let R=1.65,W,H,vertices=[],faces=[],lines=[],starts=[],yaw=.4,pitch=.95,zoom=1,running=true,dirty=true,last=0,pinch=0;const pointers=new Map();
function resize(){W=innerWidth;H=innerHeight;let d=Math.min(devicePixelRatio||1,2);c.width=W*d;c.height=H*d;ctx.setTransform(d,0,0,d,0,0);dirty=true}addEventListener('resize',resize);resize();
function pt(u,v){let a=R+r*Math.cos(v);return[a*Math.cos(u),a*Math.sin(u),r*Math.sin(v)]}
function build(){const n=+$('count').value,delta=+$('spacing').value*rad,phase=+$('phase').value*rad,hole=+$('hole').value,width=+$('width').value*rad;R=1+hole;vertices=[];faces=[];lines=[];starts=[];
for(let id of ['count','spacing','phase','hole','width'])$(id+'Value').value=id==='hole'?(+$(id).value).toFixed(2):$(id).value+(['spacing','phase','width'].includes(id)?'°':'');
const steps=400,K=5;
for(let b=0;b<n;b++){const offset=phase+b*delta,base=vertices.length;starts.push(pt(offset,Math.PI/2));for(let i=0;i<steps;i++){let t=i/steps;for(let j=0;j<=K;j++)vertices.push(pt(TAU*t+offset,Math.PI/2-TAU*t+(j/K-.5)*width))}
for(let i=0;i<steps;i++)for(let j=0;j<K;j++){let t=(i+.5)/steps,u=TAU*t+offset,v=Math.PI/2-TAU*t+((j+.5)/K-.5)*width,a=base+i*(K+1)+j,bnext=base+((i+1)%steps)*(K+1)+j;faces.push({idx:[a,bnext,bnext+1,a+1],normal:[Math.cos(u)*Math.cos(v),Math.sin(u)*Math.cos(v),Math.sin(v)],hue:(190+145*Math.sin(TAU*t)+b*9)%360})}}
for(let j=0;j<16;j++)for(let i=0;i<100;i++)lines.push([pt(TAU*i/100,TAU*j/16),pt(TAU*(i+1)/100,TAU*j/16)]);for(let j=0;j<24;j++)for(let i=0;i<60;i++)lines.push([pt(TAU*j/24,TAU*i/60),pt(TAU*j/24,TAU*(i+1)/60)]);
$('status').textContent=n+' individually closed '+(n===1?'band':'bands')+' · '+(+$('spacing').value).toFixed(1)+'° spacing.'+(hole===0?' Hole closed at the center.':'')+' Changing the count restores even spacing.';dirty=true}
function rot(p){let a=p[0]*Math.cos(yaw)-p[1]*Math.sin(yaw),b=p[0]*Math.sin(yaw)+p[1]*Math.cos(yaw);return[a,b*Math.cos(pitch)-p[2]*Math.sin(pitch),b*Math.sin(pitch)+p[2]*Math.cos(pitch)]}
function project(p){let q=rot(p),s=Math.min(W,H)*.42/(R+r)*zoom*14/(14-q[2]);return[W*.54+q[0]*s,H*.53-q[1]*s,q[2]]}
function draw(){ctx.fillStyle='#05070b';ctx.fillRect(0,0,W,H);if($('guide').checked){ctx.strokeStyle='#879fc638';ctx.lineWidth=.6;ctx.beginPath();for(let [a,b] of lines){a=project(a);b=project(b);ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1])}ctx.stroke()}
const projected=vertices.map(project),ordered=faces.map(f=>({f,z:f.idx.reduce((s,i)=>s+projected[i][2],0)*.25})).sort((a,b)=>a.z-b.z);
for(let {f} of ordered){let normal=rot(f.normal),light=.65+.35*Math.abs(normal[0]*-.3+normal[1]*.4+normal[2]*.866);ctx.fillStyle=`hsl(${f.hue} 85% ${66*light}%)`;ctx.beginPath();let p=projected[f.idx[0]];ctx.moveTo(p[0],p[1]);for(let k=1;k<4;k++){p=projected[f.idx[k]];ctx.lineTo(p[0],p[1])}ctx.closePath();ctx.fill();ctx.strokeStyle=ctx.fillStyle;ctx.lineWidth=.35;ctx.stroke()}
if($('markers').checked)starts.forEach((p,i)=>{let q=project(p);ctx.fillStyle='#dcfaff';ctx.beginPath();ctx.arc(q[0],q[1],4,0,TAU);ctx.fill();ctx.font='12px system-ui';ctx.strokeStyle='#05070b';ctx.lineWidth=3;let text='Band '+(i+1);ctx.strokeText(text,q[0]+8,q[1]-8);ctx.fillText(text,q[0]+8,q[1]-8)})}
function evenly(){
$('spacing').value=360/(+$('count').value);build()}
$('count').oninput=evenly;$('even').onclick=evenly;for(let id of ['spacing','phase','hole','width'])$(id).oninput=build;$('zero').onclick=()=>{$('hole').value=0;build()};for(let id of ['guide','markers'])$(id).onchange=()=>dirty=true;
function toggle(){running=!running;$('play').textContent=running?'Pause':'Resume'}function reset(){yaw=.4;pitch=.95;zoom=1;dirty=true}$('play').onclick=toggle;$('reset').onclick=reset;c.ondblclick=reset;
c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});pinch=0};c.onpointermove=e=>{if(!pointers.has(e.pointerId))return;let old=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){yaw+=(e.clientX-old.x)*.007;pitch+=(e.clientY-old.y)*.007}else{let [a,b]=[...pointers.values()],d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch)zoom=Math.max(.3,Math.min(3,zoom*d/pinch));pinch=d}dirty=true};function release(e){pointers.delete(e.pointerId);pinch=0}c.onpointerup=release;c.onpointercancel=release;c.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.3,Math.min(3,zoom*Math.exp(-e.deltaY*.001)));dirty=true},{passive:false});addEventListener('keydown',e=>{if(e.target.matches('input,button'))return;if(e.code==='Space'){e.preventDefault();toggle()}if(e.key.toLowerCase()==='h')$('panel').hidden=!$('panel').hidden});function frame(t){let dt=Math.min((t-last)/1000,.05);last=t;if(running&&!pointers.size){yaw+=dt*.12;dirty=true}if(dirty){draw();dirty=false}requestAnimationFrame(frame)}build();requestAnimationFrame(frame);
</script></body></html>
