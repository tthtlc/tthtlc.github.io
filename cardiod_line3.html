    <title>Concentric Breathing Cardioids with Colored Connections</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        canvas {
            border: 1px solid black;
        }
    
        /* Centered link at the bottom */ 
        .footer-link { 
            position: absolute; 
            bottom: 20px; 
            text-align: center; 
            width: 100%; 
        } 
 
        .footer-link a { 
            font-size: 16px; 
            color: #007bff; 
            text-decoration: none; 
        } 
 
        .footer-link a:hover { 
            text-decoration: underline; 
        } 
</style>

<body>

<canvas id="cardioidCanvas" width="800" height="800"></canvas>


    <script> 
document.addEventListener("contextmenu", function(event) { event.preventDefault(); });
const canvas = document.getElementById('cardioidCanvas');
const ctx = canvas.getContext('2d');

// Shared center for the two concentric cardioids
const centerX = canvas.width / 2;
const centerY = canvas.height / 2;

const total_num_point = 120;
const angleinc = 2 * Math.PI / total_num_point;

// Size range for the breathing cardioids (outer grows to max, inner shrinks to min)
const minRadius = 30;   // smallest the inner cardioid gets
const maxRadius = 185;  // largest the outer cardioid fits within the canvas
const sizeStep = 0.5;   // how quickly the radii change each frame

const pointsOuter = [];
const pointsInner = [];

let radiusOuter = minRadius;   // grows to max, then shrinks back
let radiusInner = maxRadius;   // shrinks to min, then grows back
let growing = true;            // direction of radiusOuter

let offset = 4;                // start offset value
let offsetIncreasing = true;   // direction of the connecting-line offset

// Draw one cardioid centered at (cx, cy) with radius r, storing its points
function drawCardioid(cx, cy, r, points, color) {
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;

    ctx.beginPath();
    points.length = 0; // Clear points array before redrawing

    for (let theta = 0; theta <= 2 * Math.PI; theta += angleinc) {
        let x = r * (1 - Math.cos(theta)) * Math.cos(theta) + cx;
        let y = r * (1 - Math.cos(theta)) * Math.sin(theta) + cy;
        points.push({ x: x, y: y });

        if (theta === 0) {
            ctx.moveTo(x, y);
        } else {
            ctx.lineTo(x, y);
        }
    }

    ctx.closePath();
    ctx.stroke();  // Render the cardioid
}

// Connect the outer cardioid's points to the inner cardioid's points by offset
function connectPoints() {
    ctx.lineWidth = 1;

    let numPoints = pointsOuter.length;

    for (let i = 0; i < numPoints; i++) {
        let nextIndex = (i + offset) % numPoints;  // Wrap around with modulus

        // Colored lines, hue varies by nextIndex (like cardiod_line4.html)
        ctx.strokeStyle = `hsl(${(nextIndex / numPoints) * 360}, 100%, 50%)`;

        ctx.beginPath();
        ctx.moveTo(pointsOuter[i].x, pointsOuter[i].y);
        ctx.lineTo(pointsInner[nextIndex].x, pointsInner[nextIndex].y);
        ctx.stroke();
    }
}

// Animate the radii and the connecting-line offset, then redraw
function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    drawCardioid(centerX, centerY, radiusOuter, pointsOuter, 'red');
    drawCardioid(centerX, centerY, radiusInner, pointsInner, 'red');
    connectPoints();

    // Update the radii: outer grows while inner shrinks, then reverse
    if (growing) {
        radiusOuter += sizeStep;
        radiusInner -= sizeStep;
        if (radiusOuter >= maxRadius) {
            radiusOuter = maxRadius;
            radiusInner = minRadius;
            growing = false;  // Outer hit the max; start shrinking it
        }
    } else {
        radiusOuter -= sizeStep;
        radiusInner += sizeStep;
        if (radiusOuter <= minRadius) {
            radiusOuter = minRadius;
            radiusInner = maxRadius;
            growing = true;  // Outer hit the min; start growing it again
        }
    }

    // Update the connecting-line offset (grow to max, then shrink back)
    if (offsetIncreasing) {
        offset++;
        if (offset >= pointsOuter.length) {
            offsetIncreasing = false;
        }
    } else {
        offset--;
        if (offset <= 4) {
            offsetIncreasing = true;
        }
    }

    requestAnimationFrame(animate);
}

// Initialize and start the animation
drawCardioid(centerX, centerY, radiusOuter, pointsOuter, 'red');
drawCardioid(centerX, centerY, radiusInner, pointsInner, 'red');
animate();
</script>

</body>
