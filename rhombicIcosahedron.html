<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="/assets/math-art.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rhombic Icosahedron — Random Tumble</title>
  <style>
      body {
          display: flex;
          flex-direction: column;
          align-items: center;
          margin: 0;
          background: var(--paper, #f6f3ea);
          color: var(--ink, #1d2620);
      }
      header.band {
          width: 100%;
          background: var(--cloth, #2f4a3e);
          color: var(--cloth-ink, #ece7d6);
          padding: 18px 16px 14px;
          text-align: center;
      }
      header.band h1 {
          margin: 0 0 4px;
          font-size: 1.9rem;
          color: var(--cloth-ink, #ece7d6);
      }
      header.band .sub {
          margin: 0;
          color: var(--cloth-ink-dim, #c7c3af);
          font-size: 0.95rem;
      }
      .stage {
          display: flex;
          flex-direction: column;
          align-items: center;
          padding: 18px 12px 10px;
      }
      canvas {
          background: #fffdf5;
          border: 1px solid var(--hairline-strong, #c3bb9f);
          border-radius: 6px;
          box-shadow: 0 2px 10px rgba(29, 38, 32, 0.12);
          max-width: 100%;
          height: auto;
          cursor: grab;
          touch-action: none;
      }
      canvas.grabbing { cursor: grabbing; }
      .controls {
          display: flex;
          flex-wrap: wrap;
          justify-content: center;
          align-items: center;
          gap: 6px 22px;
          margin-top: 14px;
          font-size: 0.92rem;
          color: var(--ink-soft, #39443d);
      }
      .controls label {
          display: flex;
          align-items: center;
          gap: 8px;
      }
      input[type="range"] { accent-color: var(--gilt, #b3822c); }
      input[type="checkbox"] { accent-color: var(--gilt, #b3822c); }
      .attribution {
          margin: 10px 0 30px;
          font-size: 0.82rem;
          color: var(--marginalia, #5d635a);
          text-align: center;
          max-width: 560px;
          padding: 0 12px;
      }
  </style>
</head>
<body>
    <header class="band">
        <h1>Rhombic Icosahedron</h1>
        <p class="sub">A zonohedron — 20 rhombic faces · 40 edges · 22 vertices · D<sub>5d</sub> symmetry</p>
    </header>

    <div class="stage">
        <canvas id="canvas"></canvas>
        <div class="controls">
            <label>Scale
                <input type="range" id="scaleRange" min="40" max="240" value="108">
            </label>
            <label>Spin speed
                <input type="range" id="speedRange" min="0" max="3" step="0.05" value="1">
            </label>
            <label><input type="checkbox" id="wireframeBox"> Wireframe</label>
            <label><input type="checkbox" id="labelsBox"> Vertex indices</label>
        </div>
        <p class="attribution">
            Vertex &amp; face data: David I. McCooey,
            <a href="https://dmccooey.com/polyhedra/RhombicIcosahedron.html">Visual Polyhedra</a>.
            Drag to spin manually; the tumble picks a new random direction every few seconds.
        </p>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // ---- crisp rendering on hi-dpi screens -------------------------------
        const SIZE = 640;                          // logical size in CSS px
        const DPR = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = SIZE * DPR;
        canvas.height = SIZE * DPR;
        canvas.style.width = SIZE + 'px';
        canvas.style.height = SIZE + 'px';
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        const CX = SIZE / 2, CY = SIZE / 2;

        // ---- geometry: rhombic icosahedron (edge length = 1) ----------------
        // Coordinates from D. McCooey's Visual Polyhedra.
        const s5 = Math.sqrt(5);
        const C0 = Math.sqrt(10 * (25 - 11 * s5)) / 20;
        const C1 = Math.sqrt(10 * (5 - s5)) / 20;
        const C2 = Math.sqrt(10 * (5 + s5)) / 20;
        const C3 = Math.sqrt(10 * (5 - s5)) / 10;
        const C4 = Math.sqrt(2 * (5 - s5)) / 4;
        const C5 = Math.sqrt(10 * (5 + s5)) / 10;
        const C6 = Math.sqrt(2 * (5 + s5)) / 4;
        const C7 = Math.sqrt(10 * (25 + 11 * s5)) / 20;
        const C8 = Math.sqrt(5 * (5 + 2 * s5)) / 5;

        const vertices = [
            [ C2, -C1,  C8], //  0
            [ C2, -C1, -C8], //  1
            [-C2,  C1,  C8], //  2
            [-C2,  C1, -C8], //  3
            [ C2, -C7,  C5], //  4
            [ C2, -C7, -C5], //  5
            [-C2,  C7,  C5], //  6
            [-C2,  C7, -C5], //  7
            [ C2,  C4,  C5], //  8
            [ C2,  C4, -C5], //  9
            [-C2, -C4,  C5], // 10
            [-C2, -C4, -C5], // 11
            [ C6, -C1,  C3], // 12
            [ C6, -C1, -C3], // 13
            [-C6,  C1,  C3], // 14
            [-C6,  C1, -C3], // 15
            [ C6, -C7,   0], // 16
            [-C6,  C7,   0], // 17
            [ C6,  C4,   0], // 18
            [-C6, -C4,   0], // 19
            [ C0,  C7,   0], // 20
            [-C0, -C7,   0]  // 21
        ];

        // The 20 rhombic faces, each as 4 vertex indices in cyclic order.
        const faces = [
            [18,  8,  0, 12], [18, 12, 16, 13], [18, 13,  1,  9], [18,  9,  7, 20], [18, 20,  6,  8],
            [19, 10,  2, 14], [19, 14, 17, 15], [19, 15,  3, 11], [19, 11,  5, 21], [19, 21,  4, 10],
            [ 8,  6,  2,  0], [ 9,  1,  3,  7], [10,  4,  0,  2], [11,  3,  1,  5],
            [12,  0,  4, 16], [13, 16,  5,  1], [14,  2,  6, 17], [15, 17,  7,  3],
            [20,  7, 17,  6], [21,  5, 16,  4]
        ];

        // Derive the 40 unique edges from the faces so adjacencies can never drift.
        const edgeSet = new Set();
        const edges = [];
        for (const f of faces) {
            for (let i = 0; i < 4; i++) {
                const a = f[i], b = f[(i + 1) % 4];
                const key = a < b ? a + ',' + b : b + ',' + a;
                if (!edgeSet.has(key)) { edgeSet.add(key); edges.push([a, b]); }
            }
        }

        // ---- rotation state: orientation matrix + random-walking spin --------
        let R = [1, 0, 0,  0, 1, 0,  0, 0, 1];   // row-major 3x3
        const w = [0.3, 0.5, 0.2];               // current angular velocity
        let wTarget = randomSpin();              // next random spin direction
        let retargetAt = 3;                      // seconds (perf.now/1000 basis)

        function randomSpin() {
            // Uniformly random direction on the sphere, random rate.
            const th = Math.random() * 2 * Math.PI;
            const ph = Math.acos(2 * Math.random() - 1);
            const rate = 0.4 + Math.random() * 0.9;
            return [
                rate * Math.sin(ph) * Math.cos(th),
                rate * Math.sin(ph) * Math.sin(th),
                rate * Math.cos(ph)
            ];
        }

        function axisAngle(nx, ny, nz, a) {
            const c = Math.cos(a), s = Math.sin(a), t = 1 - c;
            return [
                nx * nx * t + c,     nx * ny * t - nz * s, nx * nz * t + ny * s,
                nx * ny * t + nz * s, ny * ny * t + c,     ny * nz * t - nx * s,
                nx * nz * t - ny * s, ny * nz * t + nx * s, nz * nz * t + c
            ];
        }

        function matMul(A, B) {
            const r = new Array(9);
            for (let i = 0; i < 3; i++)
                for (let j = 0; j < 3; j++)
                    r[3 * i + j] = A[3 * i] * B[j] + A[3 * i + 1] * B[3 + j] + A[3 * i + 2] * B[6 + j];
            return r;
        }

        // ---- drag to spin manually (world-frame rotations) ------------------
        let dragging = false, lastX = 0, lastY = 0;
        canvas.addEventListener('pointerdown', (e) => {
            dragging = true;
            lastX = e.clientX; lastY = e.clientY;
            canvas.classList.add('grabbing');
            canvas.setPointerCapture(e.pointerId);
        });
        canvas.addEventListener('pointermove', (e) => {
            if (!dragging) return;
            const dx = e.clientX - lastX, dy = e.clientY - lastY;
            lastX = e.clientX; lastY = e.clientY;
            const k = 0.005;
            R = matMul(axisAngle(0, 1, 0, -dx * k), R);   // drag sideways: spin about y
            R = matMul(axisAngle(1, 0, 0, -dy * k), R);   // drag vertically: spin about x
            w[0] *= 0.85; w[1] *= 0.85; w[2] *= 0.85;     // let the drag take over
        });
        canvas.addEventListener('pointerup', () => { dragging = false; canvas.classList.remove('grabbing'); });
        canvas.addEventListener('pointercancel', () => { dragging = false; canvas.classList.remove('grabbing'); });

        // ---- projection & shading -------------------------------------------
        const DIST = 5;                                  // perspective distance
        const LIGHT = normalize([0.55, 0.8, 1.0]);       // fixed light, world frame

        function normalize(v) {
            const m = Math.hypot(v[0], v[1], v[2]);
            return [v[0] / m, v[1] / m, v[2] / m];
        }

        function draw() {
            const scale = parseInt(document.getElementById('scaleRange').value, 10);
            const wireframe = document.getElementById('wireframeBox').checked;
            const showLabels = document.getElementById('labelsBox').checked;

            ctx.clearRect(0, 0, SIZE, SIZE);

            // Rotate + project.
            const rot = vertices.map(([x, y, z]) => [
                R[0] * x + R[1] * y + R[2] * z,
                R[3] * x + R[4] * y + R[5] * z,
                R[6] * x + R[7] * y + R[8] * z
            ]);
            const proj = rot.map(([x, y, z]) => {
                const f = DIST / (DIST - z) * scale;
                return [CX + x * f, CY - y * f, z];
            });

            // Per-face depth, outward normal and lighting.
            const faceData = faces.map(f => {
                const [a, b, c] = f;
                const u = [rot[b][0] - rot[a][0], rot[b][1] - rot[a][1], rot[b][2] - rot[a][2]];
                const v = [rot[c][0] - rot[a][0], rot[c][1] - rot[a][1], rot[c][2] - rot[a][2]];
                let n = [u[1] * v[2] - u[2] * v[1], u[2] * v[0] - u[0] * v[2], u[0] * v[1] - u[1] * v[0]];
                const cx = (rot[a][0] + rot[b][0] + rot[c][0] + rot[f[3]][0]) / 4;
                const cy = (rot[a][1] + rot[b][1] + rot[c][1] + rot[f[3]][1]) / 4;
                const cz = (rot[a][2] + rot[b][2] + rot[c][2] + rot[f[3]][2]) / 4;
                if (n[0] * cx + n[1] * cy + n[2] * cz < 0) n = [-n[0], -n[1], -n[2]]; // orient outward
                n = normalize(n);
                return { f, n, z: cz };
            });

            // Painter's algorithm: farthest (smallest z) first.
            faceData.sort((p, q) => p.z - q.z);

            for (const { f, n, z } of faceData) {
                ctx.beginPath();
                ctx.moveTo(proj[f[0]][0], proj[f[0]][1]);
                for (let i = 1; i < 4; i++) ctx.lineTo(proj[f[i]][0], proj[f[i]][1]);
                ctx.closePath();
                if (!wireframe) {
                    const lambert = Math.max(0, n[0] * LIGHT[0] + n[1] * LIGHT[1] + n[2] * LIGHT[2]);
                    const t = 0.22 + 0.78 * lambert;     // deep bronze -> bright gilt
                    ctx.fillStyle = 'rgb(' +
                        Math.round(92 + (208 - 92) * t) + ',' +
                        Math.round(64 + (161 - 64) * t) + ',' +
                        Math.round(16 + (76 - 16) * t) + ')';
                    ctx.fill();
                }
            }

            // Edge pass on top of the fills.
            ctx.strokeStyle = 'rgba(29, 38, 32, 0.85)';
            ctx.lineWidth = 1.4;
            ctx.beginPath();
            for (const [a, b] of edges) {
                ctx.moveTo(proj[a][0], proj[a][1]);
                ctx.lineTo(proj[b][0], proj[b][1]);
            }
            ctx.stroke();

            if (showLabels) {
                ctx.fillStyle = '#a63a2e';
                ctx.font = '11px "Source Code Pro", Menlo, Consolas, monospace';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'alphabetic';
                proj.forEach(([x, y], i) => ctx.fillText(i, x + 5, y - 4));
            }
        }

        // ---- animation loop --------------------------------------------------
        let last = performance.now();
        function frame(now) {
            const t = now / 1000;
            const dt = Math.min((now - last) / 1000, 0.05);
            last = now;

            // Occasionally pick a new random spin direction.
            if (t >= retargetAt) {
                wTarget = randomSpin();
                retargetAt = t + 4 + Math.random() * 5;
            }

            // Ease the angular velocity toward the target, then step the matrix.
            const k = 1 - Math.exp(-dt * 0.5);
            w[0] += (wTarget[0] - w[0]) * k;
            w[1] += (wTarget[1] - w[1]) * k;
            w[2] += (wTarget[2] - w[2]) * k;
            const speed = parseFloat(document.getElementById('speedRange').value);
            const ang = Math.hypot(w[0], w[1], w[2]);
            if (ang > 1e-6) {
                R = matMul(axisAngle(w[0] / ang, w[1] / ang, w[2] / ang, ang * dt * speed), R);
            }

            draw();
            requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
    </script>
</body>
</html>
