<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pink Circular String Art</title>

  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      background: #151b1b;
      color: #f8e5ed;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(100%, 800px);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.5rem;
      font-weight: 600;
    }

    .description {
      margin: 0 0 20px;
      color: #b7c3c1;
      line-height: 1.5;
    }

    .artwork {
      overflow: hidden;
      border: 1px solid #354140;
      border-radius: 16px;
      box-shadow: 0 20px 60px #0007;
      background: #172020;
      aspect-ratio: 1;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-top: 20px;
    }

    label {
      display: grid;
      gap: 8px;
      font-size: 0.9rem;
    }

    .label-line {
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    output {
      color: #f7a0bb;
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #ed8ba8;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      padding: 10px 16px;
      border: 1px solid #52605e;
      border-radius: 8px;
      background: #263230;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }

    button:hover {
      background: #35423f;
    }

    @media (max-width: 560px) {
      body {
        padding: 14px;
      }

      .controls {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>Pink circular string art</h1>
    <p class="description">
      A layered web of straight threads stretched between pins on a circle.
    </p>

    <div class="artwork">
      <canvas id="canvas"
        role="img"
        aria-label="Pink circular string art on a dark textured background">
      </canvas>
    </div>

    <div class="controls">
      <label>
        <span class="label-line">
          Pins <output id="pinsValue"></output>
        </span>
        <input id="pins" type="range"
          min="100" max="420" step="2" value="240">
      </label>

      <label>
        <span class="label-line">
          Pattern <output id="patternValue"></output>
        </span>
        <input id="pattern" type="range"
          min="2" max="7" step="0.01" value="2">
      </label>

      <label>
        <span class="label-line">
          Thread opacity <output id="opacityValue"></output>
        </span>
        <input id="opacity" type="range"
          min="0.04" max="0.5" step="0.01" value="0.20">
      </label>
    </div>

    <div class="buttons">
      <button id="animate">Animate pattern</button>
      <button id="reset">Reset</button>
      <button id="download">Download PNG</button>
    </div>
  </main>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const controls = {
      pins: document.getElementById("pins"),
      pattern: document.getElementById("pattern"),
      opacity: document.getElementById("opacity")
    };

    const outputs = {
      pins: document.getElementById("pinsValue"),
      pattern: document.getElementById("patternValue"),
      opacity: document.getElementById("opacityValue")
    };

    const TAU = Math.PI * 2;

    let size = 800;
    let animationId = null;
    let previousTime = 0;
    let texture = null;
    let textureSize = 0;

    // A seeded generator keeps the background texture reproducible.
    function randomGenerator(seed) {
      return function () {
        seed |= 0;
        seed = seed + 0x6D2B79F5 | 0;

        let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
        t ^= t + Math.imul(t ^ t >>> 7, 61 | t);

        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    function makeTexture(width) {
      const layer = document.createElement("canvas");
      layer.width = width;
      layer.height = width;

      const layerCtx = layer.getContext("2d");
      const pixels = layerCtx.createImageData(width, width);
      const random = randomGenerator(48271);

      for (let y = 0; y < width; y++) {
        for (let x = 0; x < width; x++) {
          const i = (y * width + x) * 4;

          const nx = x / width;
          const ny = y / width;

          const light = Math.exp(
            -(
              (nx - 0.65) ** 2 +
              (ny - 0.04) ** 2
            ) / 0.23
          );

          const grain = (random() - 0.5) * 24;
          const shade = 19 + light * 47 + grain;

          pixels.data[i] = shade * 0.91;
          pixels.data[i + 1] = shade * 1.04;
          pixels.data[i + 2] = shade * 1.03;
          pixels.data[i + 3] = 255;
        }
      }

      layerCtx.putImageData(pixels, 0, 0);

      const vignette = layerCtx.createRadialGradient(
        width / 2, width / 2, width * 0.15,
        width / 2, width / 2, width * 0.72
      );

      vignette.addColorStop(0, "rgba(0,0,0,0)");
      vignette.addColorStop(1, "rgba(0,0,0,0.50)");

      layerCtx.fillStyle = vignette;
      layerCtx.fillRect(0, 0, width, width);

      return layer;
    }

    function point(index, count, radius, cx, cy) {
      const angle = TAU * index / count - Math.PI / 2;

      return {
        x: cx + radius * Math.cos(angle),
        y: cy + radius * Math.sin(angle)
      };
    }

    function drawThreadFamily({
      count,
      multiplier,
      offset,
      radius,
      cx,
      cy,
      alpha,
      color,
      width
    }) {
      ctx.beginPath();

      for (let i = 0; i < count; i++) {
        const start = point(i, count, radius, cx, cy);
        const end = point(
          multiplier * i + offset,
          count,
          radius,
          cx,
          cy
        );

        ctx.moveTo(start.x, start.y);
        ctx.lineTo(end.x, end.y);
      }

      ctx.lineWidth = width;
      ctx.strokeStyle = `rgba(${color},${alpha})`;
      ctx.stroke();
    }

    function draw() {
      const count = Number(controls.pins.value);
      const multiplier = Number(controls.pattern.value);
      const opacity = Number(controls.opacity.value);

      outputs.pins.value = count;
      outputs.pattern.value = multiplier.toFixed(2);
      outputs.opacity.value = opacity.toFixed(2);

      const cx = size / 2;
      const cy = size / 2;
      const radius = size * 0.441;
      const scale = size / 800;

      if (!texture || textureSize !== size) {
        texture = makeTexture(size);
        textureSize = size;
      }

      ctx.clearRect(0, 0, size, size);
      ctx.drawImage(texture, 0, 0);

      // Subtle shadow beneath the circular artwork.
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, TAU);
      ctx.strokeStyle = "rgba(0,0,0,0.6)";
      ctx.lineWidth = 5 * scale;
      ctx.shadowColor = "rgba(0,0,0,0.65)";
      ctx.shadowBlur = 11 * scale;
      ctx.shadowOffsetY = 4 * scale;
      ctx.stroke();
      ctx.restore();

      // Nearby offsets create overlapping curved envelopes.
      const offsets = [-18, -11, -5, 0, 5, 11, 18];

      for (let layer = 0; layer < offsets.length; layer++) {
        drawThreadFamily({
          count,
          multiplier,
          offset: offsets[layer] * count / 240,
          radius,
          cx,
          cy,
          alpha: opacity * (layer === 3 ? 1.15 : 0.72),
          color: layer % 2 ? "255,167,191" : "236,118,158",
          width: 0.48 * scale
        });
      }

      // Sparse higher-order families add the smaller internal lobes.
      for (const offset of [-9, 9]) {
        drawThreadFamily({
          count,
          multiplier: multiplier + 2,
          offset: offset * count / 240,
          radius,
          cx,
          cy,
          alpha: opacity * 0.44,
          color: "255,176,196",
          width: 0.42 * scale
        });
      }

      // Short chords build the densely wrapped outer rim.
      for (const step of [2, 5, 9, 14]) {
        drawThreadFamily({
          count,
          multiplier: 1,
          offset: step * count / 240,
          radius,
          cx,
          cy,
          alpha: opacity * 1.3,
          color: "248,139,175",
          width: 0.65 * scale
        });
      }

      // Draw a dark pin and a tiny highlight at each anchor.
      for (let i = 0; i < count; i++) {
        const p = point(i, count, radius, cx, cy);

        ctx.beginPath();
        ctx.arc(p.x, p.y, 1.5 * scale, 0, TAU);
        ctx.fillStyle = "rgba(8,12,13,0.9)";
        ctx.fill();

        ctx.beginPath();
        ctx.arc(
          p.x - 0.35 * scale,
          p.y - 0.45 * scale,
          0.55 * scale,
          0,
          TAU
        );
        ctx.fillStyle = "rgba(246,216,225,0.8)";
        ctx.fill();
      }
    }

    function resize() {
      const cssSize = canvas.getBoundingClientRect().width;
      const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);

      size = Math.max(1, Math.round(cssSize * pixelRatio));

      canvas.width = size;
      canvas.height = size;

      draw();
    }

    function stopAnimation() {
      if (animationId !== null) {
        cancelAnimationFrame(animationId);
      }

      animationId = null;
      previousTime = 0;

      document.getElementById("animate").textContent =
        "Animate pattern";
    }

    function animate(time) {
      if (!previousTime) previousTime = time;

      const delta = Math.min((time - previousTime) / 1000, 0.05);
      previousTime = time;

      let value = Number(controls.pattern.value) + delta * 0.12;
      if (value > 7) value = 2;

      controls.pattern.value = value.toFixed(2);
      draw();

      animationId = requestAnimationFrame(animate);
    }

    Object.values(controls).forEach(control => {
      control.addEventListener("input", draw);
    });

    document.getElementById("animate").addEventListener("click", () => {
      if (animationId !== null) {
        stopAnimation();
      } else {
        document.getElementById("animate").textContent =
          "Stop animation";
        animationId = requestAnimationFrame(animate);
      }
    });

    document.getElementById("reset").addEventListener("click", () => {
      stopAnimation();
      controls.pins.value = 240;
      controls.pattern.value = 2;
      controls.opacity.value = 0.20;
      draw();
    });

    document.getElementById("download").addEventListener("click", () => {
      canvas.toBlob(blob => {
        if (!blob) return;

        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");

        link.href = url;
        link.download = "pink-string-art.png";
        link.click();

        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }, "image/png");
    });

    new ResizeObserver(resize).observe(canvas);
  </script>
</body>
</html>
