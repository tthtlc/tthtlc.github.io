<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Opaque Silver Hemisphere</title><style>body{margin:0;background:#090a0d;color:#e5e8ed;font:12px system-ui;overflow:hidden}canvas{display:block}header{position:fixed;top:22px;left:24px;pointer-events:none;letter-spacing:.15em}header small{display:block;color:#9299a2;letter-spacing:.02em;margin-top:8px}.panel{position:fixed;bottom:20px;left:20px;background:#14171de8;border:1px solid #ffffff25;border-radius:12px;padding:14px 18px;width:245px}.row{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:10px 0}input{width:125px;accent-color:#dbe2ee}button{background:#2b3039;color:white;border:1px solid #ffffff30;border-radius:6px;padding:7px;cursor:pointer}#status{position:fixed;right:20px;bottom:22px;color:#9ba1ab;font-size:11px}@media(max-width:600px){#status{display:none}}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script></head><body><header>OPAQUE SILVER / CUTAWAY<small>Solid chrome ball · Solid hemispherical shell</small></header><div class="panel"><div class="row"><label>Rotation speed</label><input id="speed" type="range" min="0" max="2" step=".01" value=".65"></div><div class="row"><label>Exposure</label><input id="exposure" type="range" min=".3" max="2" step=".01" value="1"></div><div class="row"><label>Surface grid</label><input id="grid" type="checkbox" checked></div><div class="row"><button id="pause">Pause</button><button id="reset">Reset view</button><button id="full">Full screen</button></div></div><div id="status">Drag to orbit · Scroll to zoom · No transparent surfaces</div><script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x090a0d);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=THREE.ACESFilmicToneMapping;document.body.prepend(renderer.domElement);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.05,80);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.minDistance=5;controls.maxDistance=18;function reset(){camera.position.set(.1,.35,10.7);controls.target.set(0,0,0);controls.update()}reset();
const c=document.createElement('canvas');c.width=2048;c.height=1024;const cx=c.getContext('2d');const bg=cx.createLinearGradient(0,0,0,1024);bg.addColorStop(0,'#aeb5bf');bg.addColorStop(.3,'#30353d');bg.addColorStop(.52,'#08090c');bg.addColorStop(1,'#67707e');cx.fillStyle=bg;cx.fillRect(0,0,2048,1024);for(const [x,w] of [[65,90],[390,190],[900,55],[1240,250],[1800,65]]){const g=cx.createLinearGradient(x-40,0,x+w+40,0);g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(.22,'#ffffff');g.addColorStop(.78,'#ffffff');g.addColorStop(1,'rgba(255,255,255,0)');cx.fillStyle=g;cx.fillRect(x-40,100,w+80,805)}cx.fillStyle='#ecf0f6';cx.fillRect(0,60,2048,28);cx.fillStyle='#7a828e';cx.fillRect(0,925,2048,30);const tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;tex.mapping=THREE.EquirectangularReflectionMapping;const gen=new THREE.PMREMGenerator(renderer);scene.environment=gen.fromEquirectangular(tex).texture;gen.dispose();tex.dispose();
// Every geometric surface is opaque, depth-writing metal. No alpha cutout or blending.
const silver=new THREE.MeshStandardMaterial({color:0xe5e8ee,metalness:1,roughness:.17,envMapIntensity:1.25,transparent:false,opacity:1,side:THREE.DoubleSide});const edgeMat=new THREE.MeshStandardMaterial({color:0xf0f2f6,metalness:1,roughness:.22});const gridMat=new THREE.MeshStandardMaterial({color:0x959da9,metalness:1,roughness:.28});scene.add(new THREE.HemisphereLight(0xffffff,0x323744,.7));for(const [x,y,z,intensity] of [[-4,5,5,70],[4,1,3,50],[0,-4,1,25]]){const l=new THREE.PointLight(0xffffff,intensity);l.position.set(x,y,z);scene.add(l)}
const shell=new THREE.Group();scene.add(shell);const R=3.32,thickness=.055;
// phi = PI..2PI is the rear half (negative Z). The front half does not exist.
for(const r of [R,R+thickness])shell.add(new THREE.Mesh(new THREE.SphereGeometry(r,128,96,Math.PI,Math.PI),silver));
const rim=new THREE.Mesh(new THREE.RingGeometry(R,R+thickness,256),edgeMat);shell.add(rim);
const outerGrid=new THREE.Group();shell.add(outerGrid);
function tube(points,radius,material,parent,closed=false){const curve=new THREE.CatmullRomCurve3(points,closed);const m=new THREE.Mesh(new THREE.TubeGeometry(curve,points.length*2,radius,5,closed),material);parent.add(m)}
// Raised metallic meridians and parallels lie on a continuous solid backing.
for(let i=1;i<44;i++){const theta=Math.PI*i/44;const pts=[];for(let j=0;j<=100;j++){const phi=Math.PI+Math.PI*j/100;pts.push(new THREE.Vector3(-Math.cos(phi)*Math.sin(theta)*(R-.005),Math.cos(theta)*(R-.005),Math.sin(phi)*Math.sin(theta)*(R-.005)))}tube(pts,.008,gridMat,outerGrid)}
for(let i=0;i<=48;i++){const phi=Math.PI+Math.PI*i/48;const pts=[];for(let j=0;j<=100;j++){const theta=.005+(Math.PI-.01)*j/100;pts.push(new THREE.Vector3(-Math.cos(phi)*Math.sin(theta)*(R-.005),Math.cos(theta)*(R-.005),Math.sin(phi)*Math.sin(theta)*(R-.005)))}tube(pts,.008,gridMat,outerGrid)}
const ball=new THREE.Group();ball.position.set(0,.8,.1);scene.add(ball);const bR=1.24;ball.add(new THREE.Mesh(new THREE.SphereGeometry(bR,128,96),silver));const ballGrid=new THREE.Group();ball.add(ballGrid);const meridianGeometry=new THREE.TorusGeometry(bR+.002,.006,5,192);for(let i=0;i<40;i++){const m=new THREE.Mesh(meridianGeometry,gridMat);m.rotation.y=Math.PI*i/40;ballGrid.add(m)}for(let i=1;i<40;i++){const theta=Math.PI*i/40;const m=new THREE.Mesh(new THREE.TorusGeometry((bR+.002)*Math.sin(theta),.006,5,160),gridMat);m.rotation.x=Math.PI/2;m.position.y=(bR+.002)*Math.cos(theta);ballGrid.add(m)}ball.rotation.z=.2;
let pause=false;document.querySelector('#pause').onclick=e=>{pause=!pause;e.target.textContent=pause?'Resume':'Pause'};document.querySelector('#reset').onclick=reset;document.querySelector('#exposure').oninput=e=>renderer.toneMappingExposure=+e.target.value;document.querySelector('#grid').onchange=e=>outerGrid.visible=ballGrid.visible=e.target.checked;document.querySelector('#full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
const clock=new THREE.Clock();let t=0;renderer.setAnimationLoop(()=>{const dt=Math.min(clock.getDelta(),.05);if(!pause){const s=+document.querySelector('#speed').value;t+=dt*s;ball.rotation.y+=dt*s*.7;ball.rotation.x+=dt*s*.1;shell.rotation.z-=dt*s*.22;shell.rotation.y=.08*Math.sin(t*.3)}controls.update();renderer.render(scene,camera)});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
