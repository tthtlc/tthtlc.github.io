---
title: "Search"
---
<input type="text" id="searchInput" placeholder="Enter search term..." oninput="updateDropdown()" onkeydown="handleEnter(event)" autocomplete="off" />
<div id="dropdown"></div>
<div id="results"></div>

<style>
    #searchInput {
        width: 300px;
        padding: 8px;
        margin-top: 20px;
    }

    #dropdown {
        border: 1px solid #ddd;
        max-width: 300px;
        display: none;
        position: absolute;
        background-color: #fff;
        z-index: 1000;
    }

    .dropdown-item {
        padding: 8px;
        cursor: pointer;
        border-bottom: 1px solid #ddd;
    }

    .dropdown-item:hover {
        background-color: #f0f0f0;
    }

    #results {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
        margin-top: 20px;
        width: 100%;
        max-width: 1200px;
    }

    .result-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 350px;
        padding: 10px;
        background-color: #fff;
        border: 1px solid #ddd;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        border-radius: 8px;
    }

    iframe {
        width: 100%;
        height: 250px;
        border: 1px solid black;
        margin-top: 10px;
        background-color: #fff;
    }

    canvas {
        width: 100%;
        height: 150px;
        margin-top: 10px;
        border: 1px solid #ddd;
    }

    .result-container a {
        font-size: 14px;
        color: #007bff;
        text-decoration: none;
        margin-bottom: 10px;
    }

    .result-container a:hover {
        text-decoration: underline;
    }

    #gitalk-container {
        width: 600px;
    }
</style>

<script>

    document.addEventListener("contextmenu", function(event) { event.preventDefault(); });

    const htmlFiles = [
{% for f in site.data.visualizations %}'{{ f }}',
{% endfor %}    ];

    let filteredFiles = [];

    function updateDropdown() {
        const searchInput = document.getElementById('searchInput').value.toLowerCase();
        const dropdown = document.getElementById('dropdown');

        dropdown.innerHTML = '';

        if (searchInput) {
            filteredFiles = htmlFiles.filter(file => file.toLowerCase().includes(searchInput));

            if (filteredFiles.length > 0) {
                dropdown.style.display = 'block';
                filteredFiles.forEach(file => {
                    const item = document.createElement('div');
                    item.className = 'dropdown-item';
                    item.textContent = file;
                    item.onclick = () => selectFile(file);
                    dropdown.appendChild(item);
                });
            } else {
                dropdown.style.display = 'none';
            }
        } else {
            dropdown.style.display = 'none';
        }
    }

    function handleEnter(event) {
        if (event.key === 'Enter') {
            document.getElementById('dropdown').style.display = 'none';
            displayAllFiles(filteredFiles);
        }
    }

    function selectFile(file) {
        document.getElementById('searchInput').value = file;
        document.getElementById('dropdown').style.display = 'none';
        displayAllFiles([file]);
    }

    function displayAllFiles(files) {
        const resultsDiv = document.getElementById('results');
        resultsDiv.innerHTML = '';

        files.forEach(file => {
            const resultContainer = document.createElement('div');
            resultContainer.className = 'result-container';

            const fileLink = document.createElement('a');
            fileLink.href = file;
            fileLink.textContent = file;
            fileLink.target = "_blank";
            resultContainer.appendChild(fileLink);

            const iframe = document.createElement('iframe');
            iframe.src = file;
            resultContainer.appendChild(iframe);

            const canvas = document.createElement('canvas');
            resultContainer.appendChild(canvas);

            resultsDiv.appendChild(resultContainer);
        });
    }
</script>
