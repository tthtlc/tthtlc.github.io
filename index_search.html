---
layout: none
title: "Search"
---
<!DOCTYPE html>
<html lang="en">
{% include monograph-head.html %}
<body>
{% include monograph-masthead.html %}

<section class="ma-section">
  <div class="ma-section-head">
    <h2>Search the collection</h2>
  </div>
  <div class="ma-search">
    <input type="text" id="searchInput" placeholder="Enter a search term — e.g. hypotrochoid, mandelbrot, heart…" oninput="updateDropdown()" onkeydown="handleEnter(event)" autocomplete="off" aria-label="Search visualizations">
  </div>
  <div id="dropdown" class="ma-dropdown" hidden></div>
  <div id="results" class="ma-figure-grid" style="margin-top:1.5rem;"></div>
</section>

{% include monograph-footer.html %}

<script>
  document.addEventListener("contextmenu", function(event) { event.preventDefault(); });

  const htmlFiles = [{% for f in site.data.visualizations %}'{{ f }}',{% endfor %}];
  let filteredFiles = [];

  function updateDropdown() {
    const searchInput = document.getElementById('searchInput').value.toLowerCase();
    const dropdown = document.getElementById('dropdown');
    dropdown.innerHTML = '';
    if (searchInput) {
      filteredFiles = htmlFiles.filter(file => file.toLowerCase().includes(searchInput));
      if (filteredFiles.length > 0) {
        filteredFiles.forEach(file => {
          const item = document.createElement('div');
          item.className = 'ma-dropdown-item';
          item.textContent = file;
          item.onclick = () => selectFile(file);
          dropdown.appendChild(item);
        });
        dropdown.hidden = false;
      } else {
        dropdown.hidden = true;
      }
    } else {
      dropdown.hidden = true;
    }
  }

  function handleEnter(event) {
    if (event.key === 'Enter') {
      document.getElementById('dropdown').hidden = true;
      displayAllFiles(filteredFiles);
    }
  }

  function selectFile(file) {
    document.getElementById('searchInput').value = file;
    document.getElementById('dropdown').hidden = true;
    displayAllFiles([file]);
  }

  function pretty(f) {
    return f.replace(/\.html$/, '').replace(/[_-]/g, ' ').replace(/\b\w/g, function (c) { return c.toUpperCase(); });
  }
  function displayAllFiles(files) {
    const resultsDiv = document.getElementById('results');
    resultsDiv.innerHTML = '';
    files.forEach((file, idx) => {
      const fig = document.createElement('div');
      fig.className = 'ma-figure';
      const a = document.createElement('a');
      a.className = 'ma-figure-link';
      a.href = file;
      a.target = '_blank';
      a.rel = 'noopener';
      a.innerHTML =
        '<div class="ma-plate"><iframe src="' + file + '" loading="lazy" title="' + file + ' preview"></iframe><span class="ma-plate-open">Open</span></div>' +
        '<div class="ma-figure-body"><div class="ma-figure-title">' + pretty(file) + '</div>' +
        '<div class="ma-figure-file">Fig. ' + (idx + 1) + ' · ' + file + '</div></div>';
      fig.appendChild(a);
      resultsDiv.appendChild(fig);
    });
  }
</script>
</body>
</html>
