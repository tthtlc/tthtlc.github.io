---
layout: none
title: "All Visualizations"
---
<!DOCTYPE html>
<html lang="en">
{% include monograph-head.html %}
<body>
{% include monograph-masthead.html %}

<section class="ma-section">
  <div class="ma-section-head">
    <h2>All visualizations</h2>
  </div>
  <p class="ma-section-note">Every figure in the collection, in order. Scroll to load more.</p>
</section>

<div id="iframeList"></div>

{% include monograph-footer.html %}

<script>
  const masterList = [{% for f in site.data.visualizations %}'{{ f }}',{% endfor %}];
  let loadIndex = 0;

  function loadIframe() {
    if (loadIndex >= masterList.length) { return; }
    const url = masterList[loadIndex];
    const fileName = url.split('/').pop();
    const wrap = document.createElement('div');
    wrap.className = 'ma-wide';
    wrap.innerHTML =
      '<p class="ma-wide-caption">Figure ' + (loadIndex + 1) + ' · <a href="' + url + '" target="_blank" rel="noopener">' + fileName + '</a></p>' +
      '<iframe src="' + url + '" loading="lazy" title="' + fileName + '"></iframe>';
    document.getElementById('iframeList').appendChild(wrap);
    loadIndex++;
  }

  for (let i = 0; i < 3; i++) { loadIframe(); }

  window.addEventListener('scroll', () => {
    const nearBottom = window.innerHeight + window.scrollY >= document.body.offsetHeight - 200;
    if (nearBottom) { loadIframe(); }
  });
</script>
</body>
</html>
