<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotating Rhombic Icosahedron</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #f0f0f0;
        }
        canvas {
            display: block;
            background-color: white;
        }
        #controls {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid #ccc;
            border-radius: 6px;
            padding: 10px 14px;
            font: 13px/1.6 sans-serif;
            color: #333;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
        }
        #controls label {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #controls button {
            margin-top: 6px;
            padding: 2px 10px;
        }
        #info {
            position: fixed;
            bottom: 10px;
            right: 10px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid #ccc;
            border-radius: 6px;
            padding: 6px 10px;
            font: 12px/1.5 sans-serif;
            color: #555;
        }
    </style>
<!-- Google tag (gtag.js) --> <script async src="https://www.googletagmanager.com/gtag/js?id=G-GEX61LPT08"></script> <script>   window.dataLayer = window.dataLayer || [];   function gtag(){dataLayer.push(arguments);}   gtag('js', new Date());   gtag('config', 'G-GEX61LPT08'); </script> </head>
<body>
<canvas id="myCanvas"></canvas>
<div id="controls">
    <label>Rotation speed (deg/s):
        <input type="range" id="speedSlider" min="0" max="360" step="1" value="60">
        <span id="speedValue">60</span>
    </label>
    <label>Scale:
        <input type="range" id="scaleSlider" min="20" max="100" step="1" value="42">
        <span id="scaleValue">42%</span>
    </label>
    <label>Tilt (deg):
        <input type="range" id="tiltSlider" min="0" max="90" step="1" value="25">
        <span id="tiltValue">25</span>
    </label>
    <label>Light angle (deg):
        <input type="range" id="lightSlider" min="0" max="360" step="1" value="35">
        <span id="lightValue">35</span>
    </label>
    <label><input type="checkbox" id="edgesCheck" checked> Show edges</label>
    <label><input type="checkbox" id="labelsCheck"> Vertex labels</label>
    <button id="resetBtn">Reset rotation</button>
</div>
<div id="info">Rhombic icosahedron &middot; 22 vertices &middot; 20 rhombic faces &middot; geometry from Wolfram <i>RhombicIcosahedron.nb</i></div>
<script>
  document.addEventListener("contextmenu", function(event) { event.preventDefault(); });

    const canvas = document.getElementById("myCanvas");
    const ctx = canvas.getContext("2d");

    function sizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", sizeCanvas);
    sizeCanvas();

    // ---- Geometry from RhombicIcosahedron.nb (PolyhedronData["RhombicIcosahedron"]) ----
    // 22 vertices, numeric coordinates as exported by Mathematica.
    const vertices = [
        [-1.4472135954999579,  0,                    0.22360679774997896],
        [-1.170820393249937,  -0.85065080835204,    -0.22360679774997896],
        [-1.170820393249937,   0.85065080835204,    -0.22360679774997896],
        [-0.8944271909999159,  0,                   -0.6708203932499369],
        [-0.723606797749979,  -0.5257311121191336,   0.6708203932499369],
        [-0.723606797749979,   0.5257311121191336,   0.6708203932499369],
        [-0.4472135954999579, -1.3763819204711736,   0.22360679774997896],
        [-0.4472135954999579,  1.3763819204711736,   0.22360679774997896],
        [-0.276393202250021,  -0.85065080835204,    -0.6708203932499369],
        [-0.276393202250021,   0.85065080835204,    -0.6708203932499369],
        [ 0,                   0,                   -1.118033988749895],
        [ 0,                   0,                    1.118033988749895],
        [ 0.276393202250021,  -0.85065080835204,     0.6708203932499369],
        [ 0.276393202250021,   0.85065080835204,     0.6708203932499369],
        [ 0.4472135954999579, -1.3763819204711736,  -0.22360679774997896],
        [ 0.4472135954999579,  1.3763819204711736,  -0.22360679774997896],
        [ 0.723606797749979,  -0.5257311121191336,  -0.6708203932499369],
        [ 0.723606797749979,   0.5257311121191336,  -0.6708203932499369],
        [ 0.8944271909999159,  0,                    0.6708203932499369],
        [ 1.170820393249937,  -0.85065080835204,     0.22360679774997896],
        [ 1.170820393249937,   0.85065080835204,     0.22360679774997896],
        [ 1.4472135954999579,  0,                   -0.22360679774997896]
    ];

    // 20 rhombic faces (0-based indices into `vertices`).
    const faces = [
        [19, 12,  6, 14],
        [20, 15,  7, 13],
        [ 6,  4,  0,  1],
        [ 7,  2,  0,  5],
        [20, 18, 19, 21],
        [11,  5,  0,  4],
        [12, 11,  4,  6],
        [13,  7,  5, 11],
        [19, 18, 11, 12],
        [20, 13, 11, 18],
        [ 6,  1,  8, 14],
        [17, 15, 20, 21],
        [ 0,  2,  3,  1],
        [ 9,  2,  7, 15],
        [19, 14, 16, 21],
        [ 3,  2,  9, 10],
        [ 1,  3, 10,  8],
        [10,  9, 15, 17],
        [ 8, 10, 16, 14],
        [16, 10, 17, 21]
    ];

    // ---- Controls ----
    let rotationSpeed = 60;
    let scaleFraction = 42;
    let tiltDeg = 25;
    let lightDeg = 35;
    let showEdges = true;
    let showLabels = false;

    const speedInput  = document.getElementById("speedSlider");
    const speedValue  = document.getElementById("speedValue");
    const scaleInput  = document.getElementById("scaleSlider");
    const scaleValue  = document.getElementById("scaleValue");
    const tiltInput   = document.getElementById("tiltSlider");
    const tiltValue   = document.getElementById("tiltValue");
    const lightInput  = document.getElementById("lightSlider");
    const lightValue  = document.getElementById("lightValue");
    const edgesCheck  = document.getElementById("edgesCheck");
    const labelsCheck = document.getElementById("labelsCheck");

    speedInput.addEventListener("input", function() {
        rotationSpeed = parseFloat(speedInput.value);
        speedValue.textContent = rotationSpeed;
    });
    scaleInput.addEventListener("input", function() {
        scaleFraction = parseInt(scaleInput.value, 10);
        scaleValue.textContent = scaleFraction + "%";
    });
    tiltInput.addEventListener("input", function() {
        tiltDeg = parseInt(tiltInput.value, 10);
        tiltValue.textContent = tiltDeg;
    });
    lightInput.addEventListener("input", function() {
        lightDeg = parseInt(lightInput.value, 10);
        lightValue.textContent = lightDeg;
    });
    edgesCheck.addEventListener("change", function() { showEdges = edgesCheck.checked; });
    labelsCheck.addEventListener("change", function() { showLabels = labelsCheck.checked; });
    document.getElementById("resetBtn").addEventListener("click", function() { angle = 0; });

    // ---- 3D math ----
    function rotateY(point, angle) {
        const [x, y, z] = point;
        const c = Math.cos(angle), s = Math.sin(angle);
        return [x * c + z * s, y, -x * s + z * c];
    }
    function rotateX(point, angle) {
        const [x, y, z] = point;
        const c = Math.cos(angle), s = Math.sin(angle);
        return [x, y * c - z * s, y * s + z * c];
    }

    let angle = 0;
    let lastTime = performance.now();

    function render(now) {
        const dt = Math.min((now - lastTime) / 1000, 0.1);
        lastTime = now;

        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.fillStyle = "white";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        const halfMin = Math.min(canvas.width, canvas.height) / 2;
        const scale = halfMin * (scaleFraction / 100);
        const perspective = scale * 2.6;

        const tilt = (tiltDeg * Math.PI) / 180;
        const lightRad = (lightDeg * Math.PI) / 180;
        const Lx = Math.cos(lightRad), Ly = 0.4, Lz = Math.sin(lightRad);
        const Llen = Math.hypot(Lx, Ly, Lz);
        const L = [Lx / Llen, Ly / Llen, Lz / Llen];

        const rotated = vertices.map(function (v) {
            return rotateX(rotateY(v, angle), tilt);
        });

        const projected = rotated.map(function (v) {
            const [x, y, z] = v;
            const p = perspective / (perspective + z);
            return [cx + x * scale * p, cy - y * scale * p, z];
        });

        const faceData = faces.map(function (f) {
            const [a, b, c, d] = f;
            const pa = rotated[a], pb = rotated[b], pc = rotated[c];
            const e1 = [pb[0] - pa[0], pb[1] - pa[1], pb[2] - pa[2]];
            const e2 = [pc[0] - pa[0], pc[1] - pa[1], pc[2] - pa[2]];
            const nx = e1[1] * e2[2] - e1[2] * e2[1];
            const ny = e1[2] * e2[0] - e1[0] * e2[2];
            const nz = e1[0] * e2[1] - e1[1] * e2[0];
            const nlen = Math.hypot(nx, ny, nz) || 1;
            const n = [nx / nlen, ny / nlen, nz / nlen];
            const avgZ = (rotated[a][2] + rotated[b][2] + rotated[c][2] + rotated[d][2]) / 4;
            let diff = n[0] * L[0] + n[1] * L[1] + n[2] * L[2];
            diff = Math.max(0, diff);
            const intensity = 0.25 + 0.75 * diff;
            return { face: f, normal: n, avgZ: avgZ, intensity: intensity };
        });

        const visible = faceData.filter(function (fd) {
            return fd.normal[2] < 0.02;
        });

        visible.sort(function (p, q) { return q.avgZ - p.avgZ; });

        visible.forEach(function (fd) {
            const [a, b, c, d] = fd.face;
            const pa = projected[a], pb = projected[b], pc = projected[c], pd = projected[d];
            const i = fd.intensity;
            const r = Math.round(255 * Math.min(1, 0.95 * i + 0.10));
            const g = Math.round(255 * Math.min(1, 0.78 * i + 0.08));
            const bl = Math.round(255 * Math.min(1, 0.32 * i + 0.05));
            ctx.fillStyle = "rgb(" + r + "," + g + "," + bl + ")";
            ctx.beginPath();
            ctx.moveTo(pa[0], pa[1]);
            ctx.lineTo(pb[0], pb[1]);
            ctx.lineTo(pc[0], pc[1]);
            ctx.lineTo(pd[0], pd[1]);
            ctx.closePath();
            ctx.fill();
        });

        if (showEdges) {
            const seen = Object.create(null);
            ctx.beginPath();
            visible.forEach(function (fd) {
                const f = fd.face;
                for (let k = 0; k < 4; k++) {
                    const u = f[k], w = f[(k + 1) % 4];
                    const key = u < w ? u + "_" + w : w + "_" + u;
                    if (seen[key]) continue;
                    seen[key] = true;
                    const pu = projected[u], pw = projected[w];
                    ctx.moveTo(pu[0], pu[1]);
                    ctx.lineTo(pw[0], pw[1]);
                }
            });
            ctx.strokeStyle = "rgba(40, 30, 10, 0.85)";
            ctx.lineWidth = 1.1;
            ctx.stroke();
        }

        if (showLabels) {
            ctx.fillStyle = "#222";
            ctx.font = "12px sans-serif";
            projected.forEach(function (p, idx) {
                ctx.fillText(idx + 1, p[0] + 5, p[1] - 5);
            });
        }

        angle += (rotationSpeed * Math.PI / 180) * dt;
        requestAnimationFrame(render);
    }

    requestAnimationFrame(render);
</script>
</body>
</html>
