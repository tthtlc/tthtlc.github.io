<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Modulated Harmonic Grid</title><style>*{box-sizing:border-box}body{margin:0;background:#03040c;color:#a9efff;font:12px monospace;overflow:hidden}canvas{display:block;width:100vw;height:100vh}aside{position:fixed;top:18px;left:18px;width:290px;padding:16px;background:#081020e8;border:1px solid #16bedc77;box-shadow:inset 3px 0 #00e5ff}h1{font-size:14px;letter-spacing:1px;color:#68f5ff;margin:0 0 12px}p{font-size:11px;color:#ed77cf}label{display:flex;justify-content:space-between;align-items:center;margin:13px 0}input{width:125px;accent-color:#ff2bbf}button{font:10px monospace;background:#081524;color:#6afaff;border:1px solid #218598;padding:8px;cursor:pointer}footer{position:fixed;bottom:14px;left:18px;color:#71a0b4;font-size:10px;pointer-events:none}@media(max-width:600px){aside{width:260px;padding:12px}}</style></head><body><canvas id="art"></canvas><aside id="panel"><h1>MODULATED // HARMONICS</h1><p>b_eff(t,u) = b(u) [1 + cos(2t)]</p><label>TIME RATE<input id="speed" type="range" min="0" max="1" step=".01" value=".25"></label><label>CURVE DENSITY<input id="count" type="range" min="12" max="70" value="32"></label><label>FIELD SPREAD<input id="spread" type="range" min=".1" max="1" step=".01" value=".68"></label><label>GRID INTENSITY<input id="grid" type="range" min="0" max="1" step=".01" value=".45"></label><button id="pause">PAUSE</button> <button id="save">SAVE PNG</button> <button id="hide">HIDE UI</button></aside><footer>SPACE: PAUSE / RESUME · H: TOGGLE INTERFACE</footer><script>
'use strict';const $=id=>document.getElementById(id),canvas=$('art'),ctx=canvas.getContext('2d'),layer=document.createElement('canvas'),ink=layer.getContext('2d');let W,H,dpr,time=0,last=0,paused=matchMedia('(prefers-reduced-motion: reduce)').matches;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;for(const c of [canvas,layer]){c.width=Math.round(W*dpr);c.height=Math.round(H*dpr)}ctx.setTransform(dpr,0,0,dpr,0,0);ink.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const colors=[[0,255,244],[36,112,255],[131,58,255],[238,30,255],[255,38,151],[0,255,244]];function neon(p){p=((p%1)+1)%1;const f=p*5,i=Math.floor(f),k=f-i;return colors[i].map((v,j)=>Math.round(v+(colors[i+1][j]-v)*k))}
function background(){ctx.fillStyle='#03040c';ctx.fillRect(0,0,W,H);let g=ctx.createRadialGradient(W*.52,H*.49,0,W*.52,H*.49,Math.max(W,H)*.65);g.addColorStop(0,'#14102b');g.addColorStop(.45,'#070e20');g.addColorStop(1,'#020309');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);const strength=+$('grid').value,horizon=H*.65;ctx.save();ctx.lineWidth=.65;ctx.strokeStyle=`rgba(30,112,160,${strength*.24})`;ctx.beginPath();for(let x=0;x<W;x+=48){ctx.moveTo(x,0);ctx.lineTo(x,horizon)}for(let y=0;y<horizon;y+=48){ctx.moveTo(0,y);ctx.lineTo(W,y)}ctx.stroke();ctx.strokeStyle=`rgba(0,218,255,${strength*.6})`;ctx.beginPath();for(let i=-18;i<=18;i++){ctx.moveTo(W*.5+i*W*.018,horizon);ctx.lineTo(W*.5+i*W*.14,H)}for(let i=0;i<24;i++){const z=((i+time*.7)%24)/24,y=horizon+(H-horizon)*z*z;ctx.moveTo(0,y);ctx.lineTo(W,y)}ctx.stroke();ctx.strokeStyle=`rgba(255,35,187,${strength*.9})`;ctx.shadowColor='#ff23bb';ctx.shadowBlur=12;ctx.beginPath();ctx.moveTo(0,horizon);ctx.lineTo(W,horizon);ctx.stroke();ctx.restore()}
function draw(){background();ink.clearRect(0,0,W,H);const N=+$('count').value,spread=+$('spread').value,rotation=-Math.PI/2+.065*Math.sin(time*.32),cr=Math.cos(rotation),sr=Math.sin(rotation),steps=1100;
// Bound |z| <= max_u(a + 2|b|) to fit the modulated curve without clipping.
let bound=0;for(let j=0;j<N;j++){const q=2*j/(N-1)-1;bound=Math.max(bound,1+.15*spread*q+2*Math.abs(.5+spread*.46*q))}const S=Math.min(W,H)*.42/bound;
ink.save();ink.translate(W*.5,H*.48);ink.globalCompositeOperation='lighter';for(let j=0;j<N;j++){const u=j/(N-1),q=2*u-1,a=1+.15*spread*q,b=.5+spread*.46*q,twist=.14*spread*q+.035*Math.sin(time*.55+q*2);let px,py;
for(let k=0;k<=steps;k++){const t=k/steps*Math.PI*2;
const B=b*(1+Math.cos(2*t));
const phase=-2*t+twist;
const xx=a*Math.cos(t)+B*Math.cos(phase);
const yy=a*Math.sin(t)+B*Math.sin(phase);
const x=S*(xx*cr-yy*sr),y=S*(xx*sr+yy*cr);
if(k){const m=(k-.5)/steps*Math.PI*2,Bm=b*(1+Math.cos(2*m)),dB=-2*b*Math.sin(2*m),p=-2*m+twist;
// Full derivative includes the amplitude modulation term dB/dt.
const dx=-a*Math.sin(m)+dB*Math.cos(p)+2*Bm*Math.sin(p);
const dy=a*Math.cos(m)+dB*Math.sin(p)-2*Bm*Math.cos(p);
const v=Math.min(1,Math.hypot(dx,dy)/(a+6*Math.abs(b))),hot=Math.pow(1-v,2.3),rgb=neon(k/steps+.28*u+.045*time);ink.strokeStyle=`rgba(${rgb.join(',')},${.22+.68*Math.pow(hot,.65)})`;ink.lineWidth=.6+1.6*hot;ink.beginPath();ink.moveTo(px,py);ink.lineTo(x,y);ink.stroke()}px=x;py=y;}}ink.restore();ctx.save();ctx.globalCompositeOperation='lighter';ctx.filter='blur(9px)';ctx.globalAlpha=.65;ctx.drawImage(layer,0,0,W,H);ctx.filter='blur(3px)';ctx.globalAlpha=.75;ctx.drawImage(layer,0,0,W,H);ctx.filter='none';ctx.globalAlpha=1;ctx.drawImage(layer,0,0,W,H);ctx.restore();ctx.fillStyle='#00000016';for(let y=0;y<H;y+=4)ctx.fillRect(0,y,W,1);let v=ctx.createRadialGradient(W*.5,H*.5,Math.min(W,H)*.2,W*.5,H*.5,Math.max(W,H)*.7);v.addColorStop(0,'#0000');v.addColorStop(1,'#000b');ctx.fillStyle=v;ctx.fillRect(0,0,W,H)}
function frame(ms){const dt=Math.min((ms-last)/1000||0,.05);last=ms;if(!paused)time+=dt*+$('speed').value*2;draw();requestAnimationFrame(frame)}function toggle(){paused=!paused;$('pause').textContent=paused?'RESUME':'PAUSE'}$('pause').textContent=paused?'RESUME':'PAUSE';$('pause').onclick=toggle;$('hide').onclick=()=>{$('panel').style.display='none'};addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='INPUT'){e.preventDefault();toggle()}if(e.key.toLowerCase()==='h')$('panel').style.display=$('panel').style.display==='none'?'block':'none'});$('save').onclick=()=>{const a=document.createElement('a');a.download='modulated-harmonic-grid.png';a.href=canvas.toDataURL('image/png');a.click()};requestAnimationFrame(frame);
</script></body></html>
