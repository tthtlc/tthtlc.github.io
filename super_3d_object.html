
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Superformula</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0f0f13;
            font-family: 'Courier New', Courier, monospace;
        }
        #title {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffffff;
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
            pointer-events: none;
            opacity: 0.8;
        }
        #formula {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #aaaaaa;
            font-size: 1rem;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 8px;
            backdrop-filter: blur(5px);
        }
    </style>
    <!-- Import Three.js and lil-gui -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
                "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.18.0/dist/lil-gui.esm.min.js"
            }
        }
    </script>
</head>
<body>
    <div id="formula">
        r(ϑ) = ( |cos(mϑ/4) / a|<sup>n2</sup> + |sin(mϑ/4) / b|<sup>n3</sup> )<sup>-1/n1</sup>
    </div>
    <div id="title">THE SUPERFORMULA</div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import GUI from 'lil-gui';

        // --- 1. Scene Setup ---
        const scene = new THREE.Scene();
        // Add a subtle fog for depth
        scene.fog = new THREE.FogExp2(0x0f0f13, 0.05);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 6);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.5;

        // --- 2. Lighting ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xffffff, 2);
        mainLight.position.set(5, 10, 7);
        scene.add(mainLight);

        const fillLight = new THREE.DirectionalLight(0x88bbff, 1);
        fillLight.position.set(-5, -5, -5);
        scene.add(fillLight);

        // --- 3. Superformula Math ---
        function superformula(angle, m, n1, n2, n3, a, b) {
            const part1 = Math.pow(Math.abs(Math.cos(m * angle / 4) / a), n2);
            const part2 = Math.pow(Math.abs(Math.sin(m * angle / 4) / b), n3);
            return Math.pow(part1 + part2, -1 / n1);
        }

        // --- 4. Parameters (Default values to create a shape similar to the image) ---
        const params = {
            theta: { m: 4, n1: 10, n2: 10, n3: 10, a: 1, b: 1 }, // Section
            phi:   { m: 4, n1: 10, n2: 10, n3: 10, a: 1, b: 1 }  // Profile
        };

        let mesh;

        // --- 5. Geometry Generation ---
        function updateGeometry() {
            if (mesh) {
                scene.remove(mesh);
                mesh.geometry.dispose();
            }

            const geometry = new THREE.BufferGeometry();
            const vertices = [];
            const indices = [];
            const normals = [];
            const uvs = [];

            const segments = 128; // Resolution
            const uSteps = segments;
            const vSteps = segments;

            for (let i = 0; i <= vSteps; i++) {
                // Latitude (φ in the formula's context)
                const v = -Math.PI / 2 + (i / vSteps) * Math.PI;
                
                for (let j = 0; j <= uSteps; j++) {
                    // Longitude (ϑ in the formula's context)
                    const u = -Math.PI + (j / uSteps) * Math.PI * 2;

                    // Calculate radii for both angles
                    const r1 = superformula(u, params.theta.m, params.theta.n1, params.theta.n2, params.theta.n3, params.theta.a, params.theta.b);
                    const r2 = superformula(v, params.phi.m, params.phi.n1, params.phi.n2, params.phi.n3, params.phi.a, params.phi.b);

                    // 3D Spherical Product
                    const x = r1 * Math.cos(u) * r2 * Math.cos(v);
                    const y = r1 * Math.sin(u) * r2 * Math.cos(v);
                    const z = r2 * Math.sin(v);

                    vertices.push(x, y, z);
                    uvs.push(j / uSteps, i / vSteps);
                }
            }

            // Generate indices for triangles
            for (let i = 0; i < vSteps; i++) {
                for (let j = 0; j < uSteps; j++) {
                    const a = i * (uSteps + 1) + j;
                    const b = i * (uSteps + 1) + j + 1;
                    const c = (i + 1) * (uSteps + 1) + j;
                    const d = (i + 1) * (uSteps + 1) + j + 1;

                    // Two triangles per quad
                    indices.push(a, b, d);
                    indices.push(a, d, c);
                }
            }

            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
            geometry.setIndex(indices);
            
            // Flat shading is used to get the faceted look from the image
            geometry.computeVertexNormals();

            const material = new THREE.MeshStandardMaterial({
                color: 0x44bbff,
                roughness: 0.3,
                metalness: 0.1,
                flatShading: true, // Gives the sharp geometric look
                side: THREE.DoubleSide
            });

            mesh = new THREE.Mesh(geometry, material);
            scene.add(mesh);
        }

        // Initial build
        updateGeometry();

        // --- 6. GUI Setup ---
        const gui = new GUI({ title: 'Parameters' });
        
        // Add custom styling to the GUI to match the dark theme
        gui.domElement.style.backgroundColor = 'rgba(20, 20, 25, 0.9)';

        const thetaFolder = gui.addFolder('ϑ (Section)');
        thetaFolder.add(params.theta, 'm', 0, 20, 1).name('m').onChange(updateGeometry);
        thetaFolder.add(params.theta, 'n1', 0.1, 50, 0.1).name('n1').onChange(updateGeometry);
        thetaFolder.add(params.theta, 'n2', 0.1, 50, 0.1).name('n2').onChange(updateGeometry);
        thetaFolder.add(params.theta, 'n3', 0.1, 50, 0.1).name('n3').onChange(updateGeometry);
        thetaFolder.add(params.theta, 'a', 0.1, 5, 0.1).name('a').onChange(updateGeometry);
        thetaFolder.add(params.theta, 'b', 0.1, 5, 0.1).name('b').onChange(updateGeometry);

        const phiFolder = gui.addFolder('φ (Profile)');
        phiFolder.add(params.phi, 'm', 0, 20, 1).name('m').onChange(updateGeometry);
        phiFolder.add(params.phi, 'n1', 0.1, 50, 0.1).name('n1').onChange(updateGeometry);
        phiFolder.add(params.phi, 'n2', 0.1, 50, 0.1).name('n2').onChange(updateGeometry);
        phiFolder.add(params.phi, 'n3', 0.1, 50, 0.1).name('n3').onChange(updateGeometry);
        phiFolder.add(params.phi, 'a', 0.1, 5, 0.1).name('a').onChange(updateGeometry);
        phiFolder.add(params.phi, 'b', 0.1, 5, 0.1).name('b').onChange(updateGeometry);

        // --- 7. Window Resize Handling ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- 8. Render Loop ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update(); // Required for auto-rotation and damping
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
