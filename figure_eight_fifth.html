<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="/assets/math-art.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Figure of 8 using Polar Coordinates</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        canvas {
            background-color: white;
            border: 1px solid black;
        }
    
        /* Centered link at the bottom */ 
        .footer-link { 
            position: absolute; 
            bottom: 20px; 
            text-align: center; 
            width: 100%; 
        } 
 
        .footer-link a { 
            font-size: 16px; 
            color: #007bff; 
            text-decoration: none; 
        } 
 
        .footer-link a:hover { 
            text-decoration: underline; 
        } 
</style>
<!-- Google tag (gtag.js) --> <script async src="https://www.googletagmanager.com/gtag/js?id=G-GEX61LPT08"></script> <script>   window.dataLayer = window.dataLayer || [];   function gtag(){dataLayer.push(arguments);}   gtag('js', new Date());   gtag('config', 'G-GEX61LPT08'); </script> </head>
<body>
    <canvas id="figure8Canvas" width="500" height="500"></canvas>

    
    <script> 
document.addEventListener("contextmenu", function(event) { event.preventDefault(); });
        const canvas = document.getElementById('figure8Canvas');
        const ctx = canvas.getContext('2d');
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const scale = 100;
        const parts = 120;
        const step = 2*Math.PI/parts;

        let hueOffset = 0;

        function drawFigure8() {
            // Fade the previous frame slightly so the rainbow line leaves a moving trail
            ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.lineWidth = 2;

            const maxTheta = 16 * Math.PI;
            let px, py;

            for (let theta = 0; theta <= maxTheta; theta += step) {
                // Polar coordinates for figure of 8 (lemniscate of Bernoulli)
                const r = scale * (Math.cos(2 * theta/5));
                const x = r * Math.cos(theta);
                const y = r * Math.sin(theta);

                // Convert to Cartesian coordinates
                const cx = centerX + x;
                const cy = centerY + y;

                if (theta == 0) {
                    px = cx;
                    py = cy;
                } else {
                    // Color each segment by its progress through the curve,
                    // with a hue offset that advances each frame to animate the colors
                    ctx.strokeStyle = `hsl(${((theta / maxTheta) * 360 + hueOffset) % 360}, 100%, 50%)`;
                    ctx.beginPath();
                    ctx.moveTo(px, py);
                    ctx.lineTo(cx, cy);
                    ctx.stroke();

                    px = cx;
                    py = cy;
                }
            }

            // Advance the hue offset so the colors flow along the line each frame
            hueOffset = (hueOffset + 2) % 360;
            requestAnimationFrame(drawFigure8);
        }

        drawFigure8();
    </script>
</body>
</html>
