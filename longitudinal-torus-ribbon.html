<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Longitudinal torus spiral</title><style>*{box-sizing:border-box}body{margin:0;background:#05070b;color:#e7efff;font:14px system-ui}canvas{display:block;width:100vw;height:100vh;touch-action:none}.panel{position:absolute;top:18px;left:18px;width:290px;background:#101724e8;border:1px solid #ffffff25;border-radius:15px;padding:18px}h1{font-size:19px;margin:0 0 10px}p{color:#acbbcf;font-size:13px;line-height:1.5}label{display:flex;justify-content:space-between;margin-top:15px}input[type=range]{width:100%;accent-color:#80dfff}button{background:#ffffff15;color:inherit;border:1px solid #ffffff30;border-radius:8px;padding:9px;margin:15px 5px 0 0}.eq{font:12px monospace;color:#a4d1e8;line-height:1.8;margin-top:15px}@media(max-width:600px){.panel{width:230px;padding:12px;top:8px;left:8px}.eq{display:none}h1{font-size:16px}}</style><canvas id="c"></canvas><section class="panel" id="panel"><h1>Longitudinal spiral ribbon</h1><p>One open band runs lengthwise around the torus, gradually descending from its top to its bottom along the outer surface.</p><label>Longitudinal revolutions <output id="nv"></output></label><input id="n" type="range" min="1" max="24" value="12" step="1"><label>Band coverage <output id="wv"></output></label><input id="w" type="range" min="10" max="90" value="58"><label>Show torus guide <input id="g" type="checkbox"></label><button id="play">Pause</button><button id="reset">Reset view</button><div class="eq">u(t) = 2πNt<br>v(t) = π/2 − πt<br>0 ≤ t ≤ 1<br>Top: z = +r → Bottom: z = −r<br>Drag: rotate · Scroll/pinch: zoom<br>H: hide controls · Space: pause</div></section><script>
const $=id=>document.getElementById(id),c=$('c'),ctx=c.getContext('2d'),TAU=2*Math.PI,R=1.65,r=1;let W,H,mesh=[],guide=[],ends=[],yaw=.25,pitch=.95,zoom=1,playing=true,dirty=true,last=0;const pointers=new Map();let pinch=0;
function resize(){W=innerWidth;H=innerHeight;const d=Math.min(devicePixelRatio||1,2);c.width=W*d;c.height=H*d;ctx.setTransform(d,0,0,d,0,0);dirty=true}addEventListener('resize',resize);resize();
function pt(u,v){return[(R+r*Math.cos(v))*Math.cos(u),(R+r*Math.cos(v))*Math.sin(u),r*Math.sin(v)]}
function build(){const N=+$('n').value,coverage=+$('w').value/100,width=Math.PI/N*coverage,steps=Math.max(700,N*100),K=6;mesh=[];guide=[];$('nv').value=N;$('wv').value=Math.round(coverage*100)+'%';let rows=[];
for(let i=0;i<=steps;i++){let t=i/steps,u=TAU*N*t,v=Math.PI/2-Math.PI*t,row=[];for(let j=0;j<=K;j++){// Taper the short end sections so both endpoints are exactly on the top/bottom circles.
let taper=Math.min(1,t*N*4,(1-t)*N*4);row.push(pt(u,v+(j/K-.5)*width*taper))}rows.push(row)}
for(let i=0;i<steps;i++)for(let j=0;j<K;j++){let t=(i+.5)/steps;mesh.push({p:[rows[i][j],rows[i+1][j],rows[i+1][j+1],rows[i][j+1]],u:TAU*N*t,v:Math.PI/2-Math.PI*t,t})}
ends=[{p:pt(0,Math.PI/2),text:'START · TOP',color:'#8bf1ff'},{p:pt(TAU*N,-Math.PI/2),text:'END · BOTTOM',color:'#ffb475'}];
for(let j=0;j<16;j++)for(let i=0;i<100;i++)guide.push([pt(TAU*i/100,TAU*j/16),pt(TAU*(i+1)/100,TAU*j/16)]);for(let j=0;j<24;j++)for(let i=0;i<60;i++)guide.push([pt(TAU*j/24,TAU*i/60),pt(TAU*j/24,TAU*(i+1)/60)]);dirty=true}
function rot(p){let a=p[0]*Math.cos(yaw)-p[1]*Math.sin(yaw),b=p[0]*Math.sin(yaw)+p[1]*Math.cos(yaw);return[a,b*Math.cos(pitch)-p[2]*Math.sin(pitch),b*Math.sin(pitch)+p[2]*Math.cos(pitch)]}
function project(p){let q=rot(p),s=Math.min(W,H)*.16*zoom*10/(10-q[2]);return[W*.53+q[0]*s,H*.52-q[1]*s,q[2]]}
function draw(){ctx.fillStyle='#05070b';ctx.fillRect(0,0,W,H);if($('g').checked){ctx.lineWidth=.6;ctx.strokeStyle='#879fc62b';ctx.beginPath();for(let [a,b] of guide){a=project(a);b=project(b);ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1])}ctx.stroke()}
const faces=mesh.map(f=>{let p=f.p.map(project);return{f,p,z:p.reduce((a,b)=>a+b[2],0)/4}}).sort((a,b)=>a.z-b.z);
for(let {f,p} of faces){let normal=rot([Math.cos(f.u)*Math.cos(f.v),Math.sin(f.u)*Math.cos(f.v),Math.sin(f.v)]),light=.65+.35*Math.abs(normal[0]*-.3+normal[1]*.4+normal[2]*.866);ctx.fillStyle=`hsl(${190-155*f.t} 85% ${66*light}%)`;ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);for(let k=1;k<4;k++)ctx.lineTo(p[k][0],p[k][1]);ctx.closePath();ctx.fill();ctx.strokeStyle=ctx.fillStyle;ctx.lineWidth=.4;ctx.stroke()}
for(let e of ends){let q=project(e.p);ctx.fillStyle=e.color;ctx.beginPath();ctx.arc(q[0],q[1],5,0,TAU);ctx.fill();ctx.font='bold 12px system-ui';ctx.lineWidth=4;ctx.strokeStyle='#05070b';ctx.strokeText(e.text,q[0]+12,q[1]-10);ctx.fillText(e.text,q[0]+12,q[1]-10)}}
function frame(t){let dt=Math.min((t-last)/1000,.05);last=t;if(playing&&!pointers.size){yaw+=dt*.12;dirty=true}if(dirty){draw();dirty=false}requestAnimationFrame(frame)}
for(let id of ['n','w'])$(id).oninput=build;$('g').onchange=()=>dirty=true;function toggle(){playing=!playing;$('play').textContent=playing?'Pause':'Resume'}function reset(){yaw=.25;pitch=.95;zoom=1;dirty=true}$('play').onclick=toggle;$('reset').onclick=reset;c.ondblclick=reset;
c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});pinch=0};c.onpointermove=e=>{if(!pointers.has(e.pointerId))return;let old=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){yaw+=(e.clientX-old.x)*.007;pitch+=(e.clientY-old.y)*.007}else{let [a,b]=[...pointers.values()],d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch)zoom=Math.max(.3,Math.min(3,zoom*d/pinch));pinch=d}dirty=true};function release(e){pointers.delete(e.pointerId);pinch=0}c.onpointerup=release;c.onpointercancel=release;c.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.3,Math.min(3,zoom*Math.exp(-e.deltaY*.001)));dirty=true},{passive:false});addEventListener('keydown',e=>{if(e.target.matches('input,button'))return;if(e.code==='Space'){e.preventDefault();toggle()}if(e.key.toLowerCase()==='h')$('panel').hidden=!$('panel').hidden});build();requestAnimationFrame(frame);
</script></html>
