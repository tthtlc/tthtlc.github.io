<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genus-One Helicoid – Parametric Surface</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #090a0f;
            font-family: 'STIX Two Text', 'Source Serif', Georgia, 'Times New Roman', serif;
            overflow: hidden;
            color: #e0e6ed;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        canvas { display: block; }

        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(15, 18, 25, 0.85);
            border: 1px solid rgba(0, 210, 255, 0.4);
            border-radius: 12px;
            padding: 20px 24px;
            max-width: 400px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        #info-panel h1 {
            font-size: 18px;
            color: #00d2ff;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }
        #info-panel .formula {
            font-family: 'STIX Two Text', 'Source Serif', Georgia, 'Times New Roman', serif;
            font-size: 14px;
            line-height: 1.8;
            color: #a8d8e8;
            margin-bottom: 14px;
            padding: 10px 14px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
        }
        #info-panel .formula span.var { color: #7ff0ff; font-style: italic; }
        #info-panel .formula .num { color: #e0f0ff; }
        #info-panel .formula .den { color: #ff9df0; }
        #info-panel .params {
            font-size: 13px;
            color: #8a99ad;
            line-height: 1.6;
        }
        #info-panel .params strong { color: #00d2ff; }

        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            background: rgba(15, 18, 25, 0.85);
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 12px;
            padding: 14px 20px;
            backdrop-filter: blur(10px);
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }
        #controls label {
            font-size: 13px;
            color: #c2d0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #controls input[type="range"] {
            width: 100px;
            accent-color: #00d2ff;
        }
        #controls button {
            background: rgba(0, 210, 255, 0.15);
            border: 1px solid rgba(0, 210, 255, 0.5);
            color: #00d2ff;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }
        #controls button:hover {
            background: rgba(0, 210, 255, 0.35);
        }
        #controls button.active {
            background: rgba(0, 210, 255, 0.5);
            color: #fff;
        }

        .value-display {
            color: #00d2ff;
            font-weight: bold;
            min-width: 30px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="info-panel">
        <h1>🌀 Genus-One Helicoid</h1>
        <div class="formula">
            <span class="var">x</span>(<span class="var">u</span>,<span class="var">v</span>) =
            <span class="num">u·cos v</span> &nbsp;(+ handle modulation)<br>
            <span class="var">y</span>(<span class="var">u</span>,<span class="var">v</span>) =
            <span class="num">u·sin v</span><br>
            <span class="var">z</span>(<span class="var">u</span>,<span class="var">v</span>) =
            <span class="num">(p/π)·v − T·p</span><br>
            <span class="den">p</span> = pitch, &nbsp;<span class="den">T</span> = turns
        </div>
        <div class="params">
            <strong>Helicoid with a genus-one handle</strong><br>
            <span class="var">u</span> ∈ [−220, 220] &nbsp;|&nbsp;
            <span class="var">v</span> ∈ [0, 2π·T]<br>
            A minimal surface pierced by a tunnel near its axis.
        </div>
    </div>

    <div id="controls">
        <label>U Segments:
            <input type="range" id="segmentsU" min="20" max="200" step="10" value="100">
            <span class="value-display" id="segmentsUVal">100</span>
        </label>
        <label>V Segments:
            <input type="range" id="segmentsV" min="40" max="400" step="10" value="240">
            <span class="value-display" id="segmentsVVal">240</span>
        </label>
        <label>Turns:
            <input type="range" id="turns" min="1" max="5" step="0.5" value="2">
            <span class="value-display" id="turnsVal">2.0</span>
        </label>
        <label>Handle:
            <input type="range" id="handle" min="0" max="100" step="5" value="50">
            <span class="value-display" id="handleVal">0.50</span>
        </label>
        <button id="toggleWireframe">Wireframe</button>
        <button id="toggleAutoRotate" class="active">Auto Rotate</button>
        <button id="resetView">Reset View</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // ─── Scene Setup ───
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        // Gradient background
        const bgCanvas = document.createElement('canvas');
        bgCanvas.width = 512; bgCanvas.height = 512;
        const bgCtx = bgCanvas.getContext('2d');
        const gradient = bgCtx.createRadialGradient(256, 256, 0, 256, 256, 362);
        gradient.addColorStop(0, '#1a2a3a');
        gradient.addColorStop(0.5, '#0d1420');
        gradient.addColorStop(1, '#05060a');
        bgCtx.fillStyle = gradient;
        bgCtx.fillRect(0, 0, 512, 512);
        const bgTexture = new THREE.CanvasTexture(bgCanvas);
        scene.background = bgTexture;

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(4, 3, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.2;

        // ─── Lighting ───
        const ambientLight = new THREE.AmbientLight(0x303048, 0.7);
        scene.add(ambientLight);

        const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.0);
        dirLight1.position.set(5, 8, 5);
        dirLight1.castShadow = true;
        scene.add(dirLight1);

        const dirLight2 = new THREE.DirectionalLight(0x4488cc, 0.5);
        dirLight2.position.set(-5, -3, -5);
        scene.add(dirLight2);

        const pointLight = new THREE.PointLight(0x00d2ff, 0.4, 20);
        pointLight.position.set(0, 3, 0);
        scene.add(pointLight);

        // ─── Genus-One Helicoid Parametrization ───
        // Raw coordinates are in the ±220 range; scale + center to sit at the origin.
        const SCALE = 0.007;
        const PITCH = 35;
        const U_MAX = 220;
        const HOLE = 18; // radial gap near the axis, bridged by the handle tube

        let numTurns = 2;
        let handleSize = 0.5;

        function helicoidPoint(u, v) {
            const rMin = 35 + handleSize * 20;

            // Clamp u to avoid the singularity at the center
            const sign = Math.sign(u) || 1;
            const uClamped = sign * Math.max(Math.abs(u), rMin * 0.4);

            // Base helicoid
            let x = uClamped * Math.cos(v);
            let y = uClamped * Math.sin(v);
            let z = (v / Math.PI) * PITCH - numTurns * PITCH;

            // Handle modulation near the axis
            const dist = Math.sqrt(x * x + y * y);
            const handleFactor = Math.exp(-dist * dist / (rMin * rMin * 1.5));
            const handleR = rMin * handleSize * 1.8;

            // Push the surface away from the axis near the center to form the tunnel
            const radialPush = handleFactor * handleR * 0.4;
            x += radialPush * Math.cos(v);
            y += radialPush * Math.sin(v);

            // Z-modulation for the handle curvature
            z += handleFactor * handleR * Math.sin(v * 2) * 0.4;

            return { x, y, z };
        }

        // Handle tube (torus-like connection through the center)
        function handlePoint(t, phi) {
            const rMin = 35 + handleSize * 20;
            const majorR = rMin * 0.7;
            const tubeR = 10 + handleSize * 8;

            const x = (majorR + tubeR * Math.cos(phi)) * Math.cos(t);
            const y = (majorR + tubeR * Math.cos(phi)) * Math.sin(t);
            const z = tubeR * Math.sin(phi) + Math.sin(t * 2) * 15;

            return { x, y, z };
        }

        // HSL → RGB for iridescent vertex coloring.
        function hslToRgb(h, s, l) {
            const c = (1 - Math.abs(2 * l - 1)) * s;
            const x = c * (1 - Math.abs(((h * 6) % 2) - 1));
            const m = l - c / 2;
            let r = 0, g = 0, b = 0;
            if (h < 1 / 6)      { r = c; g = x; b = 0; }
            else if (h < 2 / 6) { r = x; g = c; b = 0; }
            else if (h < 3 / 6) { r = 0; g = c; b = x; }
            else if (h < 4 / 6) { r = 0; g = x; b = c; }
            else if (h < 5 / 6) { r = x; g = 0; b = c; }
            else                { r = c; g = 0; b = x; }
            return { r: r + m, g: g + m, b: b + m };
        }

        // ─── Surface Generation ───
        let surfaceMesh = null;
        let handleMesh = null;
        let wireframeMesh = null;
        let handleWireMesh = null;
        let showWireframe = false;

        const surfaceMaterial = new THREE.MeshPhongMaterial({
            vertexColors: true,
            side: THREE.DoubleSide,
            shininess: 60,
            specular: new THREE.Color(0x446688),
            flatShading: false,
            transparent: false,
            opacity: 1.0
        });

        const handleMaterial = new THREE.MeshPhongMaterial({
            color: 0xb06a3a,
            side: THREE.DoubleSide,
            shininess: 40,
            specular: new THREE.Color(0x331c0f),
            flatShading: false
        });

        const wireMaterial = new THREE.LineBasicMaterial({
            color: 0x003344,
            transparent: true,
            opacity: 0.35
        });

        const handleWireMaterial = new THREE.LineBasicMaterial({
            color: 0x2a1606,
            transparent: true,
            opacity: 0.3
        });

        // Build a parametric mesh over (a, b) with iridescent vertex colors.
        // skipA(a) can skip whole rows of triangles (used to leave the axis hole).
        function createSurface(pointFn, aMin, aMax, aSteps, bMin, bMax, bSteps, skipA) {
            const vertices = [];
            const colors = [];
            const indices = [];

            const da = (aMax - aMin) / aSteps;
            const db = (bMax - bMin) / bSteps;

            for (let i = 0; i <= aSteps; i++) {
                const a = aMin + i * da;
                for (let j = 0; j <= bSteps; j++) {
                    const b = bMin + j * db;
                    const p = pointFn(a, b);
                    vertices.push(p.x * SCALE, p.y * SCALE, p.z * SCALE);

                    const hue = (((a - aMin) / (aMax - aMin)) * 0.55 + ((b - bMin) / (bMax - bMin)) * 0.45) % 1.0;
                    const { r, g, b: bl } = hslToRgb(hue, 0.85, 0.55);
                    colors.push(r, g, bl);
                }
            }

            for (let i = 0; i < aSteps; i++) {
                const a1 = aMin + i * da;
                const a2 = aMin + (i + 1) * da;
                if (skipA && (skipA(a1) || skipA(a2))) continue;
                for (let j = 0; j < bSteps; j++) {
                    const a = i * (bSteps + 1) + j;
                    const b = a + (bSteps + 1);
                    const c = a + 1;
                    const d = b + 1;

                    indices.push(a, b, c);
                    indices.push(c, b, d);
                }
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            geometry.setIndex(indices);
            geometry.computeVertexNormals();

            return geometry;
        }

        function buildSurface() {
            const segmentsU = parseInt(document.getElementById('segmentsU').value);
            const segmentsV = parseInt(document.getElementById('segmentsV').value);

            // Remove old meshes (dispose only geometries; materials are shared)
            [surfaceMesh, handleMesh, wireframeMesh, handleWireMesh].forEach(m => {
                if (m) { scene.remove(m); if (m.geometry) m.geometry.dispose(); }
            });

            const vMax = numTurns * 2 * Math.PI;

            // Main helicoid with a hole near the axis
            const mainGeo = createSurface(
                helicoidPoint, -U_MAX, U_MAX, segmentsU, 0, vMax, segmentsV,
                (a) => Math.abs(a) < HOLE
            );
            surfaceMesh = new THREE.Mesh(mainGeo, surfaceMaterial);
            surfaceMesh.castShadow = true;
            surfaceMesh.receiveShadow = true;
            scene.add(surfaceMesh);

            // Handle tube through the center
            const handleGeo = createSurface(handlePoint, 0, 2 * Math.PI, 40, 0, 2 * Math.PI, 20);
            handleMesh = new THREE.Mesh(handleGeo, handleMaterial);
            handleMesh.castShadow = true;
            handleMesh.receiveShadow = true;
            scene.add(handleMesh);

            // Wireframes
            const wireGeo = new THREE.WireframeGeometry(mainGeo);
            wireframeMesh = new THREE.LineSegments(wireGeo, wireMaterial);
            wireframeMesh.visible = showWireframe;
            scene.add(wireframeMesh);

            const handleWireGeo = new THREE.WireframeGeometry(handleGeo);
            handleWireMesh = new THREE.LineSegments(handleWireGeo, handleWireMaterial);
            handleWireMesh.visible = showWireframe;
            scene.add(handleWireMesh);
        }

        buildSurface();

        // ─── Controls ───
        const sliderBindings = [
            ['segmentsU', 'segmentsUVal', (v) => parseInt(v)],
            ['segmentsV', 'segmentsVVal', (v) => parseInt(v)],
            ['turns', 'turnsVal', (v) => parseFloat(v)],
            ['handle', 'handleVal', (v) => parseInt(v) / 100]
        ];

        const displayFormat = {
            segmentsUVal: (v) => v,
            segmentsVVal: (v) => v,
            turnsVal: (v) => v.toFixed(1),
            handleVal: (v) => v.toFixed(2)
        };

        sliderBindings.forEach(([inputId, displayId, parse]) => {
            const el = document.getElementById(inputId);
            const disp = document.getElementById(displayId);
            el.addEventListener('input', () => {
                const value = parse(el.value);
                if (inputId === 'turns') numTurns = value;
                if (inputId === 'handle') handleSize = value;
                disp.textContent = displayFormat[displayId](value);
                buildSurface();
            });
        });

        document.getElementById('toggleWireframe').addEventListener('click', function() {
            showWireframe = !showWireframe;
            if (wireframeMesh) wireframeMesh.visible = showWireframe;
            if (handleWireMesh) handleWireMesh.visible = showWireframe;
            this.classList.toggle('active', showWireframe);
        });

        document.getElementById('toggleAutoRotate').addEventListener('click', function() {
            controls.autoRotate = !controls.autoRotate;
            this.classList.toggle('active', controls.autoRotate);
        });

        document.getElementById('resetView').addEventListener('click', () => {
            camera.position.set(4, 3, 5);
            controls.target.set(0, 0, 0);
            controls.update();
        });

        // ─── Animation Loop ───
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // ─── Resize ───
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
